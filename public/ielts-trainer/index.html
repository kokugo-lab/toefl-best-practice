    ${s.c.map((c,i)=>`${ch.v.map((row,k)=>`<rect x="${L+i*gw+gw*.15+k*bw}" y="${ys(row[i])}" width="${bw-2}" height="${H-B-ys(row[i])}" rx="2" fill="${PAL[k]}"/>`).join('')}<text x="${L+i*gw+gw/2}" y="${H-12}" text-anchor="middle" font-size="9.5">${c}</text>`).join('')}
    <text x="6" y="10" font-weight="700">${s.u}</text></svg>${leg(s.g)}`}
  if(ch.type==='pie'){const pie=(v,cx)=>{let a=-Math.PI/2;return v.map((x,k)=>{const b=a+x/100*2*Math.PI;const p=`M${cx},95 L${cx+70*Math.cos(a)},${95+70*Math.sin(a)} A70,70 0 ${x>50?1:0} 1 ${cx+70*Math.cos(b)},${95+70*Math.sin(b)}Z`;const m=(a+b)/2;a=b;
      return `<path d="${p}" fill="${PAL[k]}" stroke="var(--paper)" stroke-width="1.5"/>${x>=6?`<text x="${cx+46*Math.cos(m)}" y="${99+46*Math.sin(m)}" text-anchor="middle" fill="#fff" font-weight="800">${x}%</text>`:''}`}).join('')};
    g=`<svg viewBox="0 0 340 200" class="t1g">${pie(ch.v[0],85)}${pie(ch.v[1],255)}<text x="85" y="192" text-anchor="middle" font-weight="800">${s.g[0]}</text><text x="255" y="192" text-anchor="middle" font-weight="800">${s.g[1]}</text></svg>${leg(s.c)}`}
  if(ch.type==='table')g=`<table class="t1t"><tr><th></th>${s.c.map(c=>`<th>${c}</th>`).join('')}</tr>${s.r.map((r,i)=>`<tr><th>${r}</th>${ch.v[i].map(v=>`<td>${v.toLocaleString('en-GB')}</td>`).join('')}</tr>`).join('')}</table>`;
  if(ch.type==='process')g=`<div class="proc">${s.st.map((x,i)=>`<div><b>${i+1}</b>${x}</div>`).join('<span>→</span>')}</div>`;
  if(ch.type==='map'){const one=(it,yr)=>`<div><b>${yr}</b><svg viewBox="0 0 160 120" class="t1g"><rect x="1" y="1" width="158" height="118" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>${it.map(([n,x,y,w,h],k)=>`<rect x="${4+x*38}" y="${4+y*38}" width="${w*38-4}" height="${h*38-4}" rx="4" fill="${PAL[k%5]}" opacity=".25"/><text x="${4+x*38+(w*38-4)/2}" y="${4+y*38+(h*38-4)/2+3}" text-anchor="middle" font-size="9" font-weight="700">${n}</text>`).join('')}<text x="152" y="14" font-size="10" font-weight="800">N↑</text></svg></div>`;
    g=`<div class="maps">${one(s.a,s.y[0])}${one(s.b,s.y[1])}</div>`}
  return g}
const leg=a=>`<div class="leg">${a.map((x,k)=>`<span><i style="background:${PAL[k]}"></i>${x}</span>`).join('')}</div>`;
const T1TAIL='Summarise the information by selecting and reporting the main features, and make comparisons where relevant.';
/* ---------- writing ---------- */
function wStart(kind){const seed=Math.floor(Math.random()*1e9);const tasks=[];
  if(kind!=='t2')tasks.push({k:'w1',seed});if(kind!=='t1')tasks.push({k:'w2',ti:E.T2.indexOf(pickFresh(E.T2,'t2'))});
  S.wcur={kind,title:{both:'Task 1＋2',t1:'Task 1',t2:'Task 2'}[kind],mins:{both:60,t1:20,t2:40}[kind],start:Date.now(),tasks,text:{},tab:0};save();wRun()}
const wc=s=>(s.trim().match(/[A-Za-z0-9’'-]+/g)||[]).length;
function wSt(t){return t.k==='w1'?{part:'w1',chart:t1Make(t.seed)}:{part:'w2',task:E.T2[t.ti]}}
function wRun(){exClear();const W=S.wcur;if(!W){exMenu();return}wake();const t=W.tasks[W.tab];const st=wSt(t);const need=t.k==='w1'?150:250;
  const prompt=t.k==='w1'?`<p class="tp">You should spend about 20 minutes on this task.</p><div class="tbox"><b>${esc(st.chart.s.p)}</b><br>${T1TAIL}</div>${t1HTML(st.chart)}<p class="tp">Write at least 150 words.</p>`
    :`<p class="tp">You should spend about 40 minutes on this task. Write about the following topic:</p><div class="tbox"><b>${esc(st.task.q).replace(/\n\n/g,'<br><br>')}</b><br><br>Give reasons for your answer and include any relevant examples from your own knowledge or experience.</div><p class="tp">Write at least 250 words.</p>`;
  app.innerHTML=`<div class="exh"><button class="back" id="bk">← 中断</button><span class="wclock" id="wck">--:--</span></div>
  ${W.tasks.length>1?`<div class="tabs">${W.tasks.map((x,i)=>`<button class="chip ${i===W.tab?'done':''}" data-tab="${i}">${x.k==='w1'?'Task 1':'Task 2'}<small>${wc(W.text[i]||'')}語</small></button>`).join('')}</div>`:''}
  <div class="card" style="--c:${EXC}">${prompt}${S.ex.hint==='now'?`<details class="peek"><summary>答えの例を見る</summary>${modelHTML(st)}</details>`:''}</div>
  <textarea id="wta" class="wta" spellcheck="false" autocapitalize="sentences" placeholder="ここに英語で書く">${esc(W.text[W.tab]||'')}</textarea>
  <div class="wcount"><b id="wn">0</b> words <span>（${need}語以上）</span></div>
  <div class="row"><button class="btn" id="sub" style="background:${EXC}">提出する</button></div><p class="note">書いた文はこの端末に自動で保存されます。中断しても時間は進みます。</p>`;
  const ta=$('wta');const upd=()=>{const n=wc(ta.value);$('wn').textContent=n;$('wn').style.color=n>=need?'var(--ok)':'';};upd();
  ta.oninput=()=>{W.text[W.tab]=ta.value;upd();const tb=app.querySelector(`[data-tab="${W.tab}"] small`);if(tb)tb.textContent=wc(ta.value)+'語';clearTimeout(ta._s);ta._s=setTimeout(save,400)};
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{W.text[W.tab]=ta.value;W.tab=+b.dataset.tab;save();wRun()});
  $('bk').onclick=()=>{W.text[W.tab]=ta.value;save();exQuit();exMenu()};
  let arm=false;$('sub').onclick=()=>{if(!arm){arm=true;$('sub').textContent='もう一度押すと提出';setTimeout(()=>{arm=false;const b=$('sub');if(b)b.textContent='提出する'},2500);return}W.text[W.tab]=ta.value;wEnd()};
  const tick=()=>{const left=W.mins*60-(Date.now()-W.start)/1000;const c=$('wck');if(!c)return;c.textContent='残り '+secs(left);c.classList.toggle('over',left<300);if(left<=0){W.text[W.tab]=ta.value;toast('時間です');wEnd()}};tick();EX.iv.push(setInterval(tick,1000))}
function wEnd(){exClear();const W=S.wcur;if(!W)return;try{EX.lock&&EX.lock.release()}catch(e){}
  const used=Math.min(W.mins*60,(Date.now()-W.start)/1000);
  const m={d:today(),title:'ライティング '+W.title,sum:W.tasks.map((t,i)=>`${t.k==='w1'?'T1':'T2'} ${wc(W.text[i]||'')}語`).join('・')+`・${secs(used)}`,tasks:W.tasks,texts:W.tasks.map((t,i)=>W.text[i]||''),used};
  S.mocks.push(m);if(S.mocks.length>30)S.mocks=S.mocks.slice(-30);S.wcur=null;gain(20);save();confetti();wReviewHTML(m)}
function wChecks(k,tx){const n=wc(tx),need=k==='w1'?150:250;const paras=tx.split(/\n\s*\n|\n/).filter(p=>p.trim()).length;const ck=[];
  ck.push([n>=need,`語数 ${n}語（${need}語以上）`]);ck.push([paras>=(k==='w1'?3:4),`段落 ${paras}つ（${k==='w1'?'3〜4':'4〜5'}つが目安）`]);
  if(k==='w1')ck.push([/\boverall\b/i.test(tx),'Overall で全体の傾向を書いている']);
  else ck.push([/in conclusion|to conclude|to sum up/i.test(tx),'In conclusion で結論を書いている']);
  return `<ul class="ck">${ck.map(([ok,s])=>`<li class="${ok?'ok':'ng'}">${ok?'✓':'△'} ${s}</li>`).join('')}</ul>`}
function wReviewHTML(m){app.innerHTML=`<button class="back" id="bk">← 本番モード</button><div class="card" style="--c:${EXC}"><span class="lab">${m.d}</span><h1 class="jp" style="font-size:26px">${esc(m.title)}のふり返り</h1><p class="lead" style="margin:4px 0 0">かかった時間 ${secs(m.used||0)}</p></div>
  ${m.tasks.map((t,i)=>{const st=wSt(t);return `<div class="card rv" style="--c:${EXC}"><span class="qtag">${t.k==='w1'?'Task 1':'Task 2'}</span>
   ${t.k==='w1'?`<p class="tp"><b>${esc(st.chart.s.p)}</b></p>${t1HTML(st.chart)}`:`<p class="tp"><b>${esc(st.task.q).replace(/\n\n/g,'<br><br>')}</b></p>`}
   ${wChecks(t.k,m.texts[i])}<details open><summary class="note" style="cursor:pointer">自分の答え</summary><div class="mine">${esc(m.texts[i]||'（未記入）').replace(/\n/g,'<br>')}</div></details>${modelHTML(st)}</div>`}).join('')}
  <div class="row"><button class="btn g" id="hm">ホームへ</button><button class="btn" id="ag" style="background:${EXC}">別のお題でもう一度</button></div>`;
  $('bk').onclick=exMenu;$('hm').onclick=home;$('ag').onclick=()=>wStart({'Task 1＋2':'both','Task 1':'t1','Task 2':'t2'}[m.title.replace('ライティング ','')]||'both');scrollTo(0,0)}

$('mpPlay').onclick=()=>{if(!AU.src&&PL.ids.length){plLoad();return}AU.paused?AU.play():AU.pause()};
$('mpNext').onclick=()=>{if(PL.i<PL.ids.length-1){PL.i++;plLoad()}};
$('mpPrev').onclick=()=>{if(PL.i>0){PL.i--;plLoad()}};
$('mpX').onclick=()=>stopTTS();
$('mpLoop').onclick=()=>{PL.loop=!PL.loop;if(PL.loop)PL.rounds=PL.rounds||1;mpSync()};
home();
}
</script>
</body>
