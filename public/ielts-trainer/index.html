you admire.", "say": ["who this person is", "what this person does", "what you do together"], "ex": "and explain why you admire this person.", "en": "The family member I admire most is my mother, who cooked for me every single day when I was in high school.", "jp": "一番尊敬する家族は、高校時代に毎日料理してくれた母。", "p3": [{"q": "Why do fewer families eat together nowadays?", "t": 1, "tag": "文化（核）", "en": "Mainly because people are too busy, and fewer families get together for traditional meals.", "jp": "主に忙しさのせい。伝統料理を家族で囲む機会も減っている。", "a": "x_bdc694f7", "m": ["I think it is mainly because people are too busy.", "Many parents work long hours, so children often eat alone.", "#1c1:2", "I think this is a real loss."]}, {"q": "Is it important for families to spend time together?", "t": 1, "tag": "①続き 核", "en": "", "jp": "家族で食卓を囲む時間が減っている → 心にも体にも大切（①続きの核）", "a": "x_0cdabfac", "m": ["Yes, very important, because family meals are a chance to share our worries.", "#1c1:2", "#1a4"]}, {"q": "Should people cook at home more often?", "t": 1, "tag": "①続き C", "en": "", "jp": "外食・加工食品が増えた → 健康のために家で作るべき（①続き C）", "a": "x_52174c0f", "m": ["~I think", "they should, if they have time.", "~One reason is the cost.", "Many young people", "~simply can't afford to", "eat out every day.", "~For example,", "when I started living on my own, I learned to cook simple dishes like sukiyaki.", "~In the long run, that can", "help people save money and eat more healthily.", "~That's why I think", "cooking at home is a good habit."]}, {"q": "Should governments encourage healthy lifestyles?", "t": 2, "tag": "責任論 ＋ 貧困", "en": "Yes. People alone cannot change long working hours, so it is the government that must act.", "jp": "はい。長時間労働は個人では変えられないので、動くべきは政府。", "a": "x_f5366d93", "m": ["~I think", "they should, especially for children.", "~One reason is the cost.", "Some families", "~simply can't afford to", "join a gym or buy healthy food.", "~For example,", "a free school lunch can make a real difference to a family on a tigh st.", "Some families", "~simply can't afford to", "buy fresh vegetables every day.", "~For example,", "a burger can be cheaper than a healthy home-cooked meal.", "~In the long run, that can", "lead to serious health problems.", "~That's why I think", "schools should teach children how to cook simple, healthy meals."]}, {"q": "Is social media good for mental health?", "t": 2, "tag": "責任論", "en": "It can be both, so I think clear rules and education are needed.", "jp": "両面ある。だからルールと教育が必要。", "a": "x_20731a58", "m": ["It can be both. It helps us stay in touch, but comparing ourselves with others can make us feel worse.", "#2c1:0", "For example, we can decide not to use our phones at night.", "#2c1:2", "#2c2:0"]}], "a": "x_e81ed08a", "top": "a meal I enjoyed with other people", "m": ["The meal I enjoyed most was a sukiyaki dinner with my family.", "#1a1", "#1a2", "#1a3", "#1a4"]}, {"t": 1, "tag": "①B", "q": "Describe an important change in your life.", "say": ["what the change was", "when it happened", "how it affected you"], "ex": "and explain why it was important.", "en": "The biggest change in my life was starting to live on my own, because it changed how I see my mother.", "jp": "人生最大の変化は一人暮らし。母の見方が変わったから。", "p3": [{"q": "Is it important for families to spend time together?", "t": 1, "tag": "①続き 核", "en": "", "jp": "家族で食卓を囲む時間が減っている → 心にも体にも大切（①続きの核）", "a": "x_0cdabfac", "m": ["Yes, very important, because family meals are a chance to share our worries.", "#1c1:2", "#1a4"]}, {"q": "Why do fewer families eat together nowadays?", "t": 1, "tag": "文化（核）", "en": "Mainly because people are too busy, and fewer families get together for traditional meals.", "jp": "主に忙しさのせい。伝統料理を家族で囲む機会も減っている。", "a": "x_bdc694f7", "m": ["I think it is mainly because people are too busy.", "Many parents work long hours, so children often eat alone.", "#1c1:2", "I think this is a real loss."]}, {"q": "How can people reduce stress?", "t": 2, "tag": "②A（本体）＋ 責任論", "en": "For me, a slow walk by the sea helps a lot. But companies also need to cut down on long working hours.", "jp": "自分は海辺の散歩が効く。でも会社も長時間労働を減らすべき。", "a": "x_9ee840a7", "m": ["There are many ways, but for me, walking is the best.", "#2a2:2", "But walking alone cannot solve the problem of long working hours.", "#2c2:0"]}, {"q": "Should governments encourage healthy lifestyles?", "t": 2, "tag": "責任論 ＋ 貧困", "en": "Yes. People alone cannot change long working hours, so it is the government that must act.", "jp": "はい。長時間労働は個人では変えられないので、動くべきは政府。", "a": "x_f5366d93", "m": ["~I think", "they should, especially for children.", "~One reason is the cost.", "Some families", "~simply can't afford to", "join a gym or buy healthy food.", "~For example,", "a free school lunch can make a real difference to a family on a tight budget.", "~In the long run, that can", "reduce medical costs for everyone.", "~That's why I think", "the government should help, especially with children's meals."]}], "a": "x_e1d5cffc", "top": "an important change in my life", "m": ["The biggest change in my life was starting to live on my own, because it changed how I see my mother.", "Before that, I never thought about who cooked my meals.", "#1a2", "#1a3", "#1a4"]}, {"t": 2, "tag": "②A", "q": "Describe a place where you like to relax.", "say": ["where it is", "how often you go there", "what you do there"], "ex": "and explain why it helps you relax.", "en": "Whenever I need to relax, I go for a walk along the sea at Minato Mirai in Yokohama.", "jp": "くつろぎたいときは、みなとみらいの海沿いを歩く。", "p3": [{"q": "How can people reduce stress?", "t": 2, "tag": "②A（本体）＋ 責任論", "en": "For me, a slow walk by the sea helps a lot. But companies also need to cut down on long working hours.", "jp": "自分は海辺の散歩が効く。でも会社も長時間労働を減らすべき。", "a": "x_9ee840a7", "m": ["There are many ways, but for me, walking is the best.", "#2a2:2", "But walking alone cannot solve the problem of long working hours.", "#2c2:0"]}, {"q": "Is it important to have parks and green spaces in cities?", "t": 2, "tag": "②A ＋ ②続き 核", "en": "", "jp": "海沿いを歩くと落ち着く（②A）→ 都市には自然が必要（②続き 核）", "a": "x_45254f8c", "m": ["Yes, very important, because people need nature to relax.", "For example, I often walk by the sea at Minato Mirai.", "#2a2:2", "#2a3", "So the government should build more green spaces like this."]}, {"q": "What are the pros and cons of living in a big city?", "t": 2, "tag": "②B（本体）＋ 責任論", "en": "Cities are convenient, but they need clear rules to protect nature, like Minato Mirai.", "jp": "便利だが、自然を守るルールが必要。みなとみらいのように。", "a": "x_9192eec8", "m": ["Cities are convenient, but many have lost the balance between city life and nature.", "Minato Mirai in Yokohama is a good example of a better city.", "#2a3", "But this does not happen by itself.", "#2c2:0"]}, {"q": "Who should protect the environment, individuals or governments?", "t": 2, "tag": "責任論（核・結び）", "en": "Both. We can cut down on plastic, but only the government can change the system.", "jp": "両方。個人はプラを減らせるが、仕組みを変えられるのは政府だけ。", "a": "x_df321945", "m": ["Both, I think.", "#2c1", "#2c2"]}], "a": "x_c3b30b2e", "top": "a place where I like to relax", "m": ["Whenever I need to relax, I go to Minato Mirai.", "#2a1", "#2a2", "#2a3", "So whenever I feel stressed, I know where to go."]}, {"t": 2, "tag": "②核", "q": "Describe an area of your city that you like.", "say": ["where it is", "what it looks like", "what people do there"], "ex": "and explain why you like it.", "en": "", "jp": "", "p3": [{"q": "What are the pros and cons of living in a big city?", "t": 2, "tag": "②B（本体）＋ 責任論", "en": "Cities are convenient, but they need clear rules to protect nature, like Minato Mirai.", "jp": "便利だが、自然を守るルールが必要。みなとみらいのように。", "a": "x_9192eec8", "m": ["Cities are convenient, but many have lost the balance between city life and nature.", "Minato Mirai in Yokohama is a good example of a better city.", "#2a3", "But this does not happen by itself.", "#2c2:0"]}, {"q": "Should museums be free for everyone?", "t": 1, "tag": "貧困 ＋ 責任論", "en": "", "jp": "払えない家庭の子が文化を学べなくなる → 政府が支える", "a": "x_66d6c213", "m": ["~I think", "museums should be free, at least for children.", "~One reason is the cost.", "Some families", "~simply can't afford to", "pay for several tickets.", "~For example,", "a family with three children might skip a museum visit because the tickets cost too much altogether.", "~That's why I think", "children should be able to get in for free."]}, {"q": "Is tourism good or bad for the environment?", "t": 1, "tag": "文化 ＋ 責任論", "en": "It can be both. Tourism helps us understand other cultures, but it needs clear rules.", "jp": "両面ある。異文化理解に役立つが、ルールが必要。", "a": "x_3b73a62b", "m": ["It can be both.", "#1c1:0", "Tourism helps people understand other cultures, but it also brings more planes, more traffic and more rubbish.", "#2c2"]}, {"q": "Should cars be banned from city centres?", "t": 2, "tag": "②続き 核 → D", "en": "", "jp": "都市の環境問題（②続き 核）→ 政府のルール作り（D）", "a": "x_80cbef2f", "m": ["Not completely, but there should be far fewer cars, because they cause air pollution.", "Each of us can take the train instead of driving.", "#2c1:2", "#2c2:0"]}, {"q": "Who should protect the environment, individuals or governments?", "t": 2, "tag": "責任論（核・結び）", "en": "Both. We can cut down on plastic, but only the government can change the system.", "jp": "両方。個人はプラを減らせるが、仕組みを変えられるのは政府だけ。", "a": "x_df321945", "m": ["Both, I think.", "#2c1", "#2c2"]}], "a": "x_23708ae1", "top": "an area of my city that I like", "m": ["#2a0", "#2a1", "#2a2", "#2a3", "#2a4"]}, {"t": 2, "tag": "②A", "q": "Describe a walk you enjoyed.", "say": ["where you walked", "who you were with", "what you saw"], "ex": "and explain why you enjoyed it.", "en": "", "jp": "", "p3": [{"q": "How can people reduce stress?", "t": 2, "tag": "②A（本体）＋ 責任論", "en": "For me, a slow walk by the sea helps a lot. But companies also need to cut down on long working hours.", "jp": "自分は海辺の散歩が効く。でも会社も長時間労働を減らすべき。", "a": "x_9ee840a7", "m": ["There are many ways, but for me, walking is the best.", "#2a2:2", "But walking alone cannot solve the problem of long working hours.", "#2c2:0"]}, {"q": "Why do people enjoy visiting the sea?", "t": 2, "tag": "②A", "en": "", "jp": "海沿いを歩くと気持ちが落ち着く（②A）", "a": "x_6de88772", "m": ["I think the sea helps people relax.", "#2a2"]}, {"q": "Is it important to have parks and green spaces in cities?", "t": 2, "tag": "②A ＋ ②続き 核", "en": "", "jp": "海沿いを歩くと落ち着く（②A）→ 都市には自然が必要（②続き 核）", "a": "x_45254f8c", "m": ["Yes, very important, because people need nature to relax.", "For example, I often walk by the sea at Minato Mirai.", "#2a2:2", "#2a3", "So the government should build more green spaces like this."]}, {"q": "Is tourism good or bad for the environment?", "t": 1, "tag": "文化 ＋ 責任論", "en": "It can be both. Tourism helps us understand other cultures, but it needs clear rules.", "jp": "両面ある。異文化理解に役立つが、ルールが必要。", "a": "x_3b73a62b", "m": ["It can be both.", "#1c1:0", "Tourism helps people understand other cultures, but it also brings more planes, more traffic and more rubbish.", "#2c2"]}], "a": "x_049fdcee", "top": "a walk I enjoyed", "m": ["The walk I enjoyed most was an evening walk along the sea at Minato Mirai.", "#2a1", "#2a2", "#2a3", "I walked there with my friend Nasa, and we talked about the future for hours.", "#2a4"]}, {"t": 2, "tag": "②核", "q": "Describe a place near water that you enjoy visiting.", "say": ["where it is", "how you get there", "what you do there"], "ex": "and explain why you enjoy it.", "en": "", "jp": "", "p3": [{"q": "Why do people enjoy visiting the sea?", "t": 2, "tag": "②A", "en": "", "jp": "海沿いを歩くと気持ちが落ち着く（②A）", "a": "x_6de88772", "m": ["I think the sea helps people relax.", "#2a2"]}, {"q": "Is tourism good for poor communities?", "t": 2, "tag": "貧困 ＋ 責任論", "en": "", "jp": "僻地はたいてい貧しい → 観光が仕事とお金を運ぶ → ルールで自然を守る", "a": "x_3a29c2f6", "m": ["~I think", "it is mostly good for them.", "~One reason is the cost.", "Many families in remote areas", "~simply can't afford to", "send their children to university.", "~For example,", "a family that runs a small guesthouse can earn extra money from visitors.", "~In the long run, that can", "give their children more chances in life.", "~That's why I think", "tourism is positive, as long as there are rules to protect nature."]}, {"q": "Is tourism good or bad for the environment?", "t": 1, "tag": "文化 ＋ 責任論", "en": "It can be both. Tourism helps us understand other cultures, but it needs clear rules.", "jp": "両面ある。異文化理解に役立つが、ルールが必要。", "a": "x_3b73a62b", "m": ["It can be both.", "#1c1:0", "Tourism helps people understand other cultures, but it also brings more planes, more traffic and more rubbish.", "#2c2"]}, {"q": "Who should protect the environment, individuals or governments?", "t": 2, "tag": "責任論（核・結び）", "en": "Both. We can cut down on plastic, but only the government can change the system.", "jp": "両方。個人はプラを減らせるが、仕組みを変えられるのは政府だけ。", "a": "x_df321945", "m": ["Both, I think.", "#2c1", "#2c2"]}, {"q": "Should rich countries help poorer countries?", "t": 3, "tag": "貧困 → 教育", "en": "Yes, especially through education, because it breaks the cycle of poverty.", "jp": "はい。特に教育で。貧困の連鎖を断ち切れるから。", "a": "x_1a61001b", "m": ["~I think", "they should, especially through education.", "~One reason is the cost.", "Many families in poor countries", "~simply can't afford to", "send their children to school.", "~For example,", "some children have to work to help their parents instead of studying.", "~In the long run, that can", "keep the whole country poor.", "~That's why I think", "rich countries should help build schools."]}], "a": "x_decc5e96", "top": "a place near water", "m": ["A place near water that I love visiting is Minato Mirai.", "#2a1", "#2a2", "#2a3", "#2a4"]}, {"t": 2, "tag": "②A", "q": "Describe a time you waited for something.", "say": ["what you waited for", "how long you waited", "what you did while you were waiting"], "ex": "and explain how you felt.", "en": "I once waited almost an hour at Minato Mirai just to see the lights come on over the water.", "jp": "水面に明かりがともるのを見るために、みなとみらいで1時間近く待った。", "p3": [{"q": "Are people less patient nowadays?", "t": 3, "tag": "③続き 核", "en": "", "jp": "テクノロジーで何でもすぐ手に入る（③続き 核）", "a": "x_18c69d73", "m": ["Yes, I think so.", "Thanks to technology, we can get almost anything instantly, so waiting feels harder than it used to.", "But some things are worth waiting for. I once waited an hour at Minato Mirai just to see the night view.", "#2a2:1"]}, {"q": "How can people reduce stress?", "t": 2, "tag": "②A（本体）＋ 責任論", "en": "For me, a slow walk by the sea helps a lot. But companies also need to cut down on long working hours.", "jp": "自分は海辺の散歩が効く。でも会社も長時間労働を減らすべき。", "a": "x_9ee840a7", "m": ["There are many ways, but for me, walking is the best.", "#2a2:2", "But walking alone cannot solve the problem of long working hours.", "#2c2:0"]}, {"q": "What are the pros and cons of living in a big city?", "t": 2, "tag": "②B（本体）＋ 責任論", "en": "Cities are convenient, but they need clear rules to protect nature, like Minato Mirai.", "jp": "便利だが、自然を守るルールが必要。みなとみらいのように。", "a": "x_9192eec8", "m": ["Cities are convenient, but many have lost the balance between city life and nature.", "Minato Mirai in Yokohama is a good example of a better city.", "#2a3", "But this does not happen by itself.", "#2c2:0"]}, {"q": "Is social media good for mental health?", "t": 2, "tag": "責任論", "en": "It can be both, so I think clear rules and education are needed.", "jp": "両面ある。だからルールと教育が必要。", "a": "x_20731a58", "m": ["It can be both. It helps us stay in touch, but comparing ourselves with others can make us feel worse.", "#2c1:0", "For example, we can decide not to use our phones at night.", "#2c1:2", "#2c2:0"]}], "a": "x_cb06c67a", "top": "a time I waited for something", "m": ["I once waited almost an hour at Minato Mirai just to see the lights come on over the water.", "#2a1", "#2a2", "At first I felt a little bored, but when the lights came on, I forgot all about the wait.", "#2a3", "#2a4"]}, {"t": 3, "tag": "③核・B", "q": "Describe a friend who is important to you.", "say": ["who this friend is", "how you met", "what you do together"], "ex": "and explain why this friend is important to you.", "en": "", "jp": "", "p3": [{"q": "What makes a good friend?", "t": 3, "tag": "③B（本体）", "en": "Someone who keeps you going. Whenever I feel like giving up, my friend helps me.", "jp": "続ける力をくれる人。くじけそうなとき、友達が支え。", "a": "x_af08a466", "m": ["Someone who keeps you going.", "My friend Nasa is a good example.", "#3a3", "#3a4"]}, {"q": "Do people help others less than in the past?", "t": 3, "tag": "③B → ③続き C", "en": "", "jp": "なさくんが助けてくれた話（③B）→ 社会で助けが必要な人（③続き C）", "a": "x_804a7e76", "m": ["In some ways, yes. People are busier now, and many do not even know their neighbours.", "But helping each other is still important, and the government can support it too.", "#2c2:1"]}, {"q": "Is money the key to success?", "t": 3, "tag": "貧困 ＋ ③B（本体）", "en": "Not entirely, but poverty makes it much harder to succeed, however hard you work.", "jp": "全てではないが、貧困だとどれだけ努力しても成功しにくい。", "a": "x_bada13ee", "m": ["~I think", "money helps, but it isn't everything.", "~One reason is the cost.", "Some families", "~simply can't afford to", "pay for extra lessons or university.", "~For example,", "a talented student may give up on university because of money.", "~In the long run, that can", "waste a lot of talent.", "~That's why I think", "hard work matters, but everyone also needs a fair chance to learn."]}, {"q": "How has technology changed education?", "t": 3, "tag": "③A（本体）＋ 教育", "en": "It has changed it a lot, but not every child can use it.", "jp": "大きく変えた。でも全員が使えるわけではない。", "a": "x_feeca1e9", "m": ["~I think", "it has changed it a lot, but not for everyone.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a tablet or pay for the internet.", "~For example,", "during online classes, some students couldn't join from home.", "~In the long run, that can", "widen the gap between students.", "~That's why I think", "schools should lend tablets to students who need them."]}], "a": "x_e7e5a427", "top": "a friend who is important to me", "m": ["A friend who is very important to me is Nasa.", "#3a1", "#3a2", "#3a3", "#3a4"]}, {"t": 3, "tag": "③A", "q": "Describe an app or a piece of technology you use.", "say": ["what it is", "how you use it", "how long you have used it"], "ex": "and explain how it has helped you.", "en": "", "jp": "", "p3": [{"q": "How has technology changed education?", "t": 3, "tag": "③A（本体）＋ 教育", "en": "It has changed it a lot, but not every child can use it.", "jp": "大きく変えた。でも全員が使えるわけではない。", "a": "x_feeca1e9", "m": ["~I think", "it has changed it a lot, but not for everyone.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a tablet or pay for the internet.", "~For example,", "during online classes, some students couldn't join from home.", "~In the long run, that can", "widen the gap between students.", "~That's why I think", "schools should lend tablets to students who need them."]}, {"q": "Will AI replace teachers?", "t": 3, "tag": "③A（本体）＋ 教育", "en": "I doubt it. Someone still has to teach children to think things through.", "jp": "ないと思う。考え抜く力を教える人は必要。", "a": "x_423dbf99", "m": ["I doubt it. If students rely on AI for answers, someone still has to teach them to think things through.", "Also, AI only helps students who can use it.", "#3c1:1", "#3c2"]}, {"q": "Should children be allowed to use smartphones?", "t": 3, "tag": "③続き 核 ＋ C", "en": "", "jp": "テクノロジーは学びを変える（核）→ ただし使えない子との差（C）", "a": "x_af000617", "m": ["Yes, but with clear rules.", "Phones can be great learning tools, but children can easily spend too much time on them.", "#2c1:0", "For example, families can have no phones at dinner. Schools also need clear rules."]}, {"q": "Why do some children fall behind at school?", "t": 3, "tag": "貧困 → 教育", "en": "Often because of poverty. They can afford neither a tablet nor the internet.", "jp": "多くは貧困が原因。タブレットもネットも買えない。", "a": "x_44665757", "m": ["~I think", "it often comes down to money at home.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a computer or pay for extra lessons.", "~For example,", "a student without a laptop may not be able to finish online homework.", "~In the long run, that can", "limit their job opportunities.", "~That's why I think", "schools should lend laptops to students who need them."]}], "a": "x_1b480ba6", "top": "an app I use", "m": ["An app I use a lot is one I made myself with my friend Nasa.", "#3a1", "#3a2", "It has really helped me, because my students now enjoy my lessons more.", "#3a3", "#3a4"]}, {"t": 3, "tag": "③A", "q": "Describe an achievement you are proud of.", "say": ["what you achieved", "when it happened", "who helped you"], "ex": "and explain why you are proud of it.", "en": "", "jp": "", "p3": [{"q": "Is money the key to success?", "t": 3, "tag": "貧困 ＋ ③B（本体）", "en": "Not entirely, but poverty makes it much harder to succeed, however hard you work.", "jp": "全てではないが、貧困だとどれだけ努力しても成功しにくい。", "a": "x_bada13ee", "m": ["~I think", "money helps, but it isn't everything.", "~One reason is the cost.", "Some families", "~simply can't afford to", "pay for extra lessons or university.", "~For example,", "a talented student may give up on university because of money.", "~In the long run, that can", "waste a lot of talent.", "~That's why I think", "hard work matters, but everyone also needs a fair chance to learn."]}, {"q": "What skills will be important in the future?", "t": 3, "tag": "③続き 核 ＋ D", "en": "", "jp": "テクノロジーを使う力（核）→ 誰でも学べる環境づくり（D）", "a": "x_9cf07598", "m": ["~I think", "computer skills will be very important.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a computer for their children.", "~For example,", "a student who never uses a computer at home may find office work hard later.", "~In the long run, that can", "limit their job oppor o that my quieter students could share their ideas.", "I made it with my friend Nasa.", "#3a1", "#3a2", "After that, even quiet students started to speak up, and that made me really happy.", "#3a3", "#3a4"]}, {"t": 3, "tag": "③A", "q": "Describe a new skill you learned.", "say": ["what the skill is", "how you learned it", "who helped you"], "ex": "and explain how it has been useful to you.", "en": "", "jp": "", "p3": [{"q": "How has technology changed education?", "t": 3, "tag": "③A（本体）＋ 教育", "en": "It has changed it a lot, but not every child can use it.", "jp": "大きく変えた。でも全員が使えるわけではない。", "a": "x_feeca1e9", "m": ["~I think", "it has changed it a lot, but not for everyone.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a tablet or pay for the internet.", "~For example,", "during online classes, some students couldn't join from home.", "~In the long run, that can", "widen the gap between students.", "~That's why I think", "schools should lend tablets to students who need them."]}, {"q": "What skills will be important in the future?", "t": 3, "tag": "③続き 核 ＋ D", "en": "", "jp": "テクノロジーを使う力（核）→ 誰でも学べる環境づくり（D）", "a": "x_9cf07598", "m": ["~I think", "computer skills will be very important.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a computer for their children.", "~For example,", "a student who never uses a computer at home may find office work hard later.", "~In the long run, that can", "limit their job opportunities.", "~That's why I think", "schools should lend laptops to students who need them."]}, {"q": "What makes a good teacher?", "t": 3, "tag": "③B", "en": "", "jp": "なさくんのように、分かるまで付き合ってくれる人（③B）", "a": "x_6989335c", "m": ["I think a good teacher is someone who never gives up on students.", "My friend Nasa, who is also a teacher, is a good example.", "#3a3", "A good teacher does the same for students."]}, {"q": "Why do some children fall behind at school?", "t": 3, "tag": "貧困 → 教育", "en": "Often because of poverty. They can afford neither a tablet nor the internet.", "jp": "多くは貧困が原因。タブレットもネットも買えない。", "a": "x_44665757", "m": ["~I think", "it often comes down to money at home.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a computer or pay for extra lessons.", "~For example,", "a student without a laptop may not be able to finish online homework.", "~In the long run, that can", "limit their job opportunities.", "~That's why I think", "schools should lend laptops to students who need them."]}], "a": "x_a5da9dcc", "top": "a new skill I learned", "m": ["A new skill I learned is making apps.", "I learned it together with my friend Nasa.", "#3a1", "#3a2", "#3a3", "#3a4"]}, {"t": 3, "tag": "③A", "q": "Describe a book or story you enjoyed.", "say": ["what it is about", "when you read it", "why you chose it"], "ex": "and explain why you enjoyed it.", "en": "A story that means a lot to me is Rashomon, which I even turned into an app for my students.", "jp": "思い入れのある物語は『羅生門』。生徒用にアプリにまでした。", "p3": [{"q": "Do young people read less nowadays?", "t": 3, "tag": "③続き 核", "en": "", "jp": "スマホ・テクノロジーで生活が変わった（③続き 核）→ ただしアプリで学ぶ機会も", "a": "x_894fdd98", "m": ["I think they read fewer books, but they actually read a lot on their phones.", "For example, my students really enjoyed reading Rashomon with an app I made.", "So technology can actually help young people read more."]}, {"q": "How has technology changed education?", "t": 3, "tag": "③A（本体）＋ 教育", "en": "It has changed it a lot, but not every child can use it.", "jp": "大きく変えた。でも全員が使えるわけではない。", "a": "x_feeca1e9", "m": ["~I think", "it has changed it a lot, but not for everyone.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a tablet or pay for the internet.", "~For example,", "during online classes, some students couldn't join from home.", "~In the long run, that can", "widen the gap between students.", "~That's why I think", "schools should lend tablets to students who need them."]}, {"q": "What makes a good teacher?", "t": 3, "tag": "③B", "en": "", "jp": "なさくんのように、分かるまで付き合ってくれる人（③B）", "a": "x_6989335c", "m": ["I think a good teacher is someone who never gives up on students.", "My friend Nasa, who is also a teacher, is a good example.", "#3a3", "A good teacher does the same for students."]}, {"q": "Will AI replace teachers?", "t": 3, "tag": "③A（本体）＋ 教育", "en": "I doubt it. Someone still has to teach children to think things through.", "jp": "ないと思う。考え抜く力を教える人は必要。", "a": "x_423dbf99", "m": ["I doubt it. If students rely on AI for answers, someone still has to teach them to think things through.", "Also, AI only helps students who can use it.", "#3c1:1", "#3c2"]}], "a": "x_33566568", "top": "a story I enjoyed", "m": ["A story that means a lot to me is Rashomon, which I even turned into an app for my students.", "I made the app with my friend Nasa.", "#3a1", "#3a2", "#3a3", "#3a4"]}, {"t": 3, "tag": "③核・A", "q": "Describe a time you were very busy.", "say": ["when it was", "what you had to do", "how you managed it"], "ex": "and explain how you felt about being busy.", "en": "The busiest time I remember was when Nasa and I were preparing our app for a national contest.", "jp": "一番忙しかったのは、なさくんとコンテスト用のアプリを準備していたとき。", "p3": [{"q": "How can people reduce stress?", "t": 2, "tag": "②A（本体）＋ 責任論", "en": "For me, a slow walk by the sea helps a lot. But companies also need to cut down on long working hours.", "jp": "自分は海辺の散歩が効く。でも会社も長時間労働を減らすべき。", "a": "x_9ee840a7", "m": ["There are many ways, but for me, walking is the best.", "#2a2:2", "But walking alone cannot solve the problem of long working hours.", "#2c2:0"]}, {"q": "Is social media good for mental health?", "t": 2, "tag": "責任論", "en": "It can be both, so I think clear rules and education are needed.", "jp": "両面ある。だからルールと教育が必要。", "a": "x_20731a58", "m": ["It can be both. It helps us stay in touch, but comparing ourselves with others can make us feel worse.", "#2c1:0", "For example, we can decide not to use our phones at night.", "#2c1:2", "#2c2:0"]}, {"q": "Are people less patient nowadays?", "t": 3, "tag": "③続き 核", "en": "", "jp": "テクノロジーで何でもすぐ手に入る（③続き 核）", "a": "x_18c69d73", "m": ["Yes, I think so.", "Thanks to technology, we can get almost anything instantly, so waiting feels harder than it used to.", "But some things are worth waiting for. I once waited an hour at Minato Mirai just to see the night view.", "#2a2:1"]}, {"q": "How has technology changed education?", "t": 3, "tag": "③A（本体）＋ 教育", "en": "It has changed it a lot, but not every child can use it.", "jp": "大きく変えた。でも全員が使えるわけではない。", "a": "x_feeca1e9", "m": ["~I think", "it has changed it a lot, but not for everyone.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a tablet or pay for the internet.", "~For example,", "during online classes, some students couldn't join from home.", "~In the long run, that can", "widen the gap between students.", "~That's why I think", "schools should lend tablets to students who need them."]}], "a": "x_121a4c07", "top": "a time I was very busy", "m": ["The busiest time I remember was when Nasa and I were preparing our app for a national contest.", "#3a1", "#3a2", "We worked late almost every night for weeks.", "#3a3", "#3a4"]}, {"t": 3, "tag": "③A", "q": "Describe a website or an online service you find useful.", "say": ["what it is", "how you found it", "what you use it for"], "ex": "and explain why it is useful.", "en": "", "jp": "", "p3": [{"q": "How has technology changed education?", "t": 3, "tag": "③A（本体）＋ 教育", "en": "It has changed it a lot, but not every child can use it.", "jp": "大きく変えた。でも全員が使えるわけではない。", "a": "x_feeca1e9", "m": ["~I think", "it has changed it a lot, but not for everyone.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a tablet or pay for the internet.", "~For example,", "during online classes, some students couldn't join from home.", "~In the long run, that can", "widen the gap between students.", "~That's why I think", "schools should lend tablets to students who need them."]}, {"q": "Should children be allowed to use smartphones?", "t": 3, "tag": "③続き 核 ＋ C", "en": "", "jp": "テクノロジーは学びを変える（核）→ ただし使えない子との差（C）", "a": "x_af000617", "m": ["Yes, but with clear rules.", "Phones can be great learning tools, but children can easily spend too much time on them.", "#2c1:0", "For example, families can have no phones at dinner. Schools also need clear rules."]}, {"q": "Why do some children fall behind at school?", "t": 3, "tag": "貧困 → 教育", "en": "Often because of poverty. They can afford neither a tablet nor the internet.", "jp": "多くは貧困が原因。タブレットもネットも買えない。", "a": "x_44665757", "m": ["~I think", "it often comes down to money at home.", "~One reason is the cost.", "Some families", "~simply can't afford to", "buy a computer or pay for extra lessons.", "~For example,", "a student without a laptop may not be able to finish online homework.", "~In the long run, that can", "limit their job opportunities.", "~That's why I think", "schools should lend laptops to students who need them."]}, {"q": "Should rich countries help poorer countries?", "t": 3, "tag": "貧困 → 教育", "en": "Yes, especially through education, because it breaks the cycle of poverty.", "jp": "はい。特に教育で。貧困の連鎖を断ち切れるから。", "a": "x_1a61001b", "m": ["~I think", "they should, especially through education.", "~One reason is the cost.", "Many families in poor countries", "~simply can't afford to", "send their children to school.", "~For example,", "some children have to work to help their parents instead of studying.", "~In the long run, that can", "keep the whole country poor.", "~That's why I think", "rich countries should help build schools."]}], "a": "x_18018255", "top": "a useful online service", "m": ["An online service I find really useful is AI chat.", "My friend Nasa and I use it to make apps.", "#3a1", "#3a2", "Without AI, we could never have made this app, so it is really useful to me."]}], "T2": [{"t": 2, "tag": "責任論 ＋ 例：給食", "q": "Some people think that governments should spend more money on preventing illness rather than on treating it.\n\nTo what extent do you agree or disagree?", "type": "t20", "en": "", "jp": "本論1：個人だけでは健康を守れない（核）／本論2：政府が予防の仕組みを作る（結び＋フィンランドの給食）", "intro": "It is often argued that governments should spend more on preventing illness than on treating it. I strongly agree, <u>not only because<\/u> prevention protects people's daily lives <u>but also because<\/u> it saves money in the long run.", "concl": "In conclusion, I firmly believe that prevention should come first, since it keeps people healthy and reduces the cost of treatment.", "m": [["@intro"], ["#ur5|One major reason is that|prevention", "Many people today are so busy that they rely on convenience food and rarely exercise.", "If people learn to eat well and stay active, they will not get ill so easily.", "For example, a short walk every day can greatly reduce the risk of heart disease.", "Regular health checks can also find problems early.", "It is always easier to stay healthy than to get well again."], ["#ur1|Another reason is that|prevention", "Moreover, prevention is not only a job for individuals.", "#2c1:0", "For example, we can choose healthier food and walk more.", "#2c1:2", "#2c2:0", "#ex1", "Programmes like these cost much less than treating serious illnesses later.", "Prevention also helps people stay healthy enough to keep working, which is good for the economy. Some people argue that sick people need the money now. However, if fewer people become ill, more money will be left for those who really need treatment."], ["@concl", "#2c2:1"]]}, {"t": 2, "tag": "②B（本体）＋ 責任論", "q": "In many countries, more and more people are moving to large cities, and cities are growing rapidly.\n\nDo the advantages of this development outweigh the disadvantages?", "type": "t22", "en": "", "jp": "本論1：便利さ・機会（②B）／本論2：環境の問題は政府のルールで解決（責任論）", "intro": "More and more people are moving to large cities, and cities have grown rapidly in recent years. This essay will examine both the advantages and disadvantages of this trend, and argue that the benefits outweigh the drawbacks.", "concl": "In conclusion, <u>despite<\/u> the damage to the environment, the advantages of city life are far greater, as long as cities are planned well.", "m": [["@intro"], ["#ur6|Admittedly,|city life", "Big cities produce a lot of waste and pollution, and traffic jams are a serious problem. People living there also often feel stressed.", "Housing is also very expensive, so many young people cannot afford a large home.", "It is also harder to find quiet places to relax."], ["#ur3|However, the main advantage is that|city life", "Jobs, shops and good transport are all close by. Many people move to cities to find better jobs and a better education for their children.", "Cities can also be pleasant places to live if they are well planned. Minato Mirai in Yokohama is a good example.", "#2a3", "Big cities also have more hospitals, universities and cultural events."], ["But this does not happen by itself.", "#2c1:2", "#2c2:0", "For example, the government can build more green spaces and make public transport cheaper.", "Clear rules like these can make cities cleaner, greener and safer."], ["@concl", "#2c2:1"]]}, {"t": 2, "tag": "責任論（核・結び）＋ 例", "q": "Some people say that individuals can do nothing to improve the environment, and that only governments and large companies can make a difference.\n\nTo what extent do you agree or disagree?", "type": "t20", "en": "", "jp": "本論1：個人にできること（核＋ペットボトルの例）／本論2：それでも政府が必要（結び＋EUの例）", "intro": "It is often argued that individuals can do nothing to improve the environment. I strongly disagree, <u>not only because<\/u> small actions add up <u>but also because<\/u> individuals can push governments to act.", "concl": "In conclusion, I firmly believe that individuals can make a difference, since small actions add up and they also support action by governments.", "m": [["@intro"], ["Admittedly, governments and large companies have the greatest power.", "#2c2:0", "#ex3", "They can make laws, and companies can change the way they produce goods.", "Without their action, the situation cannot really improve."], ["However, this does not mean that individuals can do nothing.", "#2c1:0,1", "#ex2", "Small actions like these add up. For example, I always carry my own bag and bottle.", "Even small changes, like taking the train instead of driving, make a difference.", "If millions of people do the same, the effect is huge."], ["Moreover, when many people change their habits, governments and companies notice and change too. Since environmental problems affect everyone, everyone should take part.", "For example, when many people refused plastic straws, many cafés stopped using them."], ["@concl", "#2c2:1"]]}, {"t": 3, "tag": "教育（核・結び）＋ 例", "q": "Some people believe that online learning will one day completely replace traditional schools.\n\nTo what extent do you agree or disagree?", "type": "t20", "en": "", "jp": "反対。本論1：オンラインの利点／本論2：取り残される子ども（核＋コロナ禍の例）", "intro": "It is often argued that online learning will one day replace traditional schools. I strongly disagree, <u>not only because<\/u> many children cannot use technology at home <u>but also because<\/u> school is a place where children learn with others.", "concl": "In conclusion, I firmly believe that online learning will support schools rather than replace them, since not every child can learn online and children need each other.", "m": [["@intro"], ["It is true that technology has improved education. Digital tools can bring out the best in students, and students who rarely speak up in class often share their ideas online.", "#ex5"], ["However, online learning cannot replace schools, because not every child can use it.", "#3c1:1,2,3", "#ex4", "Even today, many families cannot pay for a fast internet connection."], ["#ur8|Moreover,|learning only at home", "School is not only a place to study but also a place to learn with others. Students learn to discuss, cooperate and think things through together. My own students, for example, learn a lot from discussing stories in class.", "Teachers can also notice when a student is having problems and help them."], ["@concl", "#3c2:1"]]}, {"t": 3, "tag": "貧困 → 教育 ＋ 例", "q": "In many countries, crime committed by young people is increasing.\n\nWhat are the causes of this problem, and what solutions can you suggest?", "type": "t23", "en": "", "jp": "原因：学ぶ機会の差と貧困（核）／解決策：すべての子に学びの機会（結び＋GIGAスクールの例）", "intro": "Crime by young people is now a serious issue in many countries. This essay will <b>look into<\/b> its main causes and then <b>put forward<\/b> some solutions.", "concl": "In conclusion, youth crime mainly <b>stems from<\/b> poverty and a lack of education, and <u>only through<\/u> better education <u>can it be<\/u> tackled.", "m": [["@intro"], ["The main cause of youth crime is poverty.", "#pv1", "Young people who fall behind at school often find it hard to get a job. Many of them also feel left out of society, and some of them turn to crime. Some young people also see crime as an easy way to get money."], ["There are two main solutions.", "#ur7|The first is education, because|it", "#3c2:0", "#ex5", "This would also give young people hope for the future.", "Many schools already lend tablets to students who need them."], ["Secondly, schools and local communities should offer clubs and support after school, so that young people have a safe place to go. Sports clubs and volunteer work can help them feel part of their community.", "When young people feel that someone cares about them, they are much less likely to break the law."], ["@concl", "#3c2:1"]]}, {"t": 3, "tag": "貧困 → 教育", "q": "Some people believe that rich countries should give financial help to poorer countries. Others think that each country should solve its own problems.\n\nDiscuss both these views and give your own opinion.", "type": "t21", "en": "", "jp": "本論1：自国優先の意見／本論2：教育で貧困の連鎖を断つ（教育）", "intro": "While some people believe that each country should solve its own problems, others argue that rich countries should help poorer ones. This essay will discuss both views before explaining why I side with the latter.", "concl": "In conclusion, <u>although<\/u> every country is responsible for itself, I am convinced that rich countries should help, especially through education.", "m": [["@intro"], ["On the one hand, some people argue that each country should solve its own problems, because help from abroad can be wasted.", "They also believe that governments should spend money on their own people first.", "In addition, some of the money given as aid never reaches the people who need it."], ["On the other hand, I believe that rich countries should help.", "#pv1", "#3c1:1,2", "Education is the best long-term investment a country can make."], ["#ur7|This matters, because|education", "#3c2:0", "#ex5", "Rich countries could share this kind of support with poorer countries, for example by building schools and providing tablets.", "When children receive a good education, they can find better jobs and help their own countries grow."], ["@concl", "#3c2:1"]]}, {"t": 1, "tag": "文化（核・結び）＋ 例：孤食", "q": "In many families today, parents and children spend less time together than in the past.\n\nWhy is this happening? Is this a positive or negative development?", "type": "t24", "en": "", "jp": "理由：忙しさ（孤食の例）／評価：伝統や家族の時間が失われるので否定的（文化）", "intro": "In many families today, parents and children spend less time together than in the past. This essay will explain why this is happening and argue that it is a negative development.", "concl": "In conclusion, families spend less time together mainly because people are too busy. <u>On the whole<\/u>, this is a negative trend, as family meals protect both our bodies and our minds.", "m": [["@intro"], ["There are several reasons for this. The main one is that people are too busy. Parents often work long hours, so children eat alone.", "#ex0", "Smartphones are another reason: even at home, family members often look at their own screens.", "Many children also spend their evenings at cram schools or clubs, so they get home late."], ["I believe this is a negative development. Family meals are not only about food. When we eat together, we can share our worries.", "#1c1:2", "When families stop eating together, children lose a chance to share their feelings, and family traditions are not passed on.", "Children who eat alone are also more likely to eat convenience food.", "#ur8||Eating alone also"], ["#1c2:0", "For example, families could cook a traditional dish together once a week.", "Even a simple meal together can make a big difference, and it is also a chance for parents to pass on family recipes."], ["@concl"]]}, {"t": 1, "tag": "①続き 核・D", "type": "t20", "q": "Some people think that governments should put a tax on unhealthy food such as fast food and sugary drinks.\n\nTo what extent do you agree or disagree?", "en": "", "jp": "①続き：食生活が乱れている（核）→ 社会・政府の役割（D）", "intro": "It is often argued that governments should tax unhealthy food and sugary drinks. I strongly agree, <u>not only because<\/u> many people rely on cheap fast food <u>but also because<\/u> health is not only a personal problem.", "concl": "In conclusion, I firmly believe that a tax on unhealthy food is a good idea, since it protects people's health and the money can be used for better food.", "m": [["@intro"], ["#ur5|One major reason is that|a tax on unhealthy food", "Many people are so busy that they rely on cheap fast food and sugary drinks. A tax would make people think twice before buying them. Similar taxes on sugary drinks already exist in some countries, such as the UK.", "Eating too much sugar can also cause serious illnesses such as diabetes."], ["#ur1|Another reason is that|the tax", "Health is not only a personal problem.", "#2c1:0", "#2c1:2", "#2c2:0", "#ex1", "The money from the tax could be used for programmes like these.", "In Japan, for example, workers already receive a free health check every year."], ["Some people say that such a tax is unfair to poor families.", "#pv1:0,1", "However, if the money is used for healthy school meals, poor families will benefit the most. In this way, the tax would protect the health of everyone."], ["@concl", "#2c2:1"]]}, {"t": 1, "tag": "①続き C・D", "type": "t20", "q": "Some people believe that all children should learn how to cook at school.\n\nTo what extent do you agree or disagree?", "en": "", "jp": "①続き：家で料理を学ぶ機会が減った（C）→ 学校・社会で補う（D）", "intro": "It is often argued that all children should learn how to cook at school. I strongly agree, <u>not only because<\/u> fewer children learn to cook at home <u>but also because<\/u> cooking is the base of a healthy life.", "concl": "In conclusion, I firmly believe that cooking should be taught at school, since it gives every child good eating habits for life.", "m": [["@intro"], ["Firstly, fewer children learn to cook at home. Many parents work long hours, so they have little time to cook with their children.", "#ex0", "As a result, many young people leave home without knowing how to cook a simple meal.", "This is a skill that everyone needs."], ["#ur7|Another reason is that|cooking", "Cooking is also closely connected to health and culture.", "#1c1:2", "If children learn to cook, they can share meals with their families and pass on family recipes.", "Cooking together is also fun, and it helps children understand where their food comes from.", "Families who cook together also spend more time talking."], ["Finally, schools already play an important role in children's health.", "#ex1", "Cooking lessons would build on this and give children skills for life.", "Learning to cook in a group also teaches children to work together."], ["@concl", "#1c2:0"]]}, {"t": 2, "tag": "②A ＋ ①続き C", "type": "t23", "q": "Nowadays many people work long hours and have little time to relax.\n\nWhat problems does this cause, and what can be done to solve them?", "en": "", "jp": "②A（歩くと落ち着く）＋①続き C（忙しさで食生活が乱れる）", "intro": "Many people today work long hours and have little time to relax, and this is now a serious issue. This essay will <b>look into<\/b> the main problems it causes and then <b>put forward<\/b> some solutions.", "concl": "In conclusion, long working hours harm both our bodies and our minds, and <u>only through<\/u> changes by both companies and the government <u>can this be<\/u> tackled.", "m": [["@intro"], ["#ur6|The first problem is that|working long hours", "People who work long hours have little time to cook or exercise, so they rely on convenience food. As a result, many people put on weight or become ill.", "Lack of sleep is another serious problem.", "Others feel too tired to do anything at the weekend."], ["Long hours also harm our mental health. Many workers feel stressed but have no one to talk to. If people keep their feelings inside, their stress can become serious.", "Some people even have to take time off work because of stress.", "Workers who are always tired also make more mistakes."], ["There are several solutions. For individuals, it is important to find time to relax.", "#2a2:2", "#2c1:2", "#2c2:0", "For example, it could limit overtime by law and build more parks.", "Companies should also let workers go home on time and take their holidays. Going for a walk or talking to friends can help a lot, too."], ["@concl", "#2c2:1"]]}, {"t": 2, "tag": "②続き 核・D", "type": "t22", "q": "International tourism has grown rapidly in recent years.\n\nDo the advantages of this outweigh the disadvantages?", "en": "", "jp": "②続き：観光と環境（核）→ 政府の対策（D）", "intro": "International tourism has become increasingly common in recent years. This essay will examine both its advantages and disadvantages, and argue that the benefits outweigh the drawbacks.", "concl": "In conclusion, <u>despite<\/u> the damage to the environment, the advantages of tourism are far greater, as long as clear rules are made.", "m": [["@intro"], ["Admittedly, tourism can harm the environment. More planes and more visitors mean more pollution and more rubbish. Popular places can also become too crowded for local people.", "In some cities, rubbish left by tourists has become a serious problem.", "Large hotels are sometimes built in beautiful natural areas."], ["However, tourism brings many benefits.", "#1c1:0", "Tourism also brings money and jobs, and it helps people from different countries understand each other. In Japan, for example, tourism has helped many small towns survive and keep their festivals alive.", "Many local people depend on tourism for their income. Travelling also opens people's minds and makes them more tolerant.", "Money from tourism can also be used to protect old buildings and nature."], ["Moreover, the problems can be reduced with good planning.", "#2c2:0", "For example, some cities now charge tourists a small fee and use the money to protect nature. Tourists themselves can also help by using trains and buses.", "Governments can also limit the number of visitors to popular places, as some cities in Europe already do."], ["@concl", "#2c2:1"]]}, {"t": 2, "tag": "②続き C・D", "type": "t21", "q": "Some people think that the best way to reduce plastic waste is to ban plastic bags and bottles. Others believe that education is more effective.\n\nDiscuss both these views and give your own opinion.", "en": "", "jp": "②続き：個人ができること（C）と政府のルール（D）", "intro": "While some people believe that banning plastic bags and bottles is the best way to reduce waste, others argue that education is more effective. This essay will discuss both views before giving my own opinion.", "concl": "In conclusion, <u>although<\/u> education is important, I am convinced that clear rules from the government work faster, and both are needed.", "m": [["@intro"], ["#ur7|On the one hand,|education", "#2c1:0,1", "If people understand the problem, they will change their habits. For example, schools can teach children where plastic waste goes.", "#ex2"], ["On the other hand, I believe that rules work faster.", "#2c1:2", "#2c2:0", "In Japan, shops have charged for plastic bags since 2020, and many people now carry their own bags.", "#ex3", "Clear rules change everyone's behaviour at once."], ["However, the best results come when rules and education work together. A ban can reduce plastic quickly, and education can make sure that people support the ban.", "For example, schools can explain why a new rule is needed."], ["@concl", "#2c2:1"]]}, {"t": 3, "tag": "③続き 核・C", "type": "t23", "q": "Children today spend too much time on smartphones and computers.\n\nWhy is this happening, and what can be done about it?", "en": "", "jp": "③続き：テクノロジーが生活を変えた（核）→ 使い方を教える（C・D）", "intro": "Children today spend too much time on smartphones and computers. This essay will <b>look into<\/b> the main causes of this and then <b>put forward<\/b> some solutions.", "concl": "In conclusion, this problem mainly <b>stems from<\/b> how deeply technology has entered our lives, and <u>only through<\/u> education <u>can it be<\/u> tackled.", "m": [["@intro"], ["The main reason is that technology has become part of everyday life. Children use phones for school, games and talking to friends, so it is hard for them to stop. Many games and apps are also designed to keep people using them for as long as possible.", "As a result, many children sleep less and exercise less than before.", "Many parents are also busy, so they cannot always check what their children are doing online.", "#ur8|In the end,|spending too much time on screens"], ["#ur7|However,|technology also", "For example, students who rarely speak up in class often share their ideas online. So the answer is not to ban phones but to teach children good habits.", "Many students also use tablets to search for information and work on projects together.", "Technology itself is not the problem."], ["#2c1:0", "For example, parents can set clear rules, such as no phones at dinner.", "#2c1:2", "Schools and the government should also teach children how to use technology wisely.", "Children also need time for sport and sleep, so it is important to keep a balance. Families can also enjoy activities together without screens, such as cooking or walking."], ["@concl", "#2c2:1"]]}, {"t": 3, "tag": "③続き 核・C・D", "type": "t21", "q": "Some people think that technology has made education better. Others feel that it has made learning worse.\n\nDiscuss both these views and give your own opinion.", "en": "", "jp": "③続き：テクノロジーで学びが変わった（核）→ 使えない子との差（C）→ 解決策（D）", "intro": "While some people believe that technology has made learning worse, others argue that it has made education better. This essay will discuss both views before explaining why I side with the latter.", "concl": "In conclusion, <u>although<\/u> technology can be a distraction, I am convinced that it improves education, as long as every child can use it.", "m": [["@intro"], ["#ur8|On the one hand, some people feel that|technology", "Students are easily distracted.", "There is also a danger that some children are left behind.", "#3c1:1,2", "Some students also copy answers from the internet or AI without thinking.", "Some children also spend more time playing games than studying."], ["#ur7|On the other hand, I believe that|technology", "Digital tools can bring out the best in students, and quiet students often share their ideas online.", "#ex5", "For example, online dictionaries and videos make it easier for students to learn at their own pace."], ["The real question is not whether we use technology, but how we use it, and whether every child can use it at all.", "#3c2:0", "Teachers should show students how to check information and use AI wisely."], ["@concl", "#3c2:1"]]}, {"t": 3, "tag": "③続き C → D", "type": "t23", "q": "In many countries, the gap between rich and poor people is growing.\n\nWhat problems does this cause, and what solutions can you suggest?", "en": "", "jp": "③続き：貧困だとテクノロジーを使えない → 教育のレベルも下がる（C）→ 解決策（D）", "intro": "In many countries, the gap between rich and poor people is growing, and this is now a serious issue. This essay will <b>look into<\/b> the problems it causes and then <b>put forward<\/b> some solutions.", "concl": "In conclusion, the gap between rich and poor mainly harms children's education, and <u>only through<\/u> education for every child <u>can it be<\/u> tackled.", "m": [["@intro"], ["The biggest problem is that the gap hurts the poorest people the most.", "#pv1", "#pv2", "Some poor children may even have to work instead of studying."], ["#pv3", "So the gap harms everyone, not only the poor."], ["The best solution is education, because it helps children escape poverty.", "#3c2:0", "#ex5", "Rich people and large companies should also pay fair taxes, so that the government has enough money for this. Free school meals can also make sure that every child has at least one healthy meal a day."], ["@concl", "#pv4"]]}, {"t": 1, "tag": "貧困 → 教育 ＋ 責任論 ＋ 文化", "type": "t24", "en": "", "jp": "地元の人：僻地は貧しい → 観光が仕事とお金（論④・論③）／欠点：自然・伝統 → 政府のルール（責任論）／文化を守る力にも（論①）", "q": "Organised tours to remote places and communities are becoming more and more popular.\n\nIs this a positive or negative development for the local people and the environment?", "intro": "Organised tours to remote places and communities have become increasingly popular in recent years. This essay will argue that, despite some drawbacks, this is a positive development for both local people and the environment.", "concl": "In conclusion, although organised tours can harm nature and local culture, I believe they are a positive development, as long as clear rules are made.", "m": [["@intro"], ["The main benefit is for local people. Remote communities are often among the poorest in their countries.", "#pv1:0,1", "Tourism can change this. Visitors bring money and jobs, for example as guides, drivers and cooks. With this money, families can send their children to school instead of making them work.", "#3c2:1"], ["Admittedly, tourism has some drawbacks. New hotels and roads can damage forests, and local traditions may change to suit visitors.", "#2c2:0", "For example, it can limit the number of visitors and use entrance fees to protect nature."], ["In fact, tourism can even help the environment and local culture. When local people earn money from their forests and traditions, they have a strong reason to protect them. Visitors also pay to see traditional festivals and crafts.", "#1c2:0"], ["@concl", "#pv4:1"]]}, {"t": 1, "tag": "万能の理由 ＋ 貧困 ＋ 文化 ＋ 責任論", "type": "t22", "en": "", "jp": "利点：お金（万能の理由・コスト）／欠点：貧しい家庭が行けない（論④）／博物館は教室・政府が支える（論①・責任論・イギリスの例）", "q": "Many museums charge admission fees, while others are free.\n\nDo the advantages of charging people to visit a museum outweigh the disadvantages?", "intro": "Many museums charge admission fees, while others are free. This essay will examine both the advantages and disadvantages of charging visitors, and argue that the drawbacks outweigh the benefits.", "concl": "In conclusion, although admission fees help museums pay their costs, I believe the disadvantages are greater, because fees shut out the people who need culture and education the most.", "m": [["@intro"], ["Admittedly, charging visitors has some benefits.", "#ur1|One major reason is that|it", "Museums can use the money from tickets to protect old works of art and hold new exhibitions, without relying on taxes."], ["However, the biggest disadvantage is that fees keep poor people away.", "#pv1:0,1", "For a family with three children, even a small fee can be too much.", "#pv2:1", "These children lose the chance to learn about art and history outside school."], ["Museums are not only places for tourists. They are classrooms for everyone, where children can learn about their own culture.", "#1c2:1", "#2c2:0", "In the UK, for example, national museums became free in 2001, and in the first year, visitor numbers at museums that used to charge rose by 70 per cent."], ["@concl", "#3c2:1"]]}], "L": {"intro": {"s": "Now, in this first part, I'd like to ask you some questions about yourself.", "a": "x_817d4538"}, "p2": {"s": "Now I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. Before you talk, you'll have one minute to think about what you're going to say. You can make some notes if you wish. Here is your topic.", "a": "x_56f9b1ac"}, "start": {"s": "All right? Remember, you have one to two minutes for this, so don't worry if I stop you. I'll tell you when the time is up. Can you start speaking now, please?", "a": "x_f3a999bd"}, "stop": {"s": "Thank you.", "a": "x_2d439011"}, "p3": {"s": "We've been talking about your topic, and now I'd like to discuss with you some more general questions related to this.", "a": "x_1c1d840d"}, "end": {"s": "Thank you. That is the end of the speaking test.", "a": "x_e3075fd8"}}}};

function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!NOVEL.test(v.name));
  const sc=v=>(/Premium|Enhanced|Natural|Neural/i.test(v.name)?4:0)+(/en[-_]GB/i.test(v.lang)?2:/en[-_]US/i.test(v.lang)?1:0)+(/Google|Daniel|Serena|Kate|Samantha|Karen/i.test(v.name)?1:0);
  return vs.sort((a,b)=>sc(b)-sc(a))[0]||null}catch(e){return null}}
const ttsText=h=>h.replace(/<br\/?>/g,' ').replace(/<[^>]+>/g,'').replace(/&#x27;|&#39;/g,"'").replace(/&amp;/g,'&').replace(/_{2,}/g,'blank').replace(/[\[\]]/g,'');
function stopTTS(){hlClear();try{speechSynthesis.cancel()}catch(e){}try{AU.pause();AU.removeAttribute('src');AU.load()}catch(e){}PL.ids=[];PL.bg=false;mpShow(false);document.querySelectorAll('.spk.on').forEach(b=>b.classList.remove('on'))}

  if(btn&&btn.classList.contains('on')){stopTTS();return}stopTTS();if(btn)btn.classList.add('on');
  const v=pickVoice();let i=0;const next=()=>{if(i>=list.length){if(btn)btn.classList.remove('on');return}
    const u=new SpeechSynthesisUtterance(ttsText(list[i++]));u.lang=v?v.lang:'en-GB';if(v)u.voice=v;u.rate=S.rate||0.95;u.onend=next;u.onerror=()=>{if(btn)btn.classList.remove('on')};speechSynthesis.speak(u)};next()}

function sentHTML(h){const out=[];let cur='',depth=0,i=0;
  while(i<h.length){if(h[i]==='<'){const j=h.indexOf('>',i);const tag=h.slice(i,j+1);if(/^<(b|u|i)>$/.test(tag))depth++;else if(/^<\/(b|u|i)>$/.test(tag))depth--;cur+=tag;i=j+1;continue}
    cur+=h[i];if(/[.!?]/.test(h[i])&&depth===0&&(h[i+1]===' '||i===h.length-1)){out.push(cur);cur='';if(h[i+1]===' '){i++;cur=''}}i++}
  if(cur.trim())out.push(cur);return out.map(x=>`<span class="sn">${x}</span>`).join(' ')}
function hlClear(){document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));document.querySelectorAll('.sn.rd').forEach(e=>e.classList.remove('rd'))}
function hl(){const id=PL.ids[PL.i];if(!id){hlClear();return}
  const els=document.querySelectorAll(`[data-blk="${id}"]`);
  document.querySelectorAll('.playing').forEach(e=>{if(e.dataset.blk!==id)e.classList.remove('playing')});
  els.forEach(el=>{if(!el.classList.contains('playing')){el.classList.add('playing');const r=el.getBoundingClientRect();if(r.top<60||r.bottom>innerHeight-130)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}
    const sn=[...el.querySelectorAll('.sn')];if(!sn.length)return;const lens=sn.map(x=>x.textContent.length);const tot=lens.reduce((a,b)=>a+b,0);
    const f=AU.duration?AU.currentTime/AU.duration:0;let acc=0,k=0;for(;k<lens.length;k++){acc+=lens[k]/tot;if(f<acc)break}
    sn.forEach((x,j)=>x.classList.toggle('rd',j===Math.min(k,sn.length-1)))})}
const ALL={};for(const t of D.T)for(const b of [...t.a,...t.b,...t.a.filter(x=>x.short).map(x=>({...x,id:x.id+'s',en:x.short.en,jp:x.short.jp,label:x.label+'（短縮版）',short:null}))])ALL[b.id]={...b,grp:t.name};for(const x of D.X)for(const b of x.blocks)ALL[b.id]={...b,grp:x.name};
const AU=new Audio();AU.preload='auto';window.__AU=AU;const PL={ids:[],i:0,btn:null,title:''};
function mpShow(on){const m=$('mp');if(m)m.hidden=!on}
function mpSync(){const b=ALL[PL.ids[PL.i]];if(!b)return;$('mpT').textContent=`${b.grp}｜${b.label}`;$('mpN').textContent=`${PL.i+1} / ${PL.ids.length}${PL.loop?`　くり返し ${PL.rounds}回目`:''}`;$('mpLoop').classList.toggle('on',!!PL.loop);$('mpPlay').textContent=AU.paused?'再生':'止める';
  try{if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:b.label,artist:b.grp,album:'IELTS 暗記トレーナー'});navigator.mediaSession.playbackState=AU.paused?'paused':'playing'}}catch(e){}}
function plLoad(){const id=PL.ids[PL.i];AU.src='audio/'+id+(((ALL[id]||{}).v||1)>1?'_v'+ALL[id].v:'')+'.mp3';AU.playbackRate=(S.rate||.95)/.95;
  const p=AU.play();if(p&&p.catch)p.catch(e=>{if(e&&(e.name==='AbortError'||e.name==='NotAllowedError')){mpSync();return}
    const b=ALL[id];if(b&&'speechSynthesis' in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(ttsText(b.en));const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}u.rate=S.rate||.95;u.onend=()=>AU.onended();speechSynthesis.speak(u)}catch(_){}}});mpSync()}
function playIds(ids,btn,title,bg,loop){if(btn&&btn.classList.contains('on')){stopTTS();return}stopTTS();if(!ids.length)return;
  PL.ids=ids;PL.i=0;PL.btn=btn||null;PL.bg=!!bg;PL.loop=!!loop;PL.rounds=1;PL.title=title||'';if(btn)btn.classList.add('on');mpShow(true);plLoad()}
AU.onended=()=>{if(PL.i<PL.ids.length-1){PL.i++;plLoad()}else if(PL.loop){PL.i=0;PL.rounds++;plLoad()}else{if(PL.btn)PL.btn.classList.remove('on');mpSync();$('mpPlay').textContent='再生';PL.i=0;AU.removeAttribute('src')}};

function gain(n){const before=Math.floor(S.xp/150);S.xp+=n;
  const d=today();if(S.last!==d){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=d}

/* ===== コース：学習状況から分刻みのメニューを作る ===== */
const DEADLINE='2026-11-28';

const IDX={};for(const t of D.T){for(const b of memA(t))IDX[b.id]={b,t,part:'a'};for(const b of memB(t))IDX[b.id]={b,t,part:'b'}}for(const x of D.X)for(const b of x.blocks)IDX[b.id]={b,t:x,part:'x'};
const TIERS=[
 ['最優先：テンプレートの核',['1a1','1c1','2a1','2c1','3a1','3c1','pv1','ct0']],
 ['優先：A・B（短縮版）と論の結び',['1a2s','1a3s','1c2','2a2s','2a3s','2c2','3a2s','3a3s','3c2','pv4','pv2','pv3','ct1','ct2','ct3','ct4','ct5']],
 ['Part 1 短い答え',D.X.find(x=>x.k==='p1').blocks.map(b=>b.id)],
 ['本体の結び',['1a4','2a4','3a4']],
 ['Task 2 の型・万能の理由・具体例',[...D.X.find(x=>x.k==='t2').blocks,...D.X.find(x=>x.k==='ur').blocks,...D.X.find(x=>x.k==='ex').blocks].map(b=>b.id)],
 ['Task 1 図表の型',D.X.find(x=>x.k==='t1').blocks.map(b=>b.id)]];
const tierOf=id=>TIERS.findIndex(([,ids])=>ids.includes(id));
const lvl=id=>(S.box[id]||{}).l||0;const learned=id=>lvl(id)>=3;
const isDue=id=>{const b=S.box[id];return b&&b.l<5&&b.d<=today()};
function daysLeft(){return Math.max(1,Math.round((new Date(DEADLINE+'T23:59:00')-new Date(today()+'T00:00:00'))/864e5))}
function tierStat(){return TIERS.map(([n,ids])=>({n,ids,done:ids.filter(learned).length}))}
const grpKey=id=>{const e=IDX[id];return e.t.k+(e.part||'')};
const grpName=id=>{const e=IDX[id];return e.part==='a'?e.t.name+'（本体）':e.part==='b'?e.t.name+'（論）':e.t.name};
function buildCourse(T){const steps=[];let left=T;const push=(type,ids,min,title,extra)=>{steps.push({type,ids,min,title,...(extra||{})});left-=min};
  const order=TIERS.flatMap(([,ids])=>ids);const pr=id=>order.indexOf(id);
  const finishMin=T>=30?(T>=60?6:4):0;
  // 1) 復習（忘れかけ）
  const due=order.filter(isDue);if(due.length){const n=Math.min(due.length,Math.max(2,Math.floor((T*0.35)/0.6)));const m=Math.max(2,Math.ceil(n*0.6));push('speak',due.slice(0,n),m,`復習：忘れかけ ${n}ブロック`)}
  // 2) 新しく覚える（優先度順・同じまとまりで最大4つ）
  let pool=order.filter(id=>!learned(id)&&!(due.includes(id)));
  while(left-finishMin>=3&&pool.length){const g=grpKey(pool[0]);const tmax=Math.max(tierOf(pool[0]),1);const chunk=[];for(const id of pool){if(grpKey(id)===g&&tierOf(id)<=tmax&&chunk.length<4)chunk.push(id)}
    const cost=n=>Math.ceil(n*1.3)+Math.ceil(n*0.8);while(chunk.length>1&&cost(chunk.length)>left-finishMin)chunk.pop();
    if(cost(chunk.length)>left-finishMin)break;
    push('read',chunk,Math.ceil(chunk.length*1.3),`音読：${grpName(chunk[0])} ${chunk.length}ブロック`);
    push('speak',chunk,Math.ceil(chunk.length*0.8),`隠してスピーク：${grpName(chunk[0])}`);
    pool=pool.filter(id=>!chunk.includes(id))}
  // 3) 全部覚えていたら、レベルの低い順に総復習
  if(!pool.length&&left-finishMin>=2){const rest=order.filter(id=>lvl(id)<5).sort((a,b)=>lvl(a)-lvl(b)||pr(a)-pr(b));const n=Math.min(rest.length,Math.floor((left-finishMin)/0.6));if(n)push('speak',rest.slice(0,n),Math.ceil(n*0.6),`総復習：定着の弱い順 ${n}ブロック`)}
  // 4) 仕上げ
  if(finishMin){const ready=D.T.filter(t=>learned(t.a[1].id));if(ready.length){const t=ready[Math.floor(Math.random()*ready.length)];push('two',[],3,`2分チャレンジ：${t.name}`,{t:t.k})}
    else push('roulette',[],3,'質問ルーレット（5問）');if(T>=60)push('roulette',[],3,'質問ルーレット（5問）')}
  if(left>0&&steps.length)steps[steps.length-1].min+=left;
  return steps}

    ${ch.v.map((row,k)=>`<polyline fill="none" stroke="${PAL[k]}" stroke-width="2.5" points="${row.map((v,i)=>xs(i)+','+ys(v)).join(' ')}"/>${row.map((v,i)=>`<circle cx="${xs(i)}" cy="${ys(v)}" r="3" fill="${PAL[k]}"/>`).join('')}`).join('')}
    <text x="6" y="10" font-weight="700">${s.u}</text></svg>${leg(s.s)}`}
  if(ch.type==='bar'){const W=340,H=220,L=34,B=30,T=24,max=s.max,gw=(W-L-8)/s.c.length,bw=gw*.7/s.g.length,ys=v=>H-B-(v/max)*(H-B-T);
    g=`<svg viewBox="0 0 ${W} ${H}" class="t1g">${[0,.5,1].map(f=>`<line x1="${L}" x2="${W-4}" y1="${ys(max*f)}" y2="${ys(max*f)}" stroke="var(--line)"/><text x="${L-5}" y="${ys(max*f)+4}" text-anchor="end">${Math.round(max*f)}</text>`).join('')}
    ${s.c.map((c,i)=>`${ch.v.map((row,k)=>`<rect x="${L+i*gw+gw*.15+k*bw}" y="${ys(row[i])}" width="${bw-2}" height="${H-B-ys(row[i])}" rx="2" fill="${PAL[k]}"/>`).join('')}<text x="${L+i*gw+gw/2}" y="${H-12}" text-anchor="middle" font-size="9.5">${c}</text>`).join('')}
    <text x="6" y="10" font-weight="700">${s.u}</text></svg>${leg(s.g)}`}
  if(ch.type==='pie'){const pie=(v,cx)=>{let a=-Math.PI/2;return v.map((x,k)=>{const b=a+x/100*2*Math.PI;const p=`M${cx},95 L${cx+70*Math.cos(a)},${95+70*Math.sin(a)} A70,70 0 ${x>50?1:0} 1 ${cx+70*Math.cos(b)},${95+70*Math.sin(b)}Z`;const m=(a+b)/2;a=b;
      return `<path d="${p}" fill="${PAL[k]}" stroke="var(--paper)" stroke-width="1.5"/>${x>=6?`<text x="${cx+46*Math.cos(m)}" y="${99+46*Math.sin(m)}" text-anchor="middle" fill="#fff" font-weight="800">${x}%</text>`:''}`}).join('')};
    g=`<svg viewBox="0 0 340 200" class="t1g">${pie(ch.v[0],85)}${pie(ch.v[1],255)}<text x="85" y="192" text-anchor="middle" font-weight="800">${s.g[0]}</text><text x="255" y="192" text-anchor="middle" font-weight="800">${s.g[1]}</text></svg>${leg(s.c)}`}
  if(ch.type==='table')g=`<table class="t1t"><tr><th></th>${s.c.map(c=>`<th>${c}</th>`).join('')}</tr>${s.r.map((r,i)=>`<tr><th>${r}</th>${ch.v[i].map(v=>`<td>${v.toLocaleString('en-GB')}</td>`).join('')}</tr>`).join('')}</table>`;
  if(ch.type==='process')g=`<div class="proc">${s.st.map((x,i)=>`<div><b>${i+1}</b>${x}</div>`).join('<span>→</span>')}</div>`;
  if(ch.type==='map'){const one=(it,yr)=>`<div><b>${yr}</b><svg viewBox="0 0 160 120" class="t1g"><rect x="1" y="1" width="158" height="118" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>${it.map(([n,x,y,w,h],k)=>`<rect x="${4+x*38}" y="${4+y*38}" width="${w*38-4}" height="${h*38-4}" rx="4" fill="${PAL[k%5]}" opacity=".25"/><text x="${4+x*38+(w*38-4)/2}" y="${4+y*38+(h*38-4)/2+3}" text-anchor="middle" font-size="9" font-weight="700">${n}</text>`).join('')}<text x="152" y="14" font-size="10" font-weight="800">N↑</text></svg></div>`;
    g=`<div class="maps">${one(s.a,s.y[0])}${one(s.b,s.y[1])}</div>`}
  return g}
const leg=a=>`<div class="leg">${a.map((x,k)=>`<span><i style="background:${PAL[k]}"></i>${x}</span>`).join('')}</div>`;
const T1TAIL='Summarise the information by selecting and reporting the main features, and make comparisons where relevant.';
/* ---------- writing ---------- */
function wStart(kind){const seed=Math.floor(Math.random()*1e9);const tasks=[];
  if(kind!=='t2')tasks.push({k:'w1',seed});if(kind!=='t1')tasks.push({k:'w2',ti:E.T2.indexOf(pickFresh(E.T2,'t2'))});
  S.wcur={kind,title:{both:'Task 1＋2',t1:'Task 1',t2:'Task 2'}[kind],mins:{both:60,t1:20,t2:40}[kind],start:Date.now(),tasks,text:{},tab:0};save();wRun()}
const wc=s=>(s.trim().match(/[A-Za-z0-9’'-]+/g)||[]).length;
function wSt(t){return t.k==='w1'?{part:'w1',chart:t1Make(t.seed)}:{part:'w2',task:E.T2[t.ti]}}
function wRun(){exClear();const W=S.wcur;if(!W){exMenu();return}wake();const t=W.tasks[W.tab];const st=wSt(t);const need=t.k==='w1'?150:250;
  const prompt=t.k==='w1'?`<p class="tp">You should spend about 20 minutes on this task.</p><div class="tbox"><b>${esc(st.chart.s.p)}</b><br>${T1TAIL}</div>${t1HTML(st.chart)}<p class="tp">Write at least 150 words.</p>`
    :`<p class="tp">You should spend about 40 minutes on this task. Write about the following topic:</p><div class="tbox"><b>${esc(st.task.q).replace(/\n\n/g,'<br><br>')}</b><br><br>Give reasons for your answer and include any relevant examples from your own knowledge or experience.</div><p class="tp">Write at least 250 words.</p>`;
  app.innerHTML=`<div class="exh"><button class="back" id="bk">← 中断</button><span class="wclock" id="wck">--:--</span></div>
  ${W.tasks.length>1?`<div class="tabs">${W.tasks.map((x,i)=>`<button class="chip ${i===W.tab?'done':''}" data-tab="${i}">${x.k==='w1'?'Task 1':'Task 2'}<small>${wc(W.text[i]||'')}語</small></button>`).join('')}</div>`:''}
  <div class="card" style="--c:${EXC}">${prompt}${S.ex.hint==='now'?`<details class="peek"><summary>答えの例を見る</summary>${modelHTML(st)}</details>`:''}</div>
  <textarea id="wta" class="wta" spellcheck="false" autocapitalize="sentences" placeholder="ここに英語で書く">${esc(W.text[W.tab]||'')}</textarea>
  <div class="wcount"><b id="wn">0</b> words <span>（${need}語以上）</span></div>
  <div class="row"><button class="btn" id="sub" style="background:${EXC}">提出する</button></div><p class="note">書いた文はこの端末に自動で保存されます。中断しても時間は進みます。</p>`;
  const ta=$('wta');const upd=()=>{const n=wc(ta.value);$('wn').textContent=n;$('wn').style.color=n>=need?'var(--ok)':'';};upd();
  ta.oninput=()=>{W.text[W.tab]=ta.value;upd();const tb=app.querySelector(`[data-tab="${W.tab}"] small`);if(tb)tb.textContent=wc(ta.value)+'語';clearTimeout(ta._s);ta._s=setTimeout(save,400)};
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{W.text[W.tab]=ta.value;W.tab=+b.dataset.tab;save();wRun()});
  $('bk').onclick=()=>{W.text[W.tab]=ta.value;save();exQuit();exMenu()};
  let arm=false;$('sub').onclick=()=>{if(!arm){arm=true;$('sub').textContent='もう一度押すと提出';setTimeout(()=>{arm=false;const b=$('sub');if(b)b.textContent='提出する'},2500);return}W.text[W.tab]=ta.value;wEnd()};
  const tick=()=>{const left=W.mins*60-(Date.now()-W.start)/1000;const c=$('wck');if(!c)return;c.textContent='残り '+secs(left);c.classList.toggle('over',left<300);if(left<=0){W.text[W.tab]=ta.value;toast('時間です');wEnd()}};tick();EX.iv.push(setInterval(tick,1000))}
function wEnd(){exClear();const W=S.wcur;if(!W)return;try{EX.lock&&EX.lock.release()}catch(e){}
  const used=Math.min(W.mins*60,(Date.now()-W.start)/1000);
  const m={d:today(),title:'ライティング '+W.title,sum:W.tasks.map((t,i)=>`${t.k==='w1'?'T1':'T2'} ${wc(W.text[i]||'')}語`).join('・')+`・${secs(used)}`,tasks:W.tasks,texts:W.tasks.map((t,i)=>W.text[i]||''),used};
  S.mocks.push(m);if(S.mocks.length>30)S.mocks=S.mocks.slice(-30);S.wcur=null;gain(20);save();confetti();wReviewHTML(m)}
function wChecks(k,tx){const n=wc(tx),need=k==='w1'?150:250;const paras=tx.split(/\n\s*\n|\n/).filter(p=>p.trim()).length;const ck=[];
  ck.push([n>=need,`語数 ${n}語（${need}語以上）`]);ck.push([paras>=(k==='w1'?3:4),`段落 ${paras}つ（${k==='w1'?'3〜4':'4〜5'}つが目安）`]);
  if(k==='w1')ck.push([/\boverall\b/i.test(tx),'Overall で全体の傾向を書いている']);
  else ck.push([/in conclusion|to conclude|to sum up/i.test(tx),'In conclusion で結論を書いている']);
  return `<ul class="ck">${ck.map(([ok,s])=>`<li class="${ok?'ok':'ng'}">${ok?'✓':'△'} ${s}</li>`).join('')}</ul>`}
function wReviewHTML(m){app.innerHTML=`<button class="back" id="bk">← 本番モード</button><div class="card" style="--c:${EXC}"><span class="lab">${m.d}</span><h1 class="jp" style="font-size:26px">${esc(m.title)}のふり返り</h1><p class="lead" style="margin:4px 0 0">かかった時間 ${secs(m.used||0)}</p></div>
  ${m.tasks.map((t,i)=>{const st=wSt(t);return `<div class="card rv" style="--c:${EXC}"><span class="qtag">${t.k==='w1'?'Task 1':'Task 2'}</span>
   ${t.k==='w1'?`<p class="tp"><b>${esc(st.chart.s.p)}</b></p>${t1HTML(st.chart)}`:`<p class="tp"><b>${esc(st.task.q).replace(/\n\n/g,'<br><br>')}</b></p>`}
   ${wChecks(t.k,m.texts[i])}<details open><summary class="note" style="cursor:pointer">自分の答え</summary><div class="mine">${esc(m.texts[i]||'（未記入）').replace(/\n/g,'<br>')}</div></details>${modelHTML(st)}</div>`}).join('')}
  <div class="row"><button class="btn g" id="hm">ホームへ</button><button class="btn" id="ag" style="background:${EXC}">別のお題でもう一度</button></div>`;
  $('bk').onclick=exMenu;$('hm').onclick=home;$('ag').onclick=()=>wStart({'Task 1＋2':'both','Task 1':'t1','Task 2':'t2'}[m.title.replace('ライティング ','')]||'both');scrollTo(0,0)}

document.addEventListener('click',e=>{const im=e.target.closest&&e.target.closest('img.t1img');if(!im)return;const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${im.getAttribute('src')}" alt=""><button aria-label="閉じる">×</button>`;z.onclick=ev=>{if(ev.target.tagName!=='IMG')z.remove()};document.body.appendChild(z)});
$('mpPlay').onclick=()=>{if(!AU.src&&PL.ids.length){plLoad();return}AU.paused?AU.play():AU.pause()};
$('mpNext').onclick=()=>{if(PL.i<PL.ids.length-1){PL.i++;plLoad()}};
$('mpPrev').onclick=()=>{if(PL.i>0){PL.i--;plLoad()}};
$('mpX').onclick=()=>stopTTS();
$('mpLoop').onclick=()=>{PL.loop=!PL.loop;if(PL.loop)PL.rounds=PL.rounds||1;mpSync()};
home();
}
</script>
</body>
