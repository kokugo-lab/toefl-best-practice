<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="暗記トレーナー">
<meta name="theme-color" content="#fbf7f2">
<link rel="manifest" href="/ielts-trainer/manifest.webmanifest">
<link rel="apple-touch-icon" href="/ielts-trainer/icon-180.png">
<title>IELTS 暗記トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful study buddy, light and quick, never childish
   IDEA: a deck of flash cards from the booklet — each round deals one card
   PICTURE: the live card itself, big and tappable, with the 4-koma strip as scenery
   COLOUR and TYPE: booklet coral / teal / indigo on warm paper; Zen Maru Gothic + Nunito
   LAYOUT: one column up to 640px, score bar on top, card centre, controls under the thumb */
:root{color-scheme:light dark;--bg:light-dark(#fbf7f2,#17181c);--paper:light-dark(#ffffff,#22242a);--ink:light-dark(#24323d,#eef0f3);--mut:light-dark(#6b7883,#a3acb5);--line:light-dark(#ece6de,#33363e);
--c1:#E76F51;--c2:#2A9D8F;--c3:#5468D4;--gold:#F2B705;--ok:#2BA36B;--ng:#E5484D}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Nunito','Zen Maru Gothic',system-ui,sans-serif;overflow-x:clip}
.jp,h1,h2,h3,.btn,.lab{font-family:'Zen Maru Gothic','Nunito',system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(4vw,14px,env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lvl{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.lvl b{font:900 15px 'Nunito'}.lvl small{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--gold));border-radius:9px;transition:width .5s}
.pill{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:8px 12px;text-align:center;font:800 13px 'Nunito';color:var(--mut)}.pill b{display:block;font-size:18px;color:var(--ink)}
h1{font-size:clamp(28px,7vw,38px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.lead{color:var(--mut);margin:0 0 16px;font-size:15px}
.deck{display:grid;gap:12px}
.tpl{border:0;text-align:left;cursor:pointer;color:var(--ink);background:var(--paper);border-radius:22px;padding:16px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;box-shadow:0 2px 0 var(--line),0 8px 24px -16px rgba(0,0,0,.35);border-left:8px solid var(--c);min-height:44px}
.tpl .n{width:56px;height:56px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:900 24px 'Zen Maru Gothic'}
.tpl h3{margin:0;font-size:19px}.tpl p{margin:2px 0 0;color:var(--mut);font-size:13px}
.ring{width:52px;height:52px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.mode{border:0;cursor:pointer;background:var(--paper);color:var(--ink);border-radius:18px;padding:14px;text-align:left;box-shadow:0 2px 0 var(--line);min-height:96px}
.mode b{display:block;font:700 16px 'Zen Maru Gothic'}.mode span{font-size:13px;color:var(--mut);line-height:1.45;display:block;margin-top:4px}
.mode .ic{width:34px;height:34px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font:900 16px 'Nunito';margin-bottom:6px}
.sec{font:700 14px 'Zen Maru Gothic';color:var(--mut);margin:22px 0 8px}
.card{background:var(--paper);border-radius:26px;padding:20px 18px;box-shadow:0 3px 0 var(--line),0 18px 40px -24px rgba(0,0,0,.45);border-top:8px solid var(--c);animation:deal .35s ease}
@keyframes deal{from{transform:translateY(18px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.bar i{transition:none}}
.lab{display:inline-block;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:700;font-size:13px;border-radius:99px;padding:3px 12px}
.prog{float:right;color:var(--mut);font:800 13px 'Nunito'}
.jpt{font:500 17px/1.8 'Zen Maru Gothic';margin:12px 0}
.ent{font:600 18px/1.65 'Nunito';margin:10px 0}
.ent b{color:var(--c);font-weight:900}
.ent u{text-decoration-line:underline;text-decoration-color:rgba(242,183,5,.55);text-decoration-thickness:.42em;text-underline-offset:-.18em;text-decoration-skip-ink:none}
.hide{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,var(--paper)) 0 10px,var(--paper) 10px 20px);border:2px dashed color-mix(in srgb,var(--c) 45%,transparent);border-radius:18px;padding:26px 14px;text-align:center;color:var(--mut);font:700 15px 'Zen Maru Gothic'}
.sk{font:700 15px/1.7 'Nunito';color:var(--mut);margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;cursor:pointer;border-radius:16px;padding:12px 16px;font-weight:700;font-size:16px;min-height:48px;flex:1;background:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);border:1px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 #1c7a4f}.btn.mid{background:var(--gold);color:#3b2c00;box-shadow:0 3px 0 #b78800}.btn.ng{background:var(--ng);box-shadow:0 3px 0 #a92f33}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 12px;font:700 15px 'Nunito';cursor:pointer;min-height:44px}
.chip.done{background:color-mix(in srgb,var(--c) 15%,var(--paper));border-color:var(--c);color:var(--c)}
.chip.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.slots{min-height:60px;background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:16px;padding:10px;font:700 15px/1.7 'Nunito'}
.opt{display:block;width:100%;text-align:left;margin-top:8px}
.opt.right{background:var(--ok)!important;color:#fff!important}.opt.wrong{background:var(--ng)!important;color:#fff!important}
.koma{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.koma div{background:color-mix(in srgb,var(--c) 12%,var(--paper));border-radius:16px;padding:10px 6px;text-align:center;font:500 13px/1.45 'Zen Maru Gothic'}
.koma div b{display:block;font:900 20px 'Nunito';color:var(--c)}
.koma div.on{outline:3px solid var(--c);transform:scale(1.04)}
.timer{display:grid;place-items:center;margin:8px auto}
.timer svg{width:190px;height:190px}
.tt{font:900 40px 'Nunito'}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120%);opacity:0;visibility:hidden;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font:800 15px 'Nunito';transition:transform .3s,opacity .3s,visibility .3s;z-index:9}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.back{border:0;background:none;color:var(--mut);font:700 15px 'Zen Maru Gothic';cursor:pointer;padding:10px 0;min-height:44px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.mp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(612px,calc(100% - 20px));background:var(--ink);color:var(--bg);border-radius:20px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:6px;z-index:7;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.mp[hidden]{display:none}
.mp{flex-wrap:wrap;padding:10px 10px 10px}.mpi{flex:1 1 100%;min-width:0;padding:0 4px 4px}.mp button{flex:1}.mpi b{display:block;font:700 13px 'Zen Maru Gothic';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mpi small{font:700 12px 'Nunito';opacity:.7}
.mp #mpLoop{font-size:12px;padding:0 6px;white-space:nowrap}.mp #mpLoop.on{background:var(--gold);color:#3b2c00}
.mp button{border:0;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);border-radius:12px;min-width:44px;height:44px;font:800 15px 'Zen Maru Gothic','Nunito';cursor:pointer;padding:0 10px}
.spk{border:1px solid var(--line);background:var(--paper);color:var(--c);border-radius:99px;font:800 13px 'Zen Maru Gothic','Nunito';padding:6px 12px;min-height:36px;cursor:pointer;margin-left:6px}
.mem{display:inline-block;font:800 11px 'Zen Maru Gothic';border-radius:99px;padding:2px 8px;margin-left:6px;background:var(--line);color:var(--mut)}.mem.on{background:var(--c);color:#fff}
.ent.playing{background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:12px;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 7%,transparent)}
.sn{transition:background .2s;border-radius:4px}.sn.rd{background:rgba(255,214,70,.55);box-shadow:0 0 0 2px rgba(255,214,70,.55)}
.cbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));width:min(612px,calc(100% - 20px));background:#264653;color:#fff;border-radius:16px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:6px;z-index:6;box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
.cbar.over{background:#B4472D}.cbi{flex:1;min-width:0}.cbi b{display:block;font:700 13px 'Zen Maru Gothic';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cbi small{font:700 11.5px 'Nunito','Zen Maru Gothic';opacity:.85}
.cbar button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;min-height:44px;padding:0 12px;font:800 14px 'Zen Maru Gothic';cursor:pointer}
body:has(.cbar) .wrap{padding-top:calc(86px + env(safe-area-inset-top))}
.spk.on{background:var(--c);color:#fff;border-color:var(--c)}
.qtag{font:800 12px 'Nunito';color:var(--mut);letter-spacing:.04em}
.big{font:800 20px/1.45 'Nunito';margin:8px 0 4px}
.stack{display:grid;gap:8px}.stack .btn{flex:none;text-align:left}
.setr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}.setr span{font:700 13px 'Zen Maru Gothic';color:var(--mut);min-width:5.5em}.setr .chip{margin:0;padding:6px 10px;font-size:13px;min-height:38px}
.hrow{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:10px 2px;font:600 14px 'Zen Maru Gothic';cursor:pointer}.hrow small{display:block;color:var(--mut);font:700 12px 'Nunito','Zen Maru Gothic'}
.exh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.examiner{font:700 14px 'Zen Maru Gothic';color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.clock{font:900 46px 'Nunito';text-align:center;margin:10px 0 0;font-variant-numeric:tabular-nums}.clock.over{color:#C98A00}
.cue{border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:8px 0;font:600 16px/1.55 'Nunito'}.cue b{font-size:18px}.cue p{margin:6px 0 0}.cue ul{margin:4px 0;padding-left:22px}
.memo,.wta{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font:500 16px/1.6 'Nunito';padding:10px 12px;resize:vertical}
.memo{min-height:70px;margin-top:8px}.wta{min-height:46vh;margin-top:12px}.memo:focus,.wta:focus{outline:none;border-color:var(--c,#C2577A)}
.peek{margin-top:12px}.peek summary{cursor:pointer;color:var(--mut);font:700 14px 'Zen Maru Gothic';padding:6px 0}
.mdl{margin-top:12px;background:color-mix(in srgb,var(--gold) 9%,var(--paper));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:16px;padding:12px 14px}.mdl>b{font-size:14px}.mdl .ent{margin:8px 0}.mdl .mem{margin:2px 4px 2px 0}
.warn{font:700 12px 'Zen Maru Gothic';color:#B4472D;background:#fde8e1;border-radius:99px;padding:2px 8px}
.rv{margin-top:12px;animation:none}.aud{width:100%;margin:4px 0}
.wclock{font:900 18px 'Nunito';font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 12px}.wclock.over{color:#fff;background:#B4472D}
.tabs{display:flex;gap:8px;margin:4px 0 10px}.tabs .chip{flex:1;margin:0}.tabs small{display:block;font-size:11px;opacity:.75}
.tp{font:500 14px/1.6 'Nunito';margin:6px 0;color:var(--mut)}.tbox{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:500 15px/1.6 'Nunito'}
.t1g{width:100%;max-width:520px;display:block;margin:10px auto 0;font:600 10px 'Nunito';fill:currentColor}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font:700 12px 'Nunito';margin:4px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.t1t{width:100%;border-collapse:collapse;margin:10px 0;font:600 13px 'Nunito'}.t1t th,.t1t td{border:1px solid var(--line);padding:6px;text-align:center}.t1t th{background:color-mix(in srgb,var(--c) 8%,transparent)}
.proc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}.proc div{flex:1 1 120px;border:2px solid var(--line);border-radius:12px;padding:8px;font:600 13px/1.4 'Nunito';text-align:center}.proc b{display:block;color:var(--c)}.proc span{color:var(--mut);font-weight:900}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.maps>div>b{display:block;text-align:center;font:800 14px 'Nunito'}
.wcount{text-align:right;font:700 14px 'Nunito';color:var(--mut);margin-top:6px}.wcount b{font-size:20px;color:var(--ink)}
.ck{list-style:none;padding:0;margin:10px 0;font:700 14px 'Zen Maru Gothic'}.ck li{padding:3px 0}.ck .ok{color:var(--ok)}.ck .ng{color:#B4472D}
.mine{font:500 15px/1.7 'Nunito';background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0}
.exbig{display:flex;align-items:center;gap:12px;width:100%;border:0;cursor:pointer;text-align:left;color:#fff;background:linear-gradient(135deg,#C2577A,#E07A9B);border-radius:22px;padding:16px 18px;box-shadow:0 3px 0 #8f3a58;min-height:72px}
.exbig b{display:block;font:900 19px 'Zen Maru Gothic'}.exbig span{font:600 13px 'Zen Maru Gothic';opacity:.92}.exbig .ic{font-size:30px}
@media(max-width:420px){.koma div{font-size:11.5px}.modes{grid-template-columns:minmax(0,1fr)}.mode{min-height:auto}}
@media(max-width:400px){.wrap{padding-left:10px;padding-right:10px}.btn{font-size:14px;padding:10px 6px;white-space:nowrap;min-height:46px}.row{gap:6px}
 .koma{grid-template-columns:repeat(2,minmax(0,1fr))}.koma div{font-size:12.5px}.lvl small{display:none}.top{gap:6px}.pill{padding:6px 8px}
 .jpt{font-size:16px}.ent{font-size:17px}.card{padding:16px 13px;border-radius:22px}h1{font-size:26px}
 .cbar{padding:6px 6px 6px 10px}.cbar button{padding:0 8px;font-size:13px}.cbi small{font-size:11px}.mp button{min-width:38px;padding:0 6px}}
@media(min-width:900px){.wrap{max-width:720px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="lvl"><b id="band">Band 5.0</b> <small id="xpt"></small><div class="bar"><i id="xpb" style="width:0"></i></div></div>
<div class="pill"><b id="streak">0</b>連続</div><div class="pill"><b id="due">0</b>復習</div></div>
<main id="app"></main>
</div>
<div class="mp" id="mp" hidden><div class="mpi"><b id="mpT"></b><small id="mpN"></small></div><button id="mpPrev" aria-label="前へ">‹</button><button id="mpPlay">止める</button><button id="mpNext" aria-label="次へ">›</button><button id="mpLoop" aria-label="くり返し">くり返し</button><button id="mpX" aria-label="停止">×</button></div>
<div class="toast" id="toast"></div><div class="conf" id="conf"></div>
<script>
{
const D={"T": [{"k": "1", "name": "すき焼き×母", "q1": "Describe a dish you enjoy cooking.", "q2": "How does modern life affect people's health?", "theme2": "健康・家族", "koma": ["家族が囲むすき焼き鍋", "豆腐がたれをジュワッと吸う", "高校生の自分は座るだけ母が台所に立つ", "一人暮らしの台所で「母はすごかった」"], "a": [{"id": "1a0", "label": "導入（つなぎの型）", "jp": "〇〇について考えると、真っ先に浮かぶのはすき焼きです。母がよく作ってくれました。", "en": "When I think about ___, the first thing that <b>comes to mind<\/b> is sukiyaki. My mother often made it for me.", "sk": "think about ___ → <b>comes to mind<\/b> → sukiyaki → mother made it", "skj": "〇〇といえば → 真っ先に浮かぶ → すき焼き → 母が作ってくれた", "v": 2}, {"id": "1a1", "label": "共通の核", "jp": "すき焼きは日本の伝統的な鍋料理です。家族が集まる特別な日によく食べられます。牛肉、豆腐、ねぎを甘いしょうゆのたれで煮ます。一番好きなのは豆腐で、鍋に長く入れておくほど、味がしみこみます。", "en": "Sukiyaki is a traditional Japanese hot pot dish. It <u>is often eaten<\/u> on special days, when the whole family gets together. We cook beef, tofu and green onions in a sweet soy sauce. My favourite part is the tofu: <u>the longer it stays in the pot, the more flavour it<\/u> <b>soaks up<\/b>.", "sk": "traditional hot pot → <u>is often eaten<\/u> on special days → beef・tofu・green onions → sweet soy sauce → tofu：<u>the longer…, the more…<\/u> <b>soaks up<\/b>", "skj": "伝統の鍋料理 → 特別な日によく食べられる → 牛肉・豆腐・ねぎ → 甘いしょうゆのたれ → 豆腐：長く入れるほど味がしみる", "v": 2}, {"id": "1a2", "label": "追加 A　母の料理（経験）", "jp": "高校生の頃は、母が毎日料理をしてくれました。すき焼きも、母がよく作ってくれた料理の一つです。当時の私は台所を手伝うこともほとんどなく、夕食が出てくるのは当たり前だと思っていました。", "en": "When I was in high school, my mother cooked for me every day, and sukiyaki was one of the dishes she often made. Back then, I hardly ever <b>helped out<\/b> in the kitchen, and I simply took it for granted that dinner would be on the table.", "sk": "high school → mother cooked every day → sukiyaki often → hardly ever <b>helped out<\/b> → took it for granted", "skj": "高校時代 → 母が毎日料理 → すき焼きもよく → 手伝いはほぼゼロ → 当たり前だと思っていた", "short": {"en": "When I was in high school, my mother cooked for me every day, and sukiyaki was one of the dishes she often made.", "jp": "高校時代、母は毎日料理をしてくれました。すき焼きも、母がよく作ってくれた料理の一つです。", "sk": "high school → mother cooked every day → sukiyaki was one of the dishes", "skj": "高校時代 → 母が毎日料理 → すき焼きもその一つ"}, "v": 2}, {"id": "1a3", "label": "追加 B　一人暮らしでの気づき", "jp": "一人暮らしを始めて初めて、一食を作るのにどれだけ時間と手間がかかるかに気づきました。もっと早く知っていれば、もっと何度も感謝を伝えていたはずです。それを毎日続けてくれた母に、今は心から感謝しています。", "en": "<u>It was not until I started living on my own that I realised<\/u> how much time and effort a single meal requires. <u>Had I known this earlier, I would have thanked her<\/u> far more often. Now I am truly grateful to her for <b>keeping it up<\/b> every single day.", "sk": "<u>It was not until<\/u> living on my own → time &amp; effort → <u>Had I known…, I would have thanked<\/u> → <b>keeping it up<\/b>", "skj": "一人暮らしで初めて → 時間と手間に気づく → 早く知っていれば感謝したのに → 毎日続けた母に感謝", "short": {"en": "<u>It was not until<\/u> I lived on my own <u>that<\/u> I realised how hard it is to cook every day. Now I am thankful to her for <b>keeping it up<\/b>.", "jp": "一人暮らしをして初めて、毎日料理をする大変さに気づきました。今は、それを続けてくれた母に感謝しています。", "sk": "<u>It was not until<\/u> I lived alone <u>that<\/u> → realised how hard → thankful → <b>keeping it up<\/b>", "skj": "一人暮らしして初めて → 大変さに気づく → 感謝 → 続けてくれた"}, "v": 2}, {"id": "1a4", "label": "結び", "jp": "だから私にとって、すき焼きはただの料理ではありません。いつも母の思い出をよみがえらせてくれます。", "en": "So for me, sukiyaki is not just food. It always <b>brings back<\/b> memories of my mother.", "sk": "not just food → <b>brings back<\/b> memories", "skj": "ただの料理ではない → 母の思い出がよみがえる", "v": 2}], "b": [{"id": "1b1", "label": "社会の核　健康", "jp": "健康はすべての土台です。でも、長時間座ったり、ファストフードを食べたりする現代の生活は、体と心を傷つけています。理由の一つは、みんな忙しすぎることです。料理をする時間がほとんどないので、便利な食品に頼ってしまいます。", "en": "Health is the base of everything. But modern life, <u>which involves<\/u> long hours of sitting and fast food, is hurting our bodies and minds. One reason is that people are too busy. They have little time to cook, so they <b>rely on<\/b> convenience food.", "sk": "health = base → modern life <u>which involves<\/u> sitting・fast food → hurting body & mind → too busy → <b>rely on<\/b> convenience food", "skj": "健康はすべての土台 → 座りっぱなし・ファストフード → 心と体を傷つける → 忙しすぎ → 便利な食品に頼る", "v": 2}, {"id": "1b2", "label": "追加 C　家族の食事と心の健康", "jp": "家族の食事は、食べ物のためだけではありません。一緒に食べると、悩みを打ち明けられます。日本ではストレスについて話すのをためらう人が多いので、助けを求めることは強さだと考えられるべきです。", "en": "Family meals are not only about food. When we eat together, we can <b>open up<\/b> about our worries. In Japan, many people <b>hold back<\/b> from talking about stress, so <u>asking for help should be seen as<\/u> a strength.", "sk": "not only about food → <b>open up<\/b> about worries → Japan：<b>hold back<\/b> → <u>asking for help should be seen as<\/u> a strength", "skj": "食べ物だけではない → 悩みを打ち明ける → 日本は話すのをためらう → 助けを求めるのは強さ", "v": 2}, {"id": "1b3", "label": "追加 D　社会の役割", "jp": "健康は個人だけの問題ではありません。日本では学校給食を専門家が考えているので、子どもは良い食習慣を身につけます。政府も長時間労働を減らす手を打つべきです。公園も増やすべきです。", "en": "Health is not only a personal problem. In Japan, <u>school lunches are planned by<\/u> experts, so children <b>pick up<\/b> good eating habits. The government should also take steps to <b>cut down on<\/b> long working hours. It should build more parks, too.", "sk": "not only personal → <u>school lunches are planned by<\/u> experts → <b>pick up<\/b> habits → <b>cut down on<\/b> working hours → more parks", "skj": "個人だけの問題ではない → 給食は専門家が考える → 習慣が身につく → 長時間労働を減らす → 公園を増やす", "v": 2}, {"id": "1b4", "label": "結び（両用）", "jp": "もっと早く健康に気をつけていれば、多くの病気は防げたでしょう。", "en": "<u>Had we paid more attention to<\/u> our health earlier, many illnesses <u>could have been prevented<\/u>.", "sk": "<u>Had we paid more attention…<\/u> → <u>could have been prevented<\/u>", "skj": "もっと早く気をつけていれば → 防げた", "v": 2}]}, {"k": "2", "name": "みなとみらい", "q1": "Describe a place in your country you would recommend to a visitor.", "q2": "Who should be responsible for protecting the environment?", "theme2": "環境・都市", "koma": ["港に並ぶビルと観覧車", "昼は船が行き交う", "夜は明かりが水面に映る", "海沿いを歩いて心が落ち着く"], "a": [{"id": "2a0", "label": "導入（つなぎの型）", "jp": "〇〇と聞いて、すぐに思い浮かぶのは横浜のみなとみらいです。", "en": "When it comes to ___, the place that <b>springs to mind<\/b> is Minato Mirai in Yokohama.", "sk": "When it comes to ___ → <b>springs to mind<\/b> → Minato Mirai", "skj": "〇〇といえば → すぐ浮かぶ → みなとみらい", "v": 2}, {"id": "2a1", "label": "共通の核", "jp": "みなとみらいは、横浜の海沿いにある新しい街です。古い造船所の跡に造られ、今は高いビルや大きなお店、大きな観覧車があります。でも、私が一番好きなのは建物ではなく、海です。", "en": "Minato Mirai is a new area by the sea in Yokohama. <u>Built on an old shipyard<\/u>, it now has tall buildings, big shops and a huge Ferris wheel. But <u>what I love most is not<\/u> the buildings <u>but<\/u> the sea.", "sk": "new area by the sea → <u>Built on an old shipyard<\/u> → buildings・shops・Ferris wheel → <u>what I love most is not<\/u> the buildings <u>but<\/u> the sea", "skj": "海沿いの新しい街 → 古い造船所の跡 → ビル・お店・観覧車 → 好きなのは建物でなく海", "v": 2}, {"id": "2a2", "label": "追加 A　海の魅力", "jp": "昼間は港を出入りする船を眺められ、暗くなると建物の明かりが水面に映ります。ストレスを感じたときは、海沿いをゆっくり歩くと気持ちが落ち着き、頭がすっきりします。", "en": "During the day, you can watch ships coming in and out of the harbour, and after dark, the lights of the buildings are reflected in the water. Whenever I feel stressed, a slow walk along the waterfront helps me <b>calm down<\/b> and clear my head.", "sk": "day: ships in and out → night: lights reflected on the water → stressed → slow walk → <b>calm down<\/b>", "skj": "昼：船が行き交う → 夜：明かりが水面に → ストレス → ゆっくり歩く → 落ち着く", "short": {"en": "In the daytime, you can watch the ships. At night, the city lights <u>are reflected<\/u> in the water. A slow walk by the sea always helps me <b>calm down<\/b>.", "jp": "昼は船を眺められます。夜は街の明かりが水面に映ります。海沿いをゆっくり歩くと、いつも気持ちが落ち着きます。", "sk": "daytime：ships → night：lights <u>are reflected<\/u> → slow walk → <b>calm down<\/b>", "skj": "昼は船 → 夜は明かりが水面に → ゆっくり歩く → 落ち着く"}, "v": 2}, {"id": "2a3", "label": "追加 B　都市と自然", "jp": "みなとみらいは買い物や観光の場所であるだけでなく、都会の暮らしと自然が一つになる場所でもあります。こうしたバランスは、大きな都市の多くが発展するにつれて失ってきたものです。", "en": "<u>Not only is it<\/u> a place for shopping and sightseeing, <u>but it is also<\/u> a place where city life and nature <b>come together<\/b>. This balance is something that many large cities have lost as they have grown.", "sk": "<u>Not only is it…, but it is also…<\/u> → city life &amp; nature <b>come together<\/b> → many cities have lost this", "skj": "買い物・観光だけでなく → 都会と自然が一つに → 多くの都市が失ったもの", "short": {"en": "<u>Not only is it<\/u> a place for shopping, <u>but it is also<\/u> a place where the city and nature <b>come together<\/b>.", "jp": "買い物の場所であるだけでなく、街と自然が一つになる場所でもあります。", "sk": "<u>Not only is it<\/u> shopping → <u>but it is also<\/u> → city & nature <b>come together<\/b>", "skj": "買い物だけでなく → 街と自然が一つになる"}, "v": 2}, {"id": "2a4", "label": "結び", "jp": "だから、観光客には、夕方の時間をとってそこを歩いてほしいと伝えたいです。", "en": "That is why I would tell visitors to <b>set aside<\/b> an evening for a walk there.", "sk": "tell visitors → <b>set aside<\/b> an evening", "skj": "観光客へ → 夕方の時間をとって歩いてほしい", "v": 2}], "b": [{"id": "2b1", "label": "社会の核　環境", "jp": "気候変動やプラスチックごみのような環境問題は、すべての人に影響します。不公平なのは、貧しい国が一番苦しんでいるのに、その原因はほとんど作っていないことです。だから、対策を先延ばしにはできません。", "en": "Environmental problems, such as climate change and plastic waste, affect everyone. <u>What makes this unfair is that<\/u> poor countries suffer the most, but they did the least to <b>bring them about<\/b>. So we cannot <b>put off<\/b> taking action.", "sk": "climate change・plastic → affect everyone → <u>What makes this unfair is that<\/u> poor countries suffer most → <b>bring them about<\/b> → can't <b>put off<\/b>", "skj": "気候変動・プラ → 全員に影響 → 不公平なのは貧しい国が一番苦しむこと → 原因は作っていない → 先延ばしできない", "v": 2}, {"id": "2b2", "label": "追加 C　個人にできること", "jp": "私たちが捨てるごみの多くは、最後は海に行き着きます。プラスチックを減らしたり、電車やバスを使ったりして協力できます。日本では2020年から、お店のレジ袋が有料になっています。", "en": "Much of the rubbish we <b>throw away<\/b> <b>ends up<\/b> in the sea. We can help by <b>cutting down on<\/b> plastic and using trains and buses. In Japan, shops <u>have charged<\/u> for plastic bags <u>since 2020<\/u>.", "sk": "rubbish <b>ends up<\/b> in the sea → <b>cutting down on<\/b> plastic → trains & buses → bags <u>since 2020<\/u>", "skj": "ごみは海へ → プラを減らす → 電車・バス → 2020年からレジ袋有料", "v": 2}, {"id": "2b3", "label": "追加 D　政府と都市づくり", "jp": "しかし、個人だけでは解決できません。政府は石炭や石油を段階的にやめ、企業にはっきりしたルールを作る必要があります。都市も、みなとみらいのように、緑を増やして造られるべきです。", "en": "<u>However<\/u>, people alone cannot solve this. The government needs to <b>phase out<\/b> coal and oil and make clear rules for companies. Cities <u>should be built<\/u> with more green spaces, just like Minato Mirai.", "sk": "people alone can't → <b>phase out<\/b> coal & oil → rules for companies → cities <u>should be built<\/u> with green", "skj": "個人だけでは無理 → 石炭・石油を段階的にやめる → 企業にルール → 都市は緑を増やして造る", "v": 2}, {"id": "2b4", "label": "結び（両用）", "jp": "政府、企業、人々が力を合わせない限り、地球への害は二度と元に戻らないかもしれません。", "en": "<u>Unless<\/u> the government, companies and people <b>pull together<\/b>, the damage to the planet may never be fixed.", "sk": "<u>Unless<\/u> … <b>pull together<\/b> → never be fixed", "skj": "力を合わせない限り → 元に戻らない", "v": 2}]}, {"k": "3", "name": "なさくん×アプリ", "q1": "Describe a friend you enjoy spending time with.", "q2": "How has technology changed the way people learn?", "theme2": "テクノロジー・教育・貧困", "koma": ["前の職場でなさくんと出会う", "二人でアプリ作り", "生徒がAI老婆と議論→ 全国で受賞", "海沿いを散歩して夢を語る"], "a": [{"id": "3a0", "label": "導入（つなぎの型）", "jp": "〇〇について考えると、友達のなさくんと、一緒に作っているアプリのことが浮かびます。", "en": "When I think about ___, I think of my friend Nasa and the apps we make together.", "sk": "think about ___ → Nasa & our apps", "skj": "〇〇といえば → なさくんと作るアプリ", "v": 2}, {"id": "3a1", "label": "共通の核", "jp": "なさくんは前の職場の友達です。彼は英語、私は国語を教えています。二人に共通しているのは、いつか大学で教えるという夢です。よく一緒に勉強したりアプリを作ったりして、疲れたら海沿いを歩いて将来の話をします。", "en": "Nasa is a friend from my old job. He teaches English, and I teach Japanese. <u>What we have in common is<\/u> a dream: to teach at a university one day. We often study and make apps together, and when we get tired, we walk by the sea and talk about the future.", "sk": "friend from old job → English / Japanese → <u>What we have in common is<\/u> a dream：university → study・apps → walk by the sea", "skj": "前の職場の友達 → 英語／国語 → 共通点は大学で教える夢 → 勉強・アプリ → 海沿いを散歩", "v": 2}, {"id": "3a2", "label": "追加 A　アプリの話", "jp": "特に誇りに思っているのは、『羅生門』の授業用に作ったアプリです。生徒が、AIが演じる老婆と議論できます。なさくんが最初に試してくれ、率直な意見が改良に役立ちました。最終的に、この授業は全国の教育コンテストで賞をもらいました。", "en": "One project I am particularly proud of is an app I made for teaching a short story called Rashomon. It allows students to debate with an old woman <u>played by AI<\/u>. Nasa was the first person to <b>try it out<\/b>, and his honest feedback helped me improve it. In the end, the lesson won a national award for using technology in education.", "sk": "proud: Rashomon app → debate with an old woman <u>played by AI<\/u> → Nasa <b>tried it out<\/b> → honest feedback → national award", "skj": "誇り：羅生門アプリ → AIが演じる老婆と議論 → なさくんが最初に試す → 率直な意見 → 全国で受賞", "short": {"en": "I am most proud of an app for teaching Rashomon. In it, students debate with an old woman <u>played by AI<\/u>. Nasa <b>tried it out<\/b> first, and the lesson won a national award.", "jp": "一番誇りに思っているのは『羅生門』の授業用アプリです。生徒はアプリの中で、AIが演じる老婆と議論します。なさくんが最初に試してくれて、この授業は全国で賞をもらいました。", "sk": "proud：Rashomon app → old woman <u>played by AI<\/u> → Nasa <b>tried it out<\/b> → national award", "skj": "誇り：羅生門アプリ → AIが演じる老婆と議論 → なさくんが試す → 全国で受賞"}, "v": 2}, {"id": "3a3", "label": "追加 B　尊敬するところ", "jp": "彼について一番尊敬しているのは、研究に一生懸命取り組む姿勢です。くじけそうになったときも、彼が頑張っている姿を見ると、自分ももう少し続けようと思えます。", "en": "<u>What I admire most about him is<\/u> how hard he works on his research. Whenever I feel like <b>giving up<\/b>, <u>seeing him work so hard<\/u> makes me want to <b>keep going<\/b>.", "sk": "<u>What I admire most about him is<\/u> hard work → feel like <b>giving up<\/b> → <u>seeing him work so hard<\/u> → <b>keep going<\/b>", "skj": "一番尊敬：研究への努力 → くじけそう → 頑張る姿を見る → 続けようと思える", "short": {"en": "<u>What I admire most about him is<\/u> how hard he works. Whenever I feel like <b>giving up<\/b>, he makes me want to <b>keep going<\/b>.", "jp": "彼について一番尊敬しているのは、努力する姿です。くじけそうなときも、彼のおかげで続けようと思えます。", "sk": "<u>What I admire most about him is<\/u> hard work → <b>giving up<\/b> → <b>keep going<\/b>", "skj": "一番尊敬：努力 → くじけそう → 続けようと思える"}, "v": 2}, {"id": "3a4", "label": "結び", "jp": "彼がいなければ、勉強は仕事のように感じるでしょう。彼と一緒だと、楽しく感じます。", "en": "<u>Without him<\/u>, studying <u>would feel<\/u> like work. With him, it feels like fun.", "sk": "<u>Without him<\/u> → <u>would feel<\/u> like work → with him, fun", "skj": "彼がいなければ仕事のよう → 一緒なら楽しい", "v": 2}], "b": [{"id": "3b1", "label": "社会の核　テクノロジー", "jp": "テクノロジーは学び方を変えました。デジタルの道具は生徒の力を引き出し、授業であまり発言しない生徒も、オンラインではよく考えを伝えます。本当の問題は、テクノロジーを使うかどうかではなく、どう使うか、そしてすべての子どもが使えるかどうかです。", "en": "Technology has changed the way we learn. Digital tools can <b>bring out<\/b> the best in students, and students who rarely <b>speak up<\/b> in class often share their ideas online. <u>The real question is not whether<\/u> we use technology, <u>but how<\/u> we use it, and whether every child can use it at all.", "sk": "changed the way we learn → <b>bring out<\/b> the best → <b>speak up<\/b> online → <u>not whether… but how<\/u> → can every child use it?", "skj": "学び方が変わった → 力を引き出す → オンラインなら発言 → 使うかでなく、どう使うか → 全員が使える？", "v": 4}, {"id": "3b2", "label": "追加 C　貧困と教育格差", "jp": "しかし、貧困があると、子どもはテクノロジーを使えません。貧しい家庭の子どもの多くは、タブレットもインターネットも買えないのです。学びがオンラインに移るほど彼らは取り残され、教育のレベルも下がってしまいます。こうして、貧困は次の世代に引き継がれます。", "en": "However, poverty can stop children from using technology. Many children from poor families <u>can afford neither<\/u> a tablet <u>nor<\/u> the internet. <u>The more<\/u> learning moves online, <u>the further<\/u> they <b>fall behind<\/b>, and the level of their education goes down. In this way, poverty is <b>passed on<\/b> to the next generation.", "sk": "poverty → can't use technology → <u>neither<\/u> a tablet <u>nor<\/u> the internet → <u>the more<\/u> online, <u>the further<\/u> they <b>fall behind<\/b> → education level goes down → poverty <b>passed on<\/b>", "skj": "貧困 → テクノロジーを使えない → タブレットもネットもない → オンライン化するほど取り残される → 教育のレベルが下がる → 貧困が次世代へ", "v": 5}, {"id": "3b3", "label": "追加 D　解決策は教育", "jp": "では、どうすればいいのでしょうか。社会問題の多くは知識の不足から生まれるので、一番の長期的な解決策は教育です。政府はすべての子どもにタブレットとネット環境を用意し、学校は生徒に物事をじっくり考える力を教えるべきです。", "en": "So what can we do? Many social problems <b>stem from<\/b> a lack of knowledge, so <u>it is education that<\/u> offers the best long-term solution. The government should give every child a tablet and internet access, and schools should teach students to <b>think things through<\/b>.", "sk": "what can we do? → <b>stem from<\/b> lack of knowledge → <u>it is education that<\/u> → tablet & internet for every child → <b>think things through<\/b>", "skj": "どうすれば？ → 知識不足が原因 → 解決策は教育 → 全員にタブレットとネット → じっくり考える力", "v": 4}, {"id": "3b4", "label": "結び（両用）", "jp": "こうして貧困に取り組んではじめて、テクノロジーがすべての子どもに可能性を開くようにできるのです。", "en": "<u>Only by tackling<\/u> poverty in this way <u>can we<\/u> make sure that technology <b>opens up<\/b> chances for every child.", "sk": "<u>Only by tackling poverty<\/u> in this way <u>can we<\/u> → <b>opens up<\/b> chances", "skj": "こうして貧困に取り組んではじめて → 全員に可能性が開く", "v": 4}]}], "Q": [{"g": "Part 2", "q": "Describe a person who taught you something important.", "tag": "①A・B", "t": 1, "en": "The person who taught me the most is actually my mother, although I only realised it after I started living on my own.", "jp": "一番多くを教えてくれたのは母。気づいたのは一人暮らしを始めてから。"}, {"g": "Part 2", "q": "Describe a family member you admire.", "tag": "①A・B", "t": 1, "en": "The family member I admire most is my mother, who cooked for me every single day when I was in high school.", "jp": "一番尊敬する家族は、高校時代に毎日料理してくれた母。"}, {"g": "Part 2", "q": "Describe a traditional festival or celebration.", "tag": "①核", "t": 1, "en": "In Japan, special occasions are often linked to food, and for my family, that food is sukiyaki.", "jp": "日本では行事と食べ物が結びついていて、うちではそれがすき焼き。"}, {"g": "Part 2", "q": "Describe a place where you like to relax.", "tag": "②A", "t": 2, "en": "Whenever I need to relax, I go for a walk along the sea at Minato Mirai in Yokohama.", "jp": "くつろぎたいときは、みなとみらいの海沿いを歩く。"}, {"g": "Part 2", "q": "Describe a building or area you like in your city.", "tag": "②核", "t": 2, "en": "My favourite area is Minato Mirai, a district that was built where shipyards once stood.", "jp": "好きな地区は、造船所の跡地にできたみなとみらい。"}, {"g": "Part 2", "q": "Describe a time you waited for something.", "tag": "②A", "t": 2, "en": "I once waited almost an hour at Minato Mirai just to see the lights come on over the water.", "jp": "水面に明かりがともるのを見るために、みなとみらいで1時間近く待った。"}, {"g": "Part 2", "q": "Describe a friend / a person who is good at their job.", "tag": "③核・B", "t": 3, "en": "A person who is really good at his job is my friend Nasa, an English teacher I met at my previous job.", "jp": "仕事が本当にできる人は、前の職場で出会った英語教師のなさくん。"}, {"g": "Part 2", "q": "Describe a piece of technology / an app you use.", "tag": "③A", "t": 3, "en": "The app I use most is actually one I made myself, with a lot of help from my friend Nasa.", "jp": "一番使うアプリは、なさくんに手伝ってもらって自分で作ったもの。"}, {"g": "Part 2", "q": "Describe something you are proud of / an achievement.", "tag": "③A", "t": 3, "en": "One thing I am proud of is an app I made for my lessons, which ended up winning a national award.", "jp": "誇りに思うのは、授業用に作り、全国で賞をとったアプリ。"}, {"g": "Part 2", "q": "Describe a time you helped someone.", "tag": "③A", "t": 3, "en": "One time I helped others was when I built an app so that my quieter students could share their ideas.", "jp": "人を助けたのは、発言の少ない生徒が考えを出せるアプリを作ったとき。"}, {"g": "Part 2", "q": "Describe a skill you learned / something new you tried.", "tag": "③A", "t": 3, "en": "A skill I picked up recently is making web apps, which I started doing with my friend Nasa.", "jp": "最近身につけた技能はWebアプリ作り。なさくんと一緒に始めた。"}, {"g": "Part 2", "q": "Describe a book or story you enjoyed.", "tag": "③A", "t": 3, "en": "A story that means a lot to me is Rashomon, which I even turned into an app for my students.", "jp": "思い入れのある物語は『羅生門』。生徒用にアプリにまでした。"}, {"g": "Part 2", "q": "Describe a time you were very busy.", "tag": "③核・A", "t": 3, "en": "The busiest time I remember was when Nasa and I were preparing our app for a national contest.", "jp": "一番忙しかったのは、なさくんとコンテスト用のアプリを準備していたとき。"}, {"g": "Part 2", "q": "Describe an important change in your life.", "tag": "①B", "t": 1, "en": "The biggest change in my life was starting to live on my own, because it changed how I see my mother.", "jp": "人生最大の変化は一人暮らし。母の見方が変わったから。"}, {"g": "Part 3", "q": "Why do fewer families eat together nowadays?", "tag": "①続き 核", "t": 1, "en": "Mainly because people are simply too busy: long working hours leave little time for cooking.", "jp": "一番の理由は忙しさ。長時間労働で料理の時間がない。"}, {"g": "Part 3", "q": "How can people reduce stress?", "tag": "②A ＋ ①続き C", "t": 2, "en": "For me, a slow walk by the sea helps a lot, but talking to family is just as important.", "jp": "海辺の散歩も効くが、家族に話すことも同じくらい大切。"}, {"g": "Part 3", "q": "Should governments encourage healthy lifestyles?", "tag": "①続き D", "t": 1, "en": "Yes. Health is not solely a matter of personal effort; Japan's school lunches are a good example.", "jp": "はい。健康は個人だけの問題ではない。日本の給食が良い例。"}, {"g": "Part 3", "q": "What are the pros and cons of living in a big city?", "tag": "②B ＋ ②続き D", "t": 2, "en": "Cities offer convenience, but many have lost the balance between city life and nature.", "jp": "便利だが、都会と自然のバランスを失った都市が多い。"}, {"g": "Part 3", "q": "Who should protect the environment, individuals or governments?", "tag": "②続き C → D", "t": 2, "en": "Both. Individuals can cut down on plastic, but governments need to phase out fossil fuels.", "jp": "両方。個人はプラを減らし、政府は化石燃料を段階的に廃止すべき。"}, {"g": "Part 3", "q": "Is tourism good or bad for the environment?", "tag": "②続き 核 ＋ D", "t": 2, "en": "It can be both, which is why cities should be developed in a way that keeps green spaces.", "jp": "両面ある。だから都市は緑を残す形で発展させるべき。"}, {"g": "Part 3", "q": "How has technology changed education?", "tag": "③続き 核", "t": 3, "en": "It has transformed it. Digital tools can bring out the best in students who rarely speak up.", "jp": "大きく変えた。発言しない生徒の力を引き出せる。"}, {"g": "Part 3", "q": "Will AI replace teachers?", "tag": "③続き 核 ＋ D", "t": 3, "en": "I doubt it. If students rely on AI for answers, someone still has to teach them to think things through.", "jp": "ないと思う。AIに頼るなら、考え抜く力を教える人が必要。"}, {"g": "Part 3", "q": "Why do some children fall behind at school?", "tag": "③続き C", "t": 3, "en": "Often because of poverty: they can afford neither textbooks nor internet access.", "jp": "多くは貧困が原因。教科書もネットも買えない。"}, {"g": "Part 3", "q": "Why do people commit crimes?", "tag": "③続き C → D", "t": 3, "en": "Many crimes stem from poverty and a lack of education, so education is the long-term solution.", "jp": "多くは貧困と教育不足から。だから長期的な解決策は教育。"}, {"g": "Part 3", "q": "Is money the key to success?", "tag": "③続き C ＋ ③B", "t": 3, "en": "Not entirely, but poverty makes it much harder to succeed, however hard you work.", "jp": "全てではないが、貧困だとどれだけ努力しても成功しにくい。"}, {"g": "Part 3", "q": "What makes a good friend?", "tag": "③B", "t": 3, "en": "Someone who keeps you going. Whenever I feel like giving up, seeing my friend work hard helps me.", "jp": "続ける力をくれる人。くじけそうなとき、友達の頑張りが支え。"}, {"g": "Part 3", "q": "Is social media good for mental health?", "tag": "①続き C", "t": 1, "en": "It can be harmful, and in Japan people often hold back from talking about their problems.", "jp": "害もある。日本では悩みを話すのをためらう人が多い。"}, {"g": "Part 3", "q": "Should rich countries help poorer countries?", "tag": "②続き 核 ＋ ③続き C", "t": 2, "en": "Yes, because poorer countries often suffer most from problems they did least to bring about.", "jp": "はい。貧しい国ほど、自分たちが作っていない問題で苦しむから。"}, {"g": "Task 2", "q": "Some people think governments should spend money on preventing illness rather than treating it. Agree?", "tag": "①続き 核・C・D", "t": 1, "en": "", "jp": "本論1：現代の生活と忙しさが病気の原因（核）／本論2：給食・労働時間・公園で予防（D）／結び：Had we paid more attention…"}, {"g": "Task 2", "q": "Cities are growing rapidly. Do the advantages outweigh the disadvantages?", "tag": "②B ＋ ②続き 核・D", "t": 2, "en": "", "jp": "本論1：便利さ・機会（②B）／本論2：自然とのバランス・環境（核・D）／結論：緑を残す都市づくりが条件"}, {"g": "Task 2", "q": "Some say individuals can do nothing to improve the environment. Agree?", "tag": "②続き C・D", "t": 2, "en": "", "jp": "反対の立場。本論1：個人の行動（C＋レジ袋の例）／本論2：それでも政府の役割（D＋EUの例）"}, {"g": "Task 2", "q": "Online learning will one day replace traditional schools. Agree?", "tag": "③続き 核・C・D", "t": 3, "en": "", "jp": "反対の立場。本論1：オンラインの利点（核）／本論2：取り残される子ども（C）と考え抜く力（D）"}, {"g": "Task 2", "q": "Youth crime is increasing. What are the causes and solutions?", "tag": "③続き C → D", "t": 3, "en": "", "jp": "原因：貧困と教育不足（C＋コロナ禍の例）／解決策：教育と端末の提供（D＋GIGAスクールの例）"}, {"g": "Task 2", "q": "Rich countries should help poorer countries. Discuss both views.", "tag": "③続き C ＋ ②続き 核", "t": 3, "en": "", "jp": "本論1：自国優先の意見／本論2：貧困の連鎖と環境の不公平（C・核）／結び：Only by tackling poverty…"}, {"g": "Task 2", "q": "Families today spend less time together. Why? Is this negative?", "tag": "①続き 核・C", "t": 1, "en": "", "jp": "理由：忙しさ（核＋孤食の例）／評価：悩みを打ち明ける場が減るので否定的（C）"}], "X": [{"k": "t2", "name": "Task 2 序論と結論の型", "sub": "設問の形5つ", "col": "#8E5BC9", "blocks": [{"id": "t20", "label": "賛成・反対（Do you agree or disagree?）", "jp": "序論：［主張］とよく言われる。［理由1］だけでなく［理由2］から、私は強く賛成する。<br>結論：［理由1］と［理由2］から、私は［主張］だと確信している。", "en": "It is often argued that [paraphrase]. I strongly agree, <u>not only because<\/u> [reason 1] <u>but also because<\/u> [reason 2].<br/>In conclusion, I firmly believe that [view], since [reason 1] and [reason 2]."}, {"id": "t21", "label": "両論＋意見（Discuss both views）", "jp": "序論：［A］と考える人も［B］と主張する人もいる。両論を論じ、私が後者を支持する理由を述べる。<br>結論：［A］にも一理あるが、私は［B］だと確信している。", "en": "While some people believe that [A], others argue that [B]. This essay will discuss both views before explaining why I side with the latter.<br/>In conclusion, <u>although [A] has some merit<\/u>, I am convinced that [B]."}, {"id": "t22", "label": "利点と欠点（Advantages / disadvantages）", "jp": "序論：［X］は近年広がっている。利点と欠点を検討し、利点が上回ると論じる。<br>結論：［欠点］はあるが、［X］の利点の方がはるかに大きい。", "en": "[X] has become increasingly common in recent years. This essay will examine both its advantages and disadvantages, and argue that the benefits far outweigh the drawbacks.<br/>In conclusion, <u>despite<\/u> [drawback], the advantages of [X] are far greater."}, {"id": "t23", "label": "原因・問題と解決策（Causes / problems and solutions）", "jp": "序論：［問題］は多くの国で深刻だ。まず主な原因を探り、次に解決策を提案する。<br>結論：［問題］は主に［原因］から生じ、［解決策］によってのみ効果的に解決できる。", "en": "[Problem] is now a serious issue in many countries. This essay will <b>look into<\/b> its main causes and then <b>put forward<\/b> some solutions.<br/>In conclusion, [problem] mainly <b>stems from<\/b> [cause], and <u>only through<\/u> [solution] <u>can it be<\/u> tackled."}, {"id": "t24", "label": "2つの質問（Two-part question）", "jp": "序論：［言い換え］。その理由を説明し、［良い／悪い］変化だと論じる。<br>結論：［答え1］。全体として、［答え2］ので［良い／悪い］傾向だと考える。", "en": "[Paraphrase]. This essay will explain why this is happening and argue that it is a [positive / negative] development.<br/>In conclusion, [answer 1]. <u>On the whole<\/u>, this is a [positive / negative] trend, as [answer 2]."}]}, {"k": "ex", "name": "Task 2 具体例", "sub": "本論に足す6文", "col": "#8E5BC9", "blocks": [{"id": "ex0", "label": "①C に足す（家族の食事）", "jp": "例えば日本では、両親が遅くまで働くために一人で食事をとる子どもが増えており、この傾向は「孤食」と呼ばれています。", "en": "In Japan, for example, a growing number of children eat alone because both parents work late, a trend <u>often referred to as<\/u> <i>koshoku<\/i>."}, {"id": "ex1", "label": "①D に足す（社会の役割）", "jp": "例えばフィンランドでは、1940年代から、すべての児童・生徒に学校給食が無料で提供されています。", "en": "In Finland, for instance, free school meals <u>have been provided<\/u> to all pupils since the 1940s."}, {"id": "ex2", "label": "②C に足す（個人）", "jp": "例えば、日本人一人ひとりがペットボトルを週に1本減らせば、毎年何十億本ものボトルが海に流れ込むのを防げるでしょう。", "en": "<u>If everyone in Japan used<\/u> one fewer plastic bottle a week, for example, billions of bottles <u>could be kept<\/u> out of the sea every year."}, {"id": "ex3", "label": "②D に足す（政府）", "jp": "例えばEUでは、2021年からストローやカトラリーなど、いくつかの使い捨てプラスチック製品が禁止されています。", "en": "The European Union, for instance, <u>has banned<\/u> several single-use plastic items, such as straws and cutlery, since 2021."}, {"id": "ex4", "label": "③C に足す（教育格差）", "jp": "例えばコロナ禍では、ユニセフによると、世界で少なくとも4億6300万人の子どもが遠隔授業を受けられませんでした。", "en": "During the COVID-19 pandemic, for example, at least 463 million children worldwide <u>were unable to<\/u> access remote learning, according to UNICEF."}, {"id": "ex5", "label": "③D に足す（解決策）", "jp": "例えば日本では、GIGAスクール構想により、2021年ごろまでに小中学生に一人一台の端末が配られました。", "en": "<u>By around 2021<\/u>, the GIGA School programme <u>had provided<\/u> every primary and junior high school student in Japan with a tablet or computer."}]}, {"k": "p1", "name": "Part 1 短い答え", "sub": "頻出10テーマ", "col": "#D98E04", "blocks": [{"id": "p100", "label": "仕事・勉強［③］", "jp": "東京の女子中高で国語を教えています。一番好きなのは、生徒が「分かりやすい」と言ってくれた時です。授業用のアプリも作っています。", "en": "I teach Japanese at a girls' junior and senior high school in Tokyo. <u>What I love most is<\/u> when my students tell me my lessons are easy to understand. I also make apps for my classes.", "v": 3}, {"id": "p101", "label": "住んでいる場所［②］", "jp": "横浜に住んでいます。都会で、少し歩けば海があるところが気に入っています。一番好きな場所は、海沿いの新しい街、みなとみらいです。", "en": "I live in Yokohama. It's a big city, and I love that the sea is never far away. My favourite place is Minato Mirai, a new area by the sea.", "v": 3}, {"id": "p102", "label": "家族［①］", "jp": "高校時代、母は毎日料理をしてくれました。一人暮らしをして初めて、その大変さに気づきました。今は母に感謝しています。", "en": "When I was in high school, my mother cooked for me every day. <u>It was not until<\/u> I lived on my own <u>that<\/u> I realised how hard it is. Now I am thankful to her.", "v": 3}, {"id": "p103", "label": "趣味・休日［③／②］", "jp": "休日は、友達のなさくんとよく勉強したりアプリを作ったりします。疲れたら海沿いを歩いて、将来の話をします。", "en": "On my days off, I often study and make apps with my friend Nasa. When we get tired, we walk by the sea and talk about the future.", "v": 3}, {"id": "p104", "label": "スマホ・アプリ・AI［③］", "jp": "スマホは主に勉強と仕事に使っています。AIも使います。生徒がAIの演じる老婆と議論するアプリも作りました。", "en": "I mainly use my phone for study and work. I also use AI. I made an app where students debate with an old woman <u>played by AI<\/u>.", "v": 3}, {"id": "p110", "label": "旅行［②］", "jp": "遠くへ旅行することはあまりありません。みなとみらいのような好きな場所に、何度も行くのが好きです。夜は街の明かりが水面に映ります。", "en": "I don't travel far very often. I like going back to my favourite places, like Minato Mirai. At night, the city lights <u>are reflected<\/u> in the water.", "v": 3}, {"id": "p111", "label": "健康・運動・ストレス［②／①］", "jp": "激しい運動はしませんが、よく歩きます。海沿いをゆっくり歩くと、いつも気持ちが落ち着きます。自分で料理するようにもしています。", "en": "I don't do hard exercise, but I walk a lot. A slow walk by the sea always helps me <b>calm down<\/b>. I also try to cook for myself.", "v": 3}, {"id": "p112", "label": "食べ物・料理［①］", "jp": "好きな料理はすき焼きです。日本の伝統的な鍋料理で、家族が集まるときによく食べられます。いつも母の思い出をよみがえらせてくれます。", "en": "My favourite dish is sukiyaki. It is a traditional Japanese hot pot dish, and it <u>is often eaten<\/u> when the whole family gets together. It always <b>brings back<\/b> memories of my mother.", "v": 3}, {"id": "p113", "label": "読書・映画・芸術［③］", "jp": "仕事柄、物語をたくさん読みます。好きな作品の一つは『羅生門』です。授業用のアプリまで作りました。", "en": "Because of my job, I read a lot of stories. One of my favourites is Rashomon. I even made an app for teaching it.", "v": 3}, {"id": "p114", "label": "ニュース・社会問題［③の続き］", "jp": "ニュースはたいていスマホで読みます。一番気になる問題は貧困です。貧しい子どもの多くは、教科書もインターネットも買えません。", "en": "I usually read the news on my phone. The issue I care about most is poverty. Many poor children <u>can afford neither<\/u> textbooks <u>nor<\/u> the internet.", "v": 3}]}, {"k": "t1", "name": "Task 1 図表の型", "sub": "共通の型＋7種類", "col": "#3C9D5D", "blocks": [{"id": "t100", "label": "共通の型｜導入", "jp": "<b>この［図の種類］は、［年］から［年］までの［場所］における［何］を比較している。<\/b>", "en": "<b>The [chart type] compares [what is measured] in<\/b> <b>[place] over the period between [year] and [year].<\/b>"}, {"id": "t101", "label": "共通の型｜全体像", "jp": "<b>全体として、［主な傾向］であることが明確に分かる。一方で、［もう一つの特徴］。最も目立つのは、［最大の変化・差］という点である。<\/b>", "en": "<b>Overall, it is clear that [main trend], while [second<\/b> <b>feature]. The most striking feature is [the biggest<\/b> <b>change or difference].<\/b>"}, {"id": "t102", "label": "共通の型｜本文 1", "jp": "<b>まず［A］を見ると、［年］には［数値］だったことが分かる。その後、数値は［数値］まで着実に上昇し、［年］に［数値］でピークに達した。<\/b>", "en": "<b>Looking first at [A], we can see that it stood at<\/b> <b>[figure] in [year]. After that, the figure rose steadily<\/b> <b>to [figure], before reaching a peak of [figure] in<\/b> <b>[year].<\/b>"}, {"id": "t103", "label": "共通の型｜本文 2", "jp": "<b>［B］と［C］に目を向けると、数値はそれぞれ［X］と［Y］だった。対照的に、［B］は［数値］まで急激に減少したため、最高値と最低値の差は［X］から［Y］に縮まった。<\/b>", "en": "<b>Turning to [B] and [C], the figures were [X] and [Y]<\/b> <b>respectively. By contrast, [B] fell sharply to [figure],<\/b> <b>so the gap between the highest and lowest figures<\/b> <b>narrowed from [X] to [Y].<\/b>"}, {"id": "t110", "label": "折れ線グラフ｜導入", "jp": "この折れ線グラフは、2005年から2025年までの、月に1回以上ネットで買い物をした人の割合を、3つの年齢層について<b>比較している<\/b>。", "en": "The line graph <b>compares<\/b> the percentage of people in three age groups who shopped online at least once a month <b>over the period between<\/b> 2005 <b>and<\/b> 2025."}, {"id": "t111", "label": "折れ線グラフ｜全体像", "jp": "<b>全体として、<\/b>3つの年齢層すべてでネット通販の利用が広がり、<b>期間を通じて<\/b>18～34歳が<b>首位を保ったことが明確に分かる<\/b>。<b>最も目立つのは、<\/b>2015年以降の55歳以上の急激な伸びである。", "en": "<b>It can clearly be seen that<\/b> online shopping became more popular among all three groups, <b>while<\/b> 18- to 34-year-olds <b>kept the top position throughout the<\/b> <b>whole period<\/b>. <b>The most striking feature is<\/b> the rapid rise among people aged 55 and over after 2015."}, {"id": "t120", "label": "折れ線グラフ｜本文 1", "jp": "<b>まず<\/b>18～34歳<b>を見ると、<\/b>2005年<b>には<\/b>30%<b>だったことが分かる<\/b>。<b>その後、数値は<\/b>2015年に55%<b>まで着実に上昇し、<\/b>2025年<b>には<\/b>80%<b>に達した<\/b>。35～54歳も<b>同様の動きを示し、<\/b>15%<b>から<\/b>35%、<b>さらに<\/b>60%<b>へと伸びた<\/b>。", "en": "<b>Looking first at<\/b> 18- to 34-year-olds, <b>we can see<\/b> <b>that<\/b> 30% of them shopped online in 2005. <b>After<\/b> <b>that, the figure rose steadily to<\/b> 55% in 2015, <b>before reaching<\/b> 80% in 2025. The 35–54 age group <b>followed a similar pattern<\/b>, <b>climbing from<\/b> 15% <b>to<\/b> 35% <b>and then<\/b> 60%."}, {"id": "t121", "label": "折れ線グラフ｜本文 2", "jp": "55歳以上<b>に目を向けると、<\/b>2005年<b>の数値は<\/b>わずか5%で、<b>その後の10年間で<\/b>10%<b>へとわずかに増えただけだった<\/b>。<b>しかし、その後<\/b>2025年<b>までに<\/b>45%<b>へと急増した<\/b>。<b>その結果、最高値と最低値の差は<\/b>2015年の45ポイント<b>から<\/b>2025年の35ポイント<b>に縮まった<\/b>。", "en": "<b>Turning to<\/b> people aged 55 and over, <b>the figure<\/b> <b>stood at<\/b> just 5% in 2005 <b>and increased only<\/b> <b>slightly to<\/b> 10% <b>over the following decade<\/b>. <b>However, it then surged to<\/b> 45% by 2025. <b>As a<\/b> <b>result, the gap between the highest and lowest<\/b> <b>figures narrowed from<\/b> 45 percentage points in 2015 <b>to<\/b> 35 in 2025."}, {"id": "t130", "label": "棒グラフ｜導入", "jp": "この棒グラフは、2024年にある国の男性と女性が、4つの余暇活動に1週間あたり平均何時間を費やしたかを<b>比較している<\/b>。", "en": "The bar chart <b>compares<\/b> the average number of hours per week that men and women in one country spent on four leisure activities in 2024."}, {"id": "t131", "label": "棒グラフ｜全体像", "jp": "<b>全体として、<\/b>テレビ視聴が男女ともに最も人気のある活動で、<b>一方<\/b>読書は最も少なかった<b>ことが明確に分かる<\/b>。男性はテレビとスポーツに、女性は読書とSNSにより多くの時間を使っていた。", "en": "<b>Overall, it is clear that<\/b> watching TV was the most popular activity for both sexes, <b>while<\/b> reading was the least popular. Men spent more time on TV and sport, <b>whereas<\/b> women spent more on reading and social media."}, {"id": "t140", "label": "棒グラフ｜本文 1", "jp": "<b>まず<\/b>男性<b>を見ると、<\/b>テレビ視聴は週12時間で、<b>群を抜いて最も高い数値だった<\/b>。SNSが7時間で<b>2位、<\/b>スポーツが6時間で<b>それに続いた<\/b>。読書は<b>わずか<\/b>2時間で、<b>グラフ中で最も低い数値だった<\/b>。", "en": "<b>Looking first at<\/b> men, <b>we can see that<\/b> they spent 12 hours a week watching TV, <b>which was by far the<\/b> <b>highest figure<\/b>. Social media <b>came second at<\/b> 7 hours, <b>followed by<\/b> sport <b>at<\/b> 6 hours. Reading <b>accounted for just<\/b> 2 hours, <b>the lowest figure in the<\/b> <b>chart<\/b>."}, {"id": "t141", "label": "棒グラフ｜本文 2", "jp": "女性<b>に目を向けると、<\/b>テレビ<b>も最も人気のある活動で、<\/b>10時間<b>だった<\/b>。<b>しかし<\/b>女性はSNSに9時間を使い、男性<b>より2時間多く、<\/b>読書は5時間で男性<b>の2倍以上だった<\/b>。<b>対照的に、<\/b>スポーツは3時間で、男性<b>の半分にとどまった<\/b>。", "en": "<b>Turning to<\/b> women, TV <b>was also the most popular<\/b> <b>activity, at<\/b> 10 hours. <b>However,<\/b> women spent 9 hours on social media, <b>two hours more than<\/b> men, and 5 hours reading, <b>more than twice as much as<\/b> men. <b>By contrast, they did only half as much<\/b> sport <b>as<\/b> men, <b>at<\/b> 3 hours."}, {"id": "t150", "label": "円グラフ｜導入", "jp": "この2つの円グラフは、ある国で5つの電源から作られた電力の<b>割合を<\/b>、2000年<b>と<\/b>2020年<b>で比較している<\/b>。", "en": "The two pie charts <b>compare the proportions of<\/b> electricity generated from five sources in one country <b>in<\/b> 2000 <b>and<\/b> 2020."}, {"id": "t151", "label": "円グラフ｜全体像", "jp": "<b>全体として、<\/b>主な電源は石炭からガスと再生可能エネルギーに<b>置き換わり、<\/b>水力の割合は<b>変わらなかった<\/b>。<b>最も目立つ変化は、<\/b>再生可能エネルギーの急速な伸びである。", "en": "<b>Overall,<\/b> coal <b>was replaced by<\/b> gas and renewables <b>as the main sources<\/b>, <b>while<\/b> the share of hydropower <b>remained unchanged<\/b>. <b>The most<\/b> <b>striking change was<\/b> the rapid growth of renewable energy."}, {"id": "t160", "label": "円グラフ｜本文 1", "jp": "2000年<b>には、<\/b>石炭が全電力のほぼ半分<b>を占め、<\/b>45%<b>だった<\/b>。ガスは4分の1<b>を占め、<\/b>原子力は15%<b>だった<\/b>。<b>しかし<\/b>2020年<b>までに、<\/b>石炭の割合は20%<b>に低下し、<\/b>原子力も10%<b>へとわずかに減少していた<\/b>。石炭は<b>合計<\/b>25ポイント<b>の減少だった<\/b>。", "en": "<b>In<\/b> 2000, coal <b>accounted for<\/b> almost half of all electricity, <b>at<\/b> 45%. Gas <b>made up<\/b> a quarter, <b>while<\/b> nuclear power <b>represented<\/b> 15%. <b>By<\/b> 2020, <b>however,<\/b> coal&#x27;s share <b>had fallen to<\/b> 20%, <b>and<\/b> nuclear power <b>had also declined slightly to<\/b> 10%. <b>This represented a total fall of<\/b> 25 percentage points <b>for<\/b> coal."}, {"id": "t161", "label": "円グラフ｜本文 2", "jp": "<b>ほかの電源に目を向けると、<\/b>再生可能エネルギーはわずか5%<b>から<\/b>30%<b>へと大幅に伸び、元の6倍になった<\/b>。ガスも25%<b>から<\/b>30%<b>に上昇した<\/b>。<b>その結果、<\/b>この2つで2020年の電力の60%<b>を占めた<\/b>。水力は<b>両年とも<\/b>10%<b>のままだった<\/b>。<b>つまり、<\/b>再生可能エネルギーは2000年<b>に首位だった<\/b>石炭<b>を追い抜いたことになる<\/b>。", "en": "<b>Turning to the other sources,<\/b> renewables <b>grew<\/b> <b>dramatically from<\/b> just 5% <b>to<\/b> 30%, <b>six times the<\/b> <b>original figure<\/b>, <b>and<\/b> gas <b>rose from<\/b> 25% <b>to<\/b> 30%. <b>As<\/b> <b>a result, these two sources together accounted for<\/b> 60% of electricity in 2020. Hydropower <b>stayed at<\/b> 10% <b>in both years<\/b>. <b>In other words,<\/b> renewables <b>overtook<\/b> coal, <b>which had been the leading source<\/b> <b>in<\/b> 2000."}, {"id": "t170", "label": "表｜導入", "jp": "この表は、2023年の4つの大学を、学生数、留学生の割合、卒業生の就職率<b>という点で比較している<\/b>。", "en": "The table <b>compares<\/b> four universities <b>in terms of<\/b> their student numbers, the proportion of international students and graduate employment rates in 2023."}, {"id": "t171", "label": "表｜全体像", "jp": "<b>全体として、<\/b>A大学が最も規模が大きかった<b>が、<\/b>留学生の割合と就職率は<b>どちらも<\/b>B大学が最も高かった。C大学は<b>この2つの項目でいずれも最低だった<\/b>。", "en": "<b>Overall,<\/b> University A <b>was the largest<\/b>, <b>but<\/b> University B <b>had the highest figures for both<\/b> international students and graduate employment. University C <b>recorded the lowest figures in both of<\/b> <b>these categories<\/b>."}, {"id": "t180", "label": "表｜本文 1", "jp": "<b>まず<\/b>学生数<b>を見ると、<\/b>A大学は3万人で、1万6千人のB大学<b>のほぼ2倍だった<\/b>。C大学とD大学は<b>はるかに小さく、それぞれ<\/b>1万2千人<b>と<\/b>8千人<b>だった<\/b>。A大学とB大学<b>を合わせると、<\/b>4大学の学生全体<b>の3分の2以上を占めていた<\/b>。", "en": "<b>Looking first at<\/b> student numbers, University A <b>had<\/b> 30,000 students, <b>almost twice as many as<\/b> University B, <b>at<\/b> 16,000. Universities C and D <b>were<\/b> <b>much smaller, with<\/b> 12,000 <b>and<\/b> 8,000 students <b>respectively<\/b>. <b>Together,<\/b> Universities A and B <b>accounted for more than two thirds of<\/b> all the students at the four institutions."}, {"id": "t181", "label": "表｜本文 2", "jp": "留学生<b>に目を向けると、最も割合が高かったのは<\/b>B大学で、学生の40%<b>が海外出身だった<\/b>。<b>これに対し、<\/b>A大学は25%、C大学は<b>わずか<\/b>10%<b>だった<\/b>。就職率<b>では、<\/b>B大学が92%で<b>再び首位となり、<\/b>C大学は78%で<b>最も低かった<\/b>。A大学とD大学<b>の数値は近く、それぞれ<\/b>85%<b>と<\/b>88%<b>だった<\/b>。", "en": "<b>Turning to<\/b> international students, <b>the highest<\/b> <b>proportion was at<\/b> University B, <b>where<\/b> 40% <b>of<\/b> <b>students came from abroad, compared with<\/b> 25% <b>at<\/b> University A <b>and only<\/b> 10% <b>at<\/b> University C. <b>In<\/b> <b>terms of<\/b> employment, University B <b>again came<\/b> <b>first, with<\/b> 92%, <b>while<\/b> University C <b>had the lowest<\/b> <b>rate, at<\/b> 78%. <b>The figures for<\/b> A <b>and<\/b> D <b>were similar,<\/b> <b>at<\/b> 85% <b>and<\/b> 88% <b>respectively<\/b>."}, {"id": "t190", "label": "複合グラフ｜導入", "jp": "この棒グラフは2016年から2024年にある都市を訪れた観光客数を示し、<b>折れ線グラフは<\/b>観光客1人あたりの平均支出額<b>を示している<\/b>。", "en": "The bar chart <b>shows<\/b> the number of tourists who visited a city <b>between<\/b> 2016 <b>and<\/b> 2024, <b>while the<\/b> <b>line graph shows<\/b> the average amount each tourist spent."}, {"id": "t191", "label": "複合グラフ｜全体像", "jp": "<b>全体として、<\/b>観光客数は2020年に急減した<b>後、<\/b>2024年に<b>期間中の最高水準まで回復した<\/b>。<b>対照的に、<\/b>平均支出額は<b>逆の動きを示し、<\/b>2020年に<b>ピークに達した後、減少した<\/b>。", "en": "<b>Overall,<\/b> tourist numbers fell sharply in 2020 <b>before<\/b> <b>recovering to their highest level<\/b> in 2024. <b>By<\/b> <b>contrast,<\/b> average spending <b>moved in the opposite<\/b> <b>direction, peaking<\/b> in 2020 <b>and then declining<\/b>."}, {"id": "t1100", "label": "複合グラフ｜本文 1", "jp": "<b>まず<\/b>観光客数<b>を見ると、<\/b>2016年は400万人で、<b>この数値は2年後に<\/b>500万人<b>に増えた<\/b>。<b>しかしその後、<\/b>2020年に150万人<b>へと激減した<\/b>。<b>その後は着実に回復し、<\/b>2022年に350万人、2024年に<b>は<\/b>600万人<b>でピークに達した<\/b>。", "en": "<b>Looking first at<\/b> visitor numbers, the city <b>received<\/b> 4 million tourists in 2016, <b>and this figure rose to<\/b> 5 million <b>two years later<\/b>. <b>However, it then dropped<\/b> <b>dramatically to<\/b> 1.5 million in 2020. <b>After that,<\/b> <b>numbers recovered steadily, reaching<\/b> 3.5 million in 2022 <b>and a peak of<\/b> 6 million in 2024."}, {"id": "t1101", "label": "複合グラフ｜本文 2", "jp": "支出額<b>に目を向けると、<\/b>観光客1人あたりの平均は2016年に300ポンドで、2018年に<b>は<\/b>320ポンド<b>へとわずかに増えた<\/b>。<b>その後<\/b>2020年に450ポンド<b>へと跳ね上がり、期間中の最高値となった<\/b>。<b>それ以降は<\/b>2022年に400ポンド、2024年に350ポンド<b>へと徐々に減少した<\/b>。", "en": "<b>Turning to<\/b> spending, <b>the average figure per tourist<\/b> <b>was<\/b> £300 in 2016 <b>and increased slightly to<\/b> £320 in 2018. <b>It then jumped to<\/b> £450 in 2020, <b>the highest<\/b> <b>point in the period<\/b>. <b>Since then, it has gradually<\/b> <b>fallen, to<\/b> £400 in 2022 <b>and<\/b> £350 in 2024."}, {"id": "t1110", "label": "地図｜導入", "jp": "この2枚の地図は、1995年から現在までに、ある海辺の村<b>で起きた変化を示している<\/b>。北は地図の上側である。", "en": "The two maps <b>illustrate the changes that have<\/b> <b>taken place in<\/b> a small coastal village <b>between<\/b> 1995 <b>and the present day<\/b>. North is at the top of both maps."}, {"id": "t1111", "label": "地図｜全体像", "jp": "<b>全体として、<\/b>村は漁村から観光地<b>へと大きく変わった<\/b>。幹線道路と森は<b>ほぼそのままだが、<\/b>海沿いにはいくつもの新しい施設<b>が建てられた<\/b>。", "en": "<b>Overall,<\/b> the village <b>has been transformed from<\/b> a fishing community <b>into<\/b> a tourist destination. <b>While<\/b> the main road and the forest <b>remain largely<\/b> <b>unchanged,<\/b> several new facilities <b>have been built<\/b> along the coast."}, {"id": "t1120", "label": "地図｜本文 1", "jp": "1995年<b>には、<\/b>村の<b>南部に<\/b>小さな漁港があり、幹線道路<b>沿いに<\/b>家が並んでいた。道路<b>の東側の土地は<\/b>農地<b>として使われていた<\/b>。<b>それ以来、<\/b>漁港はマリーナ<b>に置き換えられ、<\/b>農地は駐車場付きのホテル<b>に転用された<\/b>。", "en": "<b>In<\/b> 1995, <b>there was<\/b> a small fishing harbour <b>in the<\/b> <b>south of<\/b> the village, <b>with<\/b> a row of houses <b>along<\/b> the main road. <b>The area to the east of<\/b> the road <b>was<\/b> <b>used as<\/b> farmland. <b>Since then,<\/b> the harbour <b>has<\/b> <b>been replaced by<\/b> a marina, <b>and<\/b> the farmland <b>has<\/b> <b>been converted into<\/b> a hotel <b>with<\/b> a car park."}, {"id": "t1121", "label": "地図｜本文 2", "jp": "<b>さらに、<\/b>マリーナ<b>の西側の<\/b>砂浜が整備され、<b>その隣に<\/b>カフェと商店<b>が建てられた<\/b>。幹線道路は<b>北へ延長され、<\/b>新しい鉄道駅<b>とつながった<\/b>。<b>一方、<\/b>北西の森は<b>変わらず残り、<\/b>村で唯一の自然林<b>となっている<\/b>。", "en": "<b>In addition,<\/b> the beach <b>to the west of<\/b> the marina <b>has been developed, with<\/b> a café and a row of shops <b>built next to it<\/b>. The main road <b>has been<\/b> <b>extended northwards to<\/b> a new railway station. <b>However,<\/b> the forest <b>in the north-west<\/b> <b>has<\/b> <b>remained unchanged, providing<\/b> the only natural woodland <b>in the village<\/b>."}, {"id": "t1130", "label": "工程図｜導入", "jp": "この図は、カカオの実の収穫から完成品までの、チョコレート<b>が作られる工程を示している<\/b>。", "en": "The diagram <b>illustrates the process by which<\/b> chocolate <b>is produced<\/b>, <b>from<\/b> the harvesting of cocoa pods <b>to<\/b> the finished product."}, {"id": "t1131", "label": "工程図｜全体像", "jp": "<b>全体として、この工程は<\/b>8つの<b>主要な段階から成る<\/b>。<b>最初の3段階は<\/b>農園<b>で行われ、<\/b>輸送<b>を経て、残りの4段階は<\/b>工場<b>で行われる<\/b>。", "en": "<b>Overall, the process consists of<\/b> eight <b>main stages<\/b>. <b>The first three take place on<\/b> the farm, <b>followed by<\/b> transport, <b>while the last four are carried out in<\/b> a factory."}, {"id": "t1140", "label": "工程図｜本文 1", "jp": "<b>最初の段階では、<\/b>熟したカカオの実<b>が収穫され、<\/b>豆<b>が取り出される<\/b>。<b>次に、<\/b>豆は数日間<b>発酵させられ、その後<\/b>広げて天日で<b>乾燥される<\/b>。豆が<b>乾燥すると、<\/b>袋に詰められ、チョコレート工場<b>へ運ばれる<\/b>。", "en": "<b>At the first stage,<\/b> ripe cocoa pods <b>are harvested<\/b> <b>and<\/b> the beans <b>are removed<\/b>. <b>These are then left to<\/b> ferment <b>for several days, after which they are<\/b> spread out and dried in the sun. <b>Once<\/b> the beans <b>have dried, they are<\/b> packed into sacks <b>and<\/b> <b>transported to<\/b> a chocolate factory."}, {"id": "t1141", "label": "工程図｜本文 2", "jp": "工場<b>では、<\/b>豆<b>はまず<\/b>焙煎<b>され、<\/b>風味が引き出される。<b>次に、<\/b>カカオマス<b>と呼ばれる<\/b>濃い液体<b>にすりつぶされる<\/b>。<b>これに<\/b>砂糖と牛乳<b>が加えられる<\/b>。<b>最後に、<\/b>混ぜたものが型<b>に流し込まれて<\/b>冷やされ、包装されて店<b>へ送られる<\/b>。", "en": "<b>At<\/b> the factory, the beans <b>are first<\/b> roasted, <b>which<\/b> <b>helps to<\/b> develop their flavour. <b>Next, they are<\/b> <b>ground into<\/b> a thick liquid <b>known as<\/b> cocoa mass. <b>This is then mixed with<\/b> sugar and milk. <b>Finally,<\/b> the mixture <b>is poured into<\/b> moulds <b>and<\/b> cooled, <b>before<\/b> the bars <b>are wrapped and sent to<\/b> shops."}]}], "E": {"P1": [{"k": "work", "name": "仕事", "intro": "Let's talk about what you do.", "hint": "p100", "first": true, "qs": ["Do you work or are you a student?", "What do you do in your job?", "Why did you choose this job?", "What do you like most about your job?", "Would you like to change your job in the future?"], "ia": "x_2e0055e0", "qa": ["x_3299ed52", "x_3aacef33", "x_5d3537b8", "x_559fda65", "x_32957532"]}, {"k": "home", "name": "住まい", "intro": "Let's talk about where you live.", "hint": "p101", "first": true, "qs": ["Where do you live?", "What do you like most about the area where you live?", "Is there anything you would like to change about your area?", "Do you think you will live there for a long time?"], "ia": "x_b45ef03d", "qa": ["x_b035a709", "x_e49b1ae7", "x_550e3260", "x_1e871c63"]}, {"k": "family", "name": "家族", "intro": "Let's talk about your family.", "hint": "p102", "qs": ["Do you spend a lot of time with your family?", "Who are you closest to in your family?", "Did your family often eat together when you were a child?"], "ia": "x_9feffe65", "qa": ["x_d8a7ed8e", "x_f4422abb", "x_69294a61"]}, {"k": "free", "name": "休日・趣味", "intro": "Let's talk about your free time.", "hint": "p103", "qs": ["What do you usually do in your free time?", "What did you do last weekend?", "Do you prefer spending your free time alone or with other people?"], "ia": "x_7c300aac", "qa": ["x_b2e7601d", "x_51aecaa2", "x_800db76b"]}, {"k": "friends", "name": "友達", "intro": "Let's ting it.\n\nTo what extent do you agree or disagree?", "type": "t20", "en": "", "jp": "本論1：現代の生活と忙しさが病気の原因（核）／本論2：給食・労働時間・公園で予防（D）／結び：Had we paid more attention…", "intro": "It is often argued that governments should spend more on preventing illness than on treating it. I strongly agree, <u>not only because<\/u> prevention protects people's daily lives <u>but also because<\/u> it saves money in the long run.", "concl": "In conclusion, I firmly believe that prevention should come first, since it keeps people healthy and reduces the cost of treatment."}, {"t": 2, "tag": "②B ＋ ②続き 核・D", "q": "In many countries, more and more people are moving to large cities, and cities are growing rapidly.\n\nDo the advantages of this development outweigh the disadvantages?", "type": "t22", "en": "", "jp": "本論1：便利さ・機会（②B）／本論2：自然とのバランス・環境（核・D）／結論：緑を残す都市づくりが条件", "intro": "More and more people are moving to large cities, and cities have grown rapidly in recent years. This essay will examine both the advantages and disadvantages of this trend, and argue that the benefits outweigh the drawbacks.", "concl": "In conclusion, <u>despite<\/u> the damage to the environment, the advantages of city life are far greater, as long as cities are planned well."}, {"t": 2, "tag": "②続き C・D", "q": "Some people say that individuals can do nothing to improve the environment, and that only governments and large companies can make a difference.\n\nTo what extent do you agree or disagree?", "type": "t20", "en": "", "jp": "反対の立場。本論1：個人の行動（C＋レジ袋の例）／本論2：それでも政府の役割（D＋EUの例）", "intro": "While some people believe that individuals can do nothing for the environment, others argue that everyone has a part to play. This essay will discuss both views before explaining why I side with the latter.", "concl": "In conclusion, <u>although<\/u> governments have the greatest power, I am convinced that small actions by individuals also make a real difference."}, {"t": 3, "tag": "③続き 核・C・D", "q": "Some people believe that online learning will one day completely replace traditional schools.\n\nTo what extent do you agree or disagree?", "type": "t20", "en": "", "jp": "反対の立場。本論1：オンラインの利点（核）／本論2：取り残される子ども（C）と考え抜く力（D）", "intro": "It is often argued that online learning will one day replace traditional schools. I strongly disagree, <u>not only because<\/u> many children cannot use technology at home <u>but also because<\/u> school is a place where children learn with others.", "concl": "In conclusion, I firmly believe that online learning will support schools rather than replace them, since not every child can learn online and children need each other."}, {"t": 3, "tag": "③続き C → D", "q": "In many countries, crime committed by young people is increasing.\n\nWhat are the causes of this problem, and what solutions can you suggest?", "type": "t23", "en": "", "jp": "原因：貧困と教育不足（C＋コロナ禍の例）／解決策：教育と端末の提供（D＋GIGAスクールの例）", "intro": "Crime by young people is now a serious issue in many countries. This essay will <b>look into<\/b> its main causes and then <b>put forward<\/b> some solutions.", "concl": "In conclusion, youth crime mainly <b>stems from<\/b> poverty and a lack of education, and <u>only through<\/u> better education <u>can it be<\/u> tackled."}, {"t": 3, "tag": "③続き C ＋ ②続き 核", "q": "Some people believe that rich countries should give financial help to poorer countries. Others think that each country should solve its own problems.\n\nDiscuss both these views and give your own opinion.", "type": "t21", "en": "", "jp": "本論1：自国優先の意見／本論2：貧困の連鎖と環境の不公平（C・核）／結び：Only by tackling poverty…", "intro": "While some people believe that each country should solve its own problems, others argue that rich countries should help poorer ones. This essay will discuss both views before explaining why I side with the latter.", "concl": "In conclusion, <u>although<\/u> every country is responsible for itself, I am convinced that rich countries should help, especially through education."}, {"t": 1, "tag": "①続き 核・C", "q": "In ms does this cause, and what can be done to solve them?", "en": "", "jp": "②A（歩くと落ち着く）＋①続き C（忙しさで食生活が乱れる）", "intro": "Many people today work long hours and have little time to relax, and this is now a serious issue. This essay will <b>look into<\/b> the main problems it causes and then <b>put forward<\/b> some solutions.", "concl": "In conclusion, long working hours harm both our bodies and our minds, and <u>only through<\/u> changes by both companies and the government <u>can this be<\/u> tackled."}, {"t": 2, "tag": "②続き 核・D", "type": "t22", "q": "International tourism has grown rapidly in recent years.\n\nDo the advantages of this outweigh the disadvantages?", "en": "", "jp": "②続き：観光と環境（核）→ 政府の対策（D）", "intro": "International tourism has become increasingly common in recent years. This essay will examine both its advantages and disadvantages, and argue that the benefits outweigh the drawbacks.", "concl": "In conclusion, <u>despite<\/u> the damage to the environment, the advantages of tourism are far greater, as long as clear rules are made."}, {"t": 2, "tag": "②続き C・D", "type": "t21", "q": "Some people think that the best way to reduce plastic waste is to ban plastic bags and bottles. Others believe that education is more effective.\n\nDiscuss both these views and give your own opinion.", "en": "", "jp": "②続き：個人ができること（C）と政府のルール（D）", "intro": "While some people believe that banning plastic bags and bottles is the best way to reduce waste, others argue that education is more effective. This essay will discuss both views before giving my own opinion.", "concl": "In conclusion, <u>although<\/u> education is important, I am convinced that clear rules from the government work faster, and both are needed."}, {"t": 3, "tag": "③続き 核・C", "type": "t23", "q": "Children today spend too much time on smartphones and computers.\n\nWhy is this happening, and what can be done about it?", "en": "", "jp": "③続き：テクノロジーが生活を変えた（核）→ 使い方を教える（C・D）", "intro": "Children today spend too much time on smartphones and computers. This essay will <b>look into<\/b> the main causes of this and then <b>put forward<\/b> some solutions.", "concl": "In conclusion, this problem mainly <b>stems from<\/b> how deeply technology has entered our lives, and <u>only through<\/u> education <u>can it be<\/u> tackled."}, {"t": 3, "tag": "③続き 核・C・D", "type": "t21", "q": "Some people think that technology has made education better. Others feel that it has made learning worse.\n\nDiscuss both these views and give your own opinion.", "en": "", "jp": "③続き：テクノロジーで学びが変わった（核）→ 使えない子との差（C）→ 解決策（D）", "intro": "While some people believe that technology has made learning worse, others argue that it has made education better. This essay will discuss both views before explaining why I side with the latter.", "concl": "In conclusion, <u>although<\/u> technology can be a distraction, I am convinced that it improves education, as long as every child can use it."}, {"t": 3, "tag": "③続き C → D", "type": "t23", "q": "In many countries, the gap between rich and poor people is growing.\n\nWhat problems does this cause, and what solutions can you suggest?", "en": "", "jp": "③続き：貧困だとテクノロジーを使えない → 教育のレベルも下がる（C）→ 解決策（D）", "intro": "In many countries, the gap between rich and poor people is growing, and this is now a serious issue. This essay will <b>look into<\/b> the problems it causes and then <b>put forward<\/b> some solutions.", "concl": "In conclusion, the gap between rich and poor mainly harms children's education, and <u>only through<\/u> education for every child <u>can it be<\/u> tackled."}], "L": {"intro": {"s": "Now, in this first part, I'd like to ask you some questions about yourself.", "a": "x_817d4538"}, "p2": {"s": "Now I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. Before you talk, you'll have one minute to think about what you're going to say. You can make some notes if you wish. Here is your topic.", "a": "x_56f9b1ac"}, "start": {"s": "All rig function buildCourse(T){const steps=[];let left=T;const push=(type,ids,min,title,extra)=>{steps.push({type,ids,min,title,...(extra||{})});left-=min};
  const order=TIERS.flatMap(([,ids])=>ids);const pr=id=>order.indexOf(id);
