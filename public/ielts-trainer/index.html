<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>IELTS 暗記トレーナー</title>

<style>
/* VOICE: cheerful study buddy, light and quick, never childish
   IDEA: a deck of flash cards from the booklet — each round deals one card
   PICTURE: the live card itself, big and tappable, with the 4-koma strip as scenery
   COLOUR and TYPE: booklet coral / teal / indigo on warm paper; Zen Maru Gothic + Nunito
   LAYOUT: one column up to 640px, score bar on top, card centre, controls under the thumb */
:root{color-scheme:light dark;--bg:light-dark(#fbf7f2,#17181c);--paper:light-dark(#ffffff,#22242a);--ink:light-dark(#24323d,#eef0f3);--mut:light-dark(#6b7883,#a3acb5);--line:light-dark(#ece6de,#33363e);
--c1:#E76F51;--c2:#2A9D8F;--c3:#5468D4;--gold:#F2B705;--ok:#2BA36B;--ng:#E5484D}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Nunito','Zen Maru Gothic',system-ui,sans-serif;overflow-x:clip}
.jp,h1,h2,h3,.btn,.lab{font-family:'Zen Maru Gothic','Nunito',system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(4vw,14px,env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lvl{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.lvl b{font:900 15px 'Nunito'}.lvl small{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--gold));border-radius:9px;transition:width .5s}
.pill{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:8px 12px;text-align:center;font:800 13px 'Nunito';color:var(--mut)}.pill b{display:block;font-size:18px;color:var(--ink)}
h1{font-size:clamp(28px,7vw,38px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.lead{color:var(--mut);margin:0 0 16px;font-size:15px}
.deck{display:grid;gap:12px}
.tpl{border:0;text-align:left;cursor:pointer;color:var(--ink);background:var(--paper);border-radius:22px;padding:16px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;box-shadow:0 2px 0 var(--line),0 8px 24px -16px rgba(0,0,0,.35);border-left:8px solid var(--c);min-height:44px}
.tpl .n{width:56px;height:56px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:900 24px 'Zen Maru Gothic'}
.tpl h3{margin:0;font-size:19px}.tpl p{margin:2px 0 0;color:var(--mut);font-size:13px}
.ring{width:52px;height:52px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.mode{border:0;cursor:pointer;background:var(--paper);color:var(--ink);border-radius:18px;padding:14px;text-align:left;box-shadow:0 2px 0 var(--line);min-height:96px}
.mode b{display:block;font:700 16px 'Zen Maru Gothic'}.mode span{font-size:13px;color:var(--mut);line-height:1.45;display:block;margin-top:4px}
.mode .ic{width:34px;height:34px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font:900 16px 'Nunito';margin-bottom:6px}
.sec{font:700 14px 'Zen Maru Gothic';color:var(--mut);margin:22px 0 8px}
.card{background:var(--paper);border-radius:26px;padding:20px 18px;box-shadow:0 3px 0 var(--line),0 18px 40px -24px rgba(0,0,0,.45);border-top:8px solid var(--c);animation:deal .35s ease}
@keyframes deal{from{transform:translateY(18px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.bar i{transition:none}}
.lab{display:inline-block;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:700;font-size:13px;border-radius:99px;padding:3px 12px}
.prog{float:right;color:var(--mut);font:800 13px 'Nunito'}
.jpt{font:500 17px/1.8 'Zen Maru Gothic';margin:12px 0}
.ent{font:600 18px/1.65 'Nunito';margin:10px 0}
.ent b{color:var(--c);font-weight:900}
.ent u{text-decoration-line:underline;text-decoration-color:rgba(242,183,5,.55);text-decoration-thickness:.42em;text-underline-offset:-.18em;text-decoration-skip-ink:none}
.hide{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,var(--paper)) 0 10px,var(--paper) 10px 20px);border:2px dashed color-mix(in srgb,var(--c) 45%,transparent);border-radius:18px;padding:26px 14px;text-align:center;color:var(--mut);font:700 15px 'Zen Maru Gothic'}
.sk{font:700 15px/1.7 'Nunito';color:var(--mut);margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;cursor:pointer;border-radius:16px;padding:12px 16px;font-weight:700;font-size:16px;min-height:48px;flex:1;background:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);border:1px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 #1c7a4f}.btn.mid{background:var(--gold);color:#3b2c00;box-shadow:0 3px 0 #b78800}.btn.ng{background:var(--ng);box-shadow:0 3px 0 #a92f33}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 12px;font:700 15px 'Nunito';cursor:pointer;min-height:44px}
.chip.done{background:color-mix(in srgb,var(--c) 15%,var(--paper));border-color:var(--c);color:var(--c)}
.chip.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.slots{min-height:60px;background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:16px;padding:10px;font:700 15px/1.7 'Nunito'}
.opt{display:block;width:100%;text-align:left;margin-top:8px}
.opt.right{background:var(--ok)!important;color:#fff!important}.opt.wrong{background:var(--ng)!important;color:#fff!important}
.koma{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.koma div{background:color-mix(in srgb,var(--c) 12%,var(--paper));border-radius:16px;padding:10px 6px;text-align:center;font:500 13px/1.45 'Zen Maru Gothic'}
.koma div b{display:block;font:900 20px 'Nunito';color:var(--c)}
.koma div.on{outline:3px solid var(--c);transform:scale(1.04)}
.timer{display:grid;place-items:center;margin:8px auto}
.timer svg{width:190px;height:190px}
.tt{font:900 40px 'Nunito'}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120%);opacity:0;visibility:hidden;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font:800 15px 'Nunito';transition:transform .3s,opacity .3s,visibility .3s;z-index:9}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.back{border:0;background:none;color:var(--mut);font:700 15px 'Zen Maru Gothic';cursor:pointer;padding:10px 0;min-height:44px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.mp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(612px,calc(100% - 20px));background:var(--ink);color:var(--bg);border-radius:20px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:6px;z-index:7;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.mp[hidden]{display:none}
.mp{flex-wrap:wrap;padding:10px 10px 10px}.mpi{flex:1 1 100%;min-width:0;padding:0 4px 4px}.mp button{flex:1}.mpi b{display:block;font:700 13px 'Zen Maru Gothic';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mpi small{font:700 12px 'Nunito';opacity:.7}
.mp #mpLoop{font-size:12px;padding:0 6px;white-space:nowrap}.mp #mpLoop.on{background:var(--gold);color:#3b2c00}
.mp button{border:0;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);border-radius:12px;min-width:44px;height:44px;font:800 15px 'Zen Maru Gothic','Nunito';cursor:pointer;padding:0 10px}
.spk{border:1px solid var(--line);background:var(--paper);color:var(--c);border-radius:99px;font:800 13px 'Zen Maru Gothic','Nunito';padding:6px 12px;min-height:36px;cursor:pointer;margin-left:6px}
.mem{display:inline-block;font:800 11px 'Zen Maru Gothic';border-radius:99px;padding:2px 8px;margin-left:6px;background:var(--line);color:var(--mut)}.mem.on{background:var(--c);color:#fff}
.ent.playing{background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:12px;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 7%,transparent)}
.sn{transition:background .2s;border-radius:4px}.sn.rd{background:rgba(255,214,70,.55);box-shadow:0 0 0 2px rgba(255,214,70,.55)}
.cbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));width:min(612px,calc(100% - 20px));background:#264653;color:#fff;border-radius:16px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:6px;z-index:6;box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
.cbar.over{background:#B4472D}.cbi{flex:1;min-width:0}.cbi b{display:block;font:700 13px 'Zen Maru Gothic';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cbi small{font:700 11.5px 'Nunito','Zen Maru Gothic';opacity:.85}
.cbar button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;min-height:44px;padding:0 12px;font:800 14px 'Zen Maru Gothic';cursor:pointer}
body:has(.cbar) .wrap{padding-top:calc(86px + env(safe-area-inset-top))}
.spk.on{background:var(--c);color:#fff;border-color:var(--c)}
.qtag{font:800 12px 'Nunito';color:var(--mut);letter-spacing:.04em}
.big{font:800 20px/1.45 'Nunito';margin:8px 0 4px}
.stack{display:grid;gap:8px}.stack .btn{flex:none;text-align:left}
.setr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}.setr span{font:700 13px 'Zen Maru Gothic';color:var(--mut);min-width:5.5em}.setr .chip{margin:0;padding:6px 10px;font-size:13px;min-height:38px}
.hrow{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:10px 2px;font:600 14px 'Zen Maru Gothic';cursor:pointer}.hrow small{display:block;color:var(--mut);font:700 12px 'Nunito','Zen Maru Gothic'}
.exh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.examiner{font:700 14px 'Zen Maru Gothic';color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.clock{font:900 46px 'Nunito';text-align:center;margin:10px 0 0;font-variant-numeric:tabular-nums}.clock.over{color:#C98A00}
.cue{border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:8px 0;font:600 16px/1.55 'Nunito'}.cue b{font-size:18px}.cue p{margin:6px 0 0}.cue ul{margin:4px 0;padding-left:22px}
.memo,.wta{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font:500 16px/1.6 'Nunito';padding:10px 12px;resize:vertical}
.memo{min-height:70px;margin-top:8px}.wta{min-height:46vh;margin-top:12px}.memo:focus,.wta:focus{outline:none;border-color:var(--c,#C2577A)}
.peek{margin-top:12px}.peek summary{cursor:pointer;color:var(--mut);font:700 14px 'Zen Maru Gothic';padding:6px 0}
.t1img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0}.t1img{cursor:zoom-in}.zoom{position:fixed;inset:0;z-index:20;background:rgba(20,24,30,.92);overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center}.zoom img{width:max(100vw,900px);height:auto;background:#fff}.zoom button{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;border:0;border-radius:99px;min-width:44px;min-height:44px;font:800 18px 'Nunito';background:#fff;color:#24323d}.wc{display:inline-block;margin-left:6px;font:800 11px 'Nunito','Zen Maru Gothic';color:var(--mut);background:var(--line);border-radius:99px;padding:1px 8px;vertical-align:middle}.glue{background:rgba(120,130,140,.13);color:var(--mut);border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}.mtx{font-size:16px}.mdl{margin-top:12px;background:color-mix(in srgb,var(--gold) 9%,var(--paper));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:16px;padding:12px 14px}.mdl>b{font-size:14px}.mdl .ent{margin:8px 0}.mdl .mem{margin:2px 4px 2px 0}
.warn{font:700 12px 'Zen Maru Gothic';color:#B4472D;background:#fde8e1;border-radius:99px;padding:2px 8px}
.rv{margin-top:12px;animation:none}.aud{width:100%;margin:4px 0}
.wclock{font:900 18px 'Nunito';font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 12px}.wclock.over{color:#fff;background:#B4472D}
.tabs{display:flex;gap:8px;margin:4px 0 10px}.tabs .chip{flex:1;margin:0}.tabs small{display:block;font-size:11px;opacity:.75}
.tp{font:500 14px/1.6 'Nunito';margin:6px 0;color:var(--mut)}.tbox{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:500 15px/1.6 'Nunito'}
.t1g{width:100%;max-width:520px;display:block;margin:10px auto 0;font:600 10px 'Nunito';fill:currentColor}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font:700 12px 'Nunito';margin:4px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.t1t{width:100%;border-collapse:collapse;margin:10px 0;font:600 13px 'Nunito'}.t1t th,.t1t td{border:1px solid var(--line);padding:6px;text-align:center}.t1t th{background:color-mix(in srgb,var(--c) 8%,transparent)}
.proc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}.proc div{flex:1 1 120px;border:2px solid var(--line);border-radius:12px;padding:8px;font:600 13px/1.4 'Nunito';text-align:center}.proc b{display:block;color:var(--c)}.proc span{color:var(--mut);font-weight:900}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.maps>div>b{display:block;text-align:center;font:800 14px 'Nunito'}
.wcount{text-align:right;font:700 14px 'Nunito';color:var(--mut);margin-top:6px}.wcount b{font-size:20px;color:var(--ink)}
.ck{list-style:none;padding:0;margin:10px 0;font:700 14px 'Zen Maru Gothic'}.ck li{padding:3px 0}.ck .ok{color:var(--ok)}.ck .ng{color:#B4472D}
.mine{font:500 15px/1.7 'Nunito';background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0}
.exbig{display:flex;align-items:center;gap:12px;width:100%;border:0;cursor:pointer;text-align:left;color:#fff;background:linear-gradient(135deg,#C2577A,#E07A9B);border-radius:22px;padding:16px 18px;box-shadow:0 3px 0 #8f3a58;min-height:72px}
.exbig b{display:block;font:900 19px 'Zen Maru Gothic'}.exbig span{font:600 13px 'Zen Maru Gothic';opacity:.92}.exbig .ic{font-size:30px}
@media(max-width:420px){.koma div{font-size:11.5px}.modes{grid-template-columns:minmax(0,1fr)}.mode{min-height:auto}}
@media(max-width:400px){.wrap{padding-left:10px;padding-right:10px}.btn{font-size:14px;padding:10px 6px;white-space:nowrap;min-height:46px}.row{gap:6px}
 .koma{grid-template-columns:repeat(2,minmax(0,1fr))}.koma div{font-size:12.5px}.lvl small{display:none}.top{gap:6px}.pill{padding:6px 8px}
 .jpt{font-size:16px}.ent{font-size:17px}.card{padding:16px 13px;border-radius:22px}h1{font-size:26px}
 .cbar{padding:6px 6px 6px 10px}.cbar button{padding:0 8px;font-size:13px}.cbi small{font-size:11px}.mp button{min-width:38px;padding:0 6px}}
@media(min-width:900px){.wrap{max-width:720px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="lvl"><b id="band">Band 5.0</b> <small id="xpt"></small><div class="bar"><i id="xpb" style="width:0"></i></div></div>
<div class="pill"><b id="streak">0</b>連続</div><div class="pill"><b id="due">0</b>復習</div></div>
<main id="app"></main>
</div>
<div class="mp" id="mp" hidden><div class="mpi"><b id="mpT"></b><small id="mpN"></small></div><button id="mpPrev" aria-label="前へ">‹</button><button id="mpPlay">止める</button><button id="mpNext" aria-label="次へ">›</button><button id="mpLoop" aria-label="くり返し">くり返し</button><button id="mpX" aria-label="停止">×</button></div>
<div class="toast" id="toast"></div><div class="conf" id="conf"></div>
<script>
{
const D={"T": [{"k": "1", "name": "すき焼き×母", "q1": "Describe a dish you enjoy cooking.", "q2": "Is globalisation a good thing for local cultures?", "theme2": "文化・伝統", "koma": ["家族が囲むすき焼き鍋", "豆腐がたれをジュワッと吸う", "高校生の自分は座るだけ母が台所に立つ", "一人暮らしの台所で「母はすごかった」"], "a": [{"id": "1a0", "label": "導入（つなぎの型）", "jp": "〇〇について考えると、真っ先に浮かぶのはすき焼きです。母がよく作ってくれました。", "en": "When I think about ___, the first thing that <b>comes to mind<\/b> is sukiyaki. My mother often made it for me.", "sk": "think about ___ → <b>comes to mind<\/b> → sukiyaki → mother made it", "skj": "〇〇といえば → 真っ先に浮かぶ → すき焼き → 母が作ってくれた", "v": 2}, {"id": "1a1", "label": "共通の核", "jp": "すき焼きは日本の伝統的な鍋料理です。家族が集まる特別な日によく食べられます。牛肉、豆腐、ねぎを甘いしょうゆのたれで煮ます。一番好きなのは豆腐で、鍋に長く入れておくほど、味がしみこみます。", "en": "Sukiyaki is a traditional Japanese hot pot dish. It <u>is often eaten<\/u> on special days, when the whole family gets together. We cook beef, tofu and green onions in a sweet soy sauce. My favourite part is the tofu: <u>the longer it stays in the pot, the more flavour it<\/u> <b>soaks up<\/b>.", "sk": "traditional hot pot → <u>is often eaten<\/u> on special days → beef・tofu・green onions → sweet soy sauce → tofu：<u>the longer…, the more…<\/u> <b>soaks up<\/b>", "skj": "伝統の鍋料理 → 特別な日によく食べられる → 牛肉・豆腐・ねぎ → 甘いしょうゆのたれ → 豆腐：長く入れるほど味がしみる", "v": 2}, {"id": "1a2", "label": "追加 A　母の料理（経験）", "jp": "高校生の頃は、母が毎日料理をしてくれました。すき焼きも、母がよく作ってくれた料理の一つです。当時の私は台所を手伝うこともほとんどなく、夕食が出てくるのは当たり前だと思っていました。", "en": "When I was in high school, my mother cooked for me every day, and sukiyaki was one of the dishes she often made. Back then, I hardly ever <b>helped out<\/b> in the kitchen, and I simply took it for granted that dinner would be on the table.", "sk": "high school → mother cooked every day → sukiyaki often → hardly ever <b>helped out<\/b> → took it for granted", "skj": "高校時代 → 母が毎日料理 → すき焼きもよく → 手伝いはほぼゼロ → 当たり前だと思っていた", "short": {"en": "When I was in high school, my mother cooked for me every day, and sukiyaki was one of the dishes she often made.", "jp": "高校時代、母は毎日料理をしてくれました。すき焼きも、母がよく作ってくれた料理の一つです。", "sk": "high school → mother cooked every day → sukiyaki was one of the dishes", "skj": "高校時代 → 母が毎日料理 → すき焼きもその一つ"}, "v": 2}, {"id": "1a3", "label": "追加 B　一人暮らしでの気づき", "jp": "一人暮らしを始めて初めて、一食を作るのにどれだけ時間と手間がかかるかに気づきました。もっと早く知っていれば、もっと何度も感謝を伝えていたはずです。それを毎日続けてくれた母に、今は心から感謝しています。", "en": "<u>It was not until I started living on my own that I realised<\/u> how much time and effort a single meal requires. <u>Had I known this earlier, I would have thanked her<\/u> far more often. Now I am truly grateful to her for <b>keeping it up<\/b> every single day.", "sk": "<u>It was not until<\/u> living on my own → time &amp; effort → <u>Had I known…, I would have thanked<\/u> → <b>keeping it up<\/b>", "skj": "一人暮らしで初めて → 時間と手間に気づく → 早く知っていれば感謝したのに → 毎日続けた母に感謝", "short": {"en": "<u>It was not until<\/u> I lived on my own <u>that<\/u> I realised how hard it is to cook every day. Now I am thankful to her for <b>keeping it up<\/b>.", "jp": "一人暮らしをして初めて、毎日料理をする大変さに気づきました。今は、それを続けてくれた母に感謝しています。", "sk": "<u>It was not until<\/u> I lived alone <u>that<\/u> → realised how hard → thankful → <b>keeping it up<\/b>", "skj": "一人暮らしして初めて → 大変さに気づく → 感謝 → 続けてくれた"}, "v": 2}, {"id": "1a4", "label": "結び", "jp": "だから私にとって、すき焼きはただの料理ではありません。いつも母の思い出をよみがえらせてくれます。", "en": "So for me, sukiyaki is not just food. It always <b>brings back<\/b> memories of my mother.", "sk": "not just food → <b>brings back<\/b> memories", "skj": "ただの料理ではない → 母の思い出がよみがえる", "v": 2}], "b": [{"id": "1c1", "label": "論の核　文化（伝統とグローバル化）", "en": "<u>Thanks to<\/u> globalisation, we can now enjoy food and culture from all over the world. <u>However<\/u>, local traditions and languages are slowly <b>dying out<\/b>. In Japan, <u>for example<\/u>, fewer families <b>get together<\/b> to eat traditional dishes like sukiyaki.", "jp": "グローバル化のおかげで、私たちは世界中の食べ物や文化を楽しめるようになりました。しかしその一方で、地域の伝統や言葉は少しずつ消えつつあります。たとえば日本でも、すき焼きのような伝統料理を家族で囲む機会は減っています。", "sk": "<u>Thanks to<\/u> globalisation → enjoy world food & culture → <u>However<\/u>, traditions <b>dying out<\/b> → fewer families <b>get together<\/b> (sukiyaki)", "skj": "グローバル化のおかげ → 世界の食・文化 → しかし伝統が消える → 家族で伝統料理を囲む機会が減る", "v": 1}, {"id": "1c2", "label": "論の結び　文化", "en": "That is why we should welcome new things <u>while<\/u> <b>passing on<\/b> our traditions to the next generation. <u>It is only by<\/u> valuing our own culture <u>that<\/u> we can truly understand others.", "jp": "だからこそ、新しいものを受け入れながらも、伝統を次の世代に伝えていくべきです。自分たちの文化を大切にしてこそ、ほかの文化も本当に理解できるのです。", "sk": "welcome new things <u>while<\/u> <b>passing on<\/b> traditions → <u>It is only by<\/u> valuing our culture <u>that<\/u> we understand others", "skj": "新しいものを受け入れつつ伝統を伝える → 自分の文化を大切にしてこそ他の文化がわかる", "v": 1}]}, {"k": "2", "name": "みなとみらい", "q1": "Describe a place in your country you would recommend to a visitor.", "q2": "Who should be responsible for solving social problems, individuals or governments?", "theme2": "個人と政府の責任", "koma": ["港に並ぶビルと観覧車", "昼は船が行き交う", "夜は明かりが水面に映る", "海沿いを歩いて心が落ち着く"], "a": [{"id": "2a0", "label": "導入（つなぎの型）", "jp": "〇〇と聞いて、すぐに思い浮かぶのは横浜のみなとみらいです。", "en": "When it comes to ___, the place that <b>springs to mind<\/b> is Minato Mirai in Yokohama.", "sk": "When it comes to ___ → <b>springs to mind<\/b> → Minato Mirai", "skj": "〇〇といえば → すぐ浮かぶ → みなとみらい", "v": 2}, {"id": "2a1", "label": "共通の核", "jp": "みなとみらいは、横浜の海沿いにある新しい街です。古い造船所の跡に造られ、今は高いビルや大きなお店、大きな観覧車があります。でも、私が一番好きなのは建物ではなく、海です。", "en": "Minato Mirai is a new area by the sea in Yokohama. <u>Built on an old shipyard<\/u>, it now has tall buildings, big shops and a huge Ferris wheel. But <u>what I love most is not<\/u> the buildings <u>but<\/u> the sea.", "sk": "new area by the sea → <u>Built on an old shipyard<\/u> → buildings・shops・Ferris wheel → <u>what I love most is not<\/u> the buildings <u>but<\/u> the sea", "skj": "海沿いの新しい街 → 古い造船所の跡 → ビル・お店・観覧車 → 好きなのは建物でなく海", "v": 2}, {"id": "2a2", "label": "追加 A　海の魅力", "jp": "昼間は港を出入りする船を眺められ、暗くなると建物の明かりが水面に映ります。ストレスを感じたときは、海沿いをゆっくり歩くと気持ちが落ち着き、頭がすっきりします。", "en": "During the day, you can watch ships coming in and out of the harbour, and after dark, the lights of the buildings are reflected in the water. Whenever I feel stressed, a slow walk along the waterfront helps me <b>calm down<\/b> and clear my head.", "sk": "day: ships in and out → night: lights reflected on the water → stressed → slow walk → <b>calm down<\/b>", "skj": "昼：船が行き交う → 夜：明かりが水面に → ストレス → ゆっくり歩く → 落ち着く", "short": {"en": "In the daytime, you can watch the ships. At night, the city lights <u>are reflected<\/u> in the water. A slow walk by the sea always helps me <b>calm down<\/b>.", "jp": "昼は船を眺められます。夜は街の明かりが水面に映ります。海沿いをゆっくり歩くと、いつも気持ちが落ち着きます。", "sk": "daytime：ships → night：lights <u>are reflected<\/u> → slow walk → <b>calm down<\/b>", "skj": "昼は船 → 夜は明かりが水面に → ゆっくり歩く → 落ち着く"}, "v": 2}, {"id": "2a3", "label": "追加 B　都市と自然", "jp": "みなとみらいは買い物や観光の場所であるだけでなく、都会の暮らしと自然が一つになる場所でもあります。こうしたバランスは、大きな都市の多くが発展するにつれて失ってきたものです。", "en": "<u>Not only is it<\/u> a place for shopping and sightseeing, <u>but it is also<\/u> a place where city life and nature <b>come together<\/b>. This balance is something that many large cities have lost as they have grown.", "sk": "<u>Not only is it…, but it is also…<\/u> → city life &amp; nature <b>come together<\/b> → many cities have lost this", "skj": "買い物・観光だけでなく → 都会と自然が一つに → 多くの都市が失ったもの", "short": {"en": "<u>Not only is it<\/u> a place for shopping, <u>but it is also<\/u> a place where the city and nature <b>come together<\/b>.", "jp": "買い物の場所であるだけでなく、街と自然が一つになる場所でもあります。", "sk": "<u>Not only is it<\/u> shopping → <u>but it is also<\/u> → city & nature <b>come together<\/b>", "skj": "買い物だけでなく → 街と自然が一つになる"}, "v": 2}, {"id": "2a4", "label": "結び", "jp": "だから、観光客には、夕方の時間をとってそこを歩いてほしいと伝えたいです。", "en": "That is why I would tell visitors to <b>set aside<\/b> an evening for a walk there.", "sk": "tell visitors → <b>set aside<\/b> an evening", "skj": "観光客へ → 夕方の時間をとって歩いてほしい", "v": 2}], "b": [{"id": "2c1", "label": "論の核　責任（個人の限界）", "en": "Of course, what each of us does matters. We can <b>cut down on<\/b> plastic and take the train instead of driving. <u>However<\/u>, people alone cannot solve big problems. <u>No matter how<\/u> careful we are, we cannot change long working hours or a society full of plastic on our own.", "jp": "もちろん、一人ひとりの行動も大切です。プラスチックを減らしたり、車の代わりに電車を使ったりすることはできます。しかし、個人の力だけでは大きな問題は解決できません。どんなに気をつけていても、長時間労働やプラスチックだらけの社会の仕組みは、一人では変えられないのです。", "sk": "what each of us does matters → <b>cut down on<\/b> plastic, take the train → <u>However<\/u>, alone cannot solve → <u>No matter how<\/u> careful → long working hours / plastic society", "skj": "個人の行動も大切 → プラを減らす・電車 → しかし個人では無理 → どんなに気をつけても → 長時間労働・プラだらけの社会", "v": 1}, {"id": "2c2", "label": "論の結び　責任", "en": "That is why <u>it is the government that<\/u> must change the system, with clear rules and money. <u>Only when<\/u> people and the government <b>pull together<\/b> <u>will<\/u> real change happen.", "jp": "だからこそ、ルールとお金で社会の仕組みを変えるのは、政府の役目なのです。個人と政府が力を合わせてはじめて、本当の変化が生まれるのです。", "sk": "<u>it is the government that<\/u> must change the system → rules & money → <u>Only when<\/u> we <b>pull together<\/b> <u>will<\/u> change happen", "skj": "仕組みを変えるのは政府 → ルールとお金 → 個人と政府が力を合わせてはじめて変わる", "v": 1}]}, {"k": "3", "name": "なさくん×アプリ", "q1": "Describe a friend you enjoy spending time with.", "q2": "Why do some children fall behind at school?", "theme2": "教育・格差", "koma": ["前の職場でなさくんと出会う", "二人でアプリ作り", "生徒がAI老婆と議論→ 全国で受賞", "海沿いを散歩して夢を語る"], "a": [{"id": "3a0", "label": "導入（つなぎの型）", "jp": "〇〇について考えると、友達のなさくんと、一緒に作っているアプリのことが浮かびます。", "en": "When I think about ___, I think of my friend Nasa and the apps we make together.", "sk": "think about ___ → Nasa & our apps", "skj": "〇〇といえば → なさくんと作るアプリ", "v": 2}, {"id": "3a1", "label": "共通の核", "jp": "なさくんは前の職場の友達です。彼は英語、私は国語を教えています。二人に共通しているのは、いつか大学で教えるという夢です。よく一緒に勉強したりアプリを作ったりして、疲れたら海沿いを歩いて将来の話をします。", "en": "Nasa is a friend from my old job. He teaches English, and I teach Japanese. <u>What we have in common is<\/u> a dream: to teach at a university one day. We often study and make apps together, and when we get tired, we walk by the sea and talk about the future.", "sk": "friend from old job → English / Japanese → <u>What we have in common is<\/u> a dream：university → study・apps → walk by the sea", "skj": "前の職場の友達 → 英語／国語 → 共通点は大学で教える夢 → 勉強・アプリ → 海沿いを散歩", "v": 2}, {"id": "3a2", "label": "追加 A　アプリの話", "jp": "特に誇りに思っているのは、『羅生門』の授業用に作ったアプリです。生徒が、AIが演じる老婆と議論できます。なさくんが最初に試してくれ、率直な意見が改良に役立ちました。最終的に、この授業は全国の教育コンテストで賞をもらいました。", "en": "One project I am particularly proud of is an app I made for teaching a short story called Rashomon. It allows students to debate with an old woman <u>played by AI<\/u>. Nasa was the first person to <b>try it out<\/b>, and his honest feedback helped me improve it. In the end, the lesson won a national award for using technology in education.", "sk": "proud: Rashomon app → debate with an old woman <u>played by AI<\/u> → Nasa <b>tried it out<\/b> → honest feedback → national award", "skj": "誇り：羅生門アプリ → AIが演じる老婆と議論 → なさくんが最初に試す → 率直な意見 → 全国で受賞", "short": {"en": "I am most proud of an app for teaching Rashomon. In it, students debate with an old woman <u>played by AI<\/u>. Nasa <b>tried it out<\/b> first, and the lesson won a national award.", "jp": "一番誇りに思っているのは『羅生門』の授業用アプリです。生徒はアプリの中で、AIが演じる老婆と議論します。なさくんが最初に試してくれて、この授業は全国で賞をもらいました。", "sk": "proud：Rashomon app → old woman <u>played by AI<\/u> → Nasa <b>tried it out<\/b> → national award", "skj": "誇り：羅生門アプリ → AIが演じる老婆と議論 → なさくんが試す → 全国で受賞"}, "v": 2}, {"id": "3a3", "label": "追加 B　尊敬するところ", "jp": "彼について一番尊敬しているのは、研究に一生懸命取り組む姿勢です。くじけそうになったときも、彼が頑張っている姿を見ると、自分ももう少し続けようと思えます。", "en": "<u>What I admire most about him is<\/u> how hard he works on his research. Whenever I feel like <b>giving up<\/b>, <u>seeing him work so hard<\/u> makes me want to <b>keep going<\/b>.", "sk": "<u>What I admire most about him is<\/u> hard work → feel like <b>giving up<\/b> → <u>seeing him work so hard<\/u> → <b>keep going<\/b>", "skj": "一番尊敬：研究への努力 → くじけそう → 頑張る姿を見る → 続けようと思える", "short": {"en": "<u>What I admire most about him is<\/u> how hard he works. Whenever I feel like <b>giving up<\/b>, he makes me want to <b>keep going<\/b>.", "jp": "彼について一番尊敬しているのは、努力する姿です。くじけそうなときも、彼のおかげで続けようと思えます。", "sk": "<u>What I admire most about him is<\/u> hard work → <b>giving up<\/b> → <b>keep going<\/b>", "skj": "一番尊敬：努力 → くじけそう → 続けようと思える"}, "v": 2}, {"id": "3a4", "label": "結び", "jp": "彼がいなければ、勉強は仕事のように感じるでしょう。彼と一緒だと、楽しく感じます。", "en": "<u>Without him<\/u>, studying <u>would feel<\/u> like work. With him, it feels like fun.", "sk": "<u>Without him<\/u> → <u>would feel<\/u> like work → with him, fun", "skj": "彼がいなければ仕事のよう → 一緒なら楽しい", "v": 2}], "b": [{"id": "3c1", "label": "論の核　教育（学ぶ機会の差）", "en": "Many social problems today come from a gap in chances to learn. Many children from poor families <u>can afford neither<\/u> a tablet <u>nor<\/u> the internet. <u>The more<\/u> learning moves online, <u>the further<\/u> they <b>fall behind<\/b>. In this way, poverty is <b>passed on<\/b> to the next generation.", "jp": "いま多くの社会問題の根っこには、学ぶ機会の差があります。貧しい家庭の子どもの多くは、タブレットもインターネットも買えません。学びがオンラインに移るほど、彼らは取り残されていきます。こうして、貧困は次の世代へ引き継がれてしまうのです。", "sk": "problems come from a gap in chances to learn → <u>neither<\/u> a tablet <u>nor<\/u> the internet → <u>the more<\/u> online, <u>the further<\/u> they <b>fall behind<\/b> → poverty <b>passed on<\/b>", "skj": "問題の根っこは学ぶ機会の差 → タブレットもネットもない → オンライン化するほど取り残される → 貧困が次世代へ", "v": 1}, {"id": "3c2", "label": "論の結び　教育", "en": "That is why the government should give every child the same chance to learn. <u>Only through<\/u> education <u>can we<\/u> <b>break<\/b> the cycle of poverty.", "jp": "だからこそ、政府はすべての子どもに同じ学びの機会を用意するべきです。教育によってはじめて、貧困の連鎖を断ち切ることができるのです。", "sk": "give every child the same chance to learn → <u>Only through<\/u> education <u>can we<\/u> break the cycle", "skj": "すべての子に同じ学びの機会 → 教育によってはじめて貧困の連鎖を断ち切れる", "v": 1}]}], "Q": [{"g": "Part 2", "q": "Describe a person who taught you something important.", "tag": "①A・B", "t": 1, "en": "The person who taught me the most is actually my mother, although I only realised it after I started living on my own.", "jp": "一番多くを教えてくれたのは母。気づいたのは一人暮らしを始めてから。"}, {"g": "Part 2", "q": "Describe a family member you admire.", "tag": "①A・B", "t": 1, "en": "The family member I admire most is my mother, who cooked for me every single day when I was in high school.", "jp": "一番尊敬する家族は、高校時代に毎日料理してくれた母。"}, {"g": "Part 2", "q": "Describe a traditional festival or celebration.", "tag": "①核", "t": 1, "en": "In Japan, special occasions are often linked to food, and for my family, that food is sukiyaki.", "jp": "日本では行事と食べ物が結びついていて、うちではそれがすき焼き。"}, {"g": "Part 2", "q": "Describe a place where you like to relax.", "tag": "②A", "t": 2, "en": "Whenever I need to relax, I go for a walk along the sea at Minato Mirai in Yokohama.", "jp": "くつろぎたいときは、みなとみらいの海沿いを歩く。"}, {"g": "Part 2", "q": "Describe a building or area you like in your city.", "tag": "②核", "t": 2, "en": "My favourite area is Minato Mirai, a district that was built where shipyards once stood.", "jp": "好きな地区は、造船所の跡地にできたみなとみらい。"}, {"g": "Part 2", "q": "Describe a time you waited for something.", "tag": "②A", "t": 2, "en": "I once waited almost an hour at Minato Mirai just to see the lights come on over the water.", "jp": "水面に明かりがともるのを見るために、みなとみらいで1時間近く待った。"}, {"g": "Part 2", "q": "Describe a friend / a person who is good at their job.", "tag": "③核・B", "t": 3, "en": "A person who is really good at his job is my friend Nasa, an English teacher I met at my previous job.", "jp": "仕事が本当にできる人は、前の職場で出会った英語教師のなさくん。"}, {"g": "Part 2", "q": "Describe a piece of technology / an app you use.", "tag": "③A", "t": 3, "en": "The app I use most is actually one I made myself, with a lot of help from my friend Nasa.", "jp": "一番使うアプリは、なさくんに手伝ってもらって自分で作ったもの。"}, {"g": "Part 2", "q": "Describe something you are proud of / an achievement.", "tag": "③A", "t": 3, "en": "One thing I am proud of is an app I made for my lessons, which ended up winning a national award.", "jp": "誇りに思うのは、授業用に作り、全国で賞をとったアプリ。"}, {"g": "Part 2", "q": "Describe a time you helped someone.", "tag": "③A", "t": 3, "en": "One time I helped others was when I built an app so that my quieter students could share their ideas.", "jp": "人を助けたのは、発言の少ない生徒が考えを出せるアプリを作ったとき。"}, {"g": "Part 2", "q": "Describe a skill you learned / something new you tried.", "tag": "③A", "t": 3, "en": "A skill I picked up recently is making web apps, which I started doing with my friend Nasa.", "jp": "最近身につけた技能はWebアプリ作り。なさくんと一緒に始めた。"}, {"g": "Part 2", "q": "Describe a book or story you enjoyed.", "tag": "③A", "t": 3, "en": "A story that means a lot to me is Rashomon, which I even turned into an app for my students.", "jp": "思い入れのある物語は『羅生門』。生徒用にアプリにまでした。"}, {"g": "Part 2", "q": "Describe a time you were very busy.", "tag": "③核・A", "t": 3, "en": "The busiest time I remember was when Nasa and I were preparing our app for a national contest.", "jp": "一番忙しかったのは、なさくんとコンテスト用のアプリを準備していたとき。"}, {"g": "Part 2", "q": "Describe an important change in your life.", "tag": "①B", "t": 1, "en": "The biggest change in my life was starting to live on my own, because it changed how I see my mother.", "jp": "人生最大の変化は一人暮らし。母の見方が変わったから。"}, {"g": "Part 3", "q": "Why do fewer families eat together nowadays?", "tag": "文化（核）", "t": 1, "en": "Mainly because people are too busy, and fewer families get together for traditional meals.", "jp": "主に忙しさのせい。伝統料理を家族で囲む機会も減っている。"}, {"g": "Part 3", "q": "How can people reduce stress?", "tag": "②A（本体）＋ 責任論", "t": 2, "en": "For me, a slow walk by the sea helps a lot. But companies also need to cut down on long working hours.", "jp": "自分は海辺の散歩が効く。でも会社も長時間労働を減らすべき。"}, {"g": "Part 3", "q": "Should governments encourage healthy lifestyles?", "tag": "責任論 ＋ 貧困", "t": 2, "en": "Yes. People alone cannot change long working hours, so it is the government that must act.", "jp": "はい。長時間労働は個人では変えられないので、動くべきは政府。"}, {"g": "Part 3", "q": "What are the pros and cons of living in a big city?", "tag": "②B（本体）＋ 責任論", "t": 2, "en": "Cities are convenient, but they need clear rules to protect nature, like Minato Mirai.", "jp": "便利だが、自然を守るルールが必要。みなとみらいのように。"}, {"g": "Part 3", "q": "Who should protect the environment, individuals or governments?", "tag": "責任論（核・結び）", "t": 2, "en": "Both. We can cut down on plastic, but only the government can change the system.", "jp": "両方。個人はプラを減らせるが、仕組みを変えられるのは政府だけ。"}, {"g": "Part 3", "q": "Is tourism good or bad for the environment?", "tag": "文化 ＋ 責任論", "t": 1, "en": "It can be both. Tourism helps us understand other cultures, but it needs clear rules.", "jp": "両面ある。異文化理解に役立つが、ルールが必要。"}, {"g": "Part 3", "q": "How has technology changed education?", "tag": "③A（本体）＋ 教育", "t": 3, "en": "It has changed it a lot, but not every child can use it.", "jp": "大きく変えた。でも全員が使えるわけではない。"}, {"g": "Part 3", "q": "Will AI replace teachers?", "tag": "③A（本体）＋ 教育", "t": 3, "en": "I doubt it. Someone still has to teach children to think things through.", "jp": "ないと思う。考え抜く力を教える人は必要。"}, {"g": "Part 3", "q": "Why do some children fall behind at school?", "tag": "貧困 → 教育", "t": 3, "en": "Often because of poverty. They can afford neither a tablet nor the internet.", "jp": "多くは貧困が原因。タブレットもネットも買えない。"}, {"g": "Part 3", "q": "Why do people commit crimes?", "tag": "貧困 → 教育", "t": 3, "en": "I think poverty and a lack of education are the main causes.", "jp": "貧困と教育不足が主な原因だと思う。"}, {"g": "Part 3", "q": "Is money the key to success?", "tag": "貧困 ＋ ③B（本体）", "t": 3, "en": "Not entirely, but poverty makes it much harder to succeed, however hard you work.", "jp": "全てではないが、貧困だとどれだけ努力しても成功しにくい。"}, {"g": "Part 3", "q": "What makes a good friend?", "tag": "③B（本体）", "t": 3, "en": "Someone who keeps you going. Whenever I feel like giving up, my friend helps me.", "jp": "続ける力をくれる人。くじけそうなとき、友達が支え。"}, {"g": "Part 3", "q": "Is social media good for mental health?", "tag": "責任論", "t": 2, "en": "It can be both, so I think clear rules and education are needed.", "jp": "両面ある。だからルールと教育が必要。"}, {"g": "Part 3", "q": "Should rich countries help poorer countries?", "tag": "貧困 → 教育", "t": 3, "en": "Yes, especially through education, because it breaks the cycle of poverty.", "jp": "はい。特に教育で。貧困の連鎖を断ち切れるから。"}, {"g": "Task 2", "q": "Some people think governments should spend money on preventing illness rather than treating it. Agree?", "tag": "責任論 ＋ 例：給食", "t": 2, "en": "", "jp": "本論1：個人だけでは健康を守れない（核）／本論2：政府が予防の仕組みを作る（結び＋フィンランドの給食）"}, {"g": "Task 2", "q": "Cities are growing rapidly. Do the advantages outweigh the disadvantages?", "tag": "②B（本体）＋ 責任論", "t": 2, "en": "", "jp": "本論1：便利さ・機会（②B）／本論2：環境の問題は政府のルールで解決（責任論）"}, {"g": "Task 2", "q": "Some say individuals can do nothing to improve the environment. Agree?", "tag": "責任論（核・結び）＋ 例", "t": 2, "en": "", "jp": "本論1：個人にできること（核＋ペットボトルの例）／本論2：それでも政府が必要（結び＋EUの例）"}, {"g": "Task 2", "q": "Online learning will one day replace traditional schools. Agree?", "tag": "教育（核・結び）＋ 例", "t": 3, "en": "", "jp": "反対。本論1：オンラインの利点／本論2：取り残される子ども（核＋コロナ禍の例）"}, {"g": "Task 2", "q": "Youth crime is increasing. What are the causes and solutions?", "tag": "貧困 → 教育 ＋ 例", "t": 3, "en": "", "jp": "原因：学ぶ機会の差と貧困（核）／解決策：すべての子に学びの機会（結び＋GIGAスクールの例）"}, {"g": "Task 2", "q": "Rich countries should help poorer countries. Discuss both views.", "tag": "貧困 → 教育", "t": 3, "en": "", "jp": "本論1：自国優先の意見／本論2：教育で貧困の連鎖を断つ（教育）"}, {"g": "Task 2", "q": "Families today spend less time together. Why? Is this negative?", "tag": "文化（核・結び）＋ 例：孤食", "t": 1, "en": "", "jp": "理由：忙しさ（孤食の例）／評価：伝統や家族の時間が失われるので否定的（文化）"}], "X": [{"k": "pv", "name": "論④ 貧困", "sub": "なんでも貧困へ（核・追加A・追加B・結び）", "col": "#C8693A", "blocks": [{"id": "pv1", "label": "論④の核　いちばん苦しむのは貧しい人", "en": "<u>Whatever the problem is<\/u>, <u>it is always<\/u> the poorest people <u>who<\/u> suffer the most. They <u>cannot afford<\/u> healthy food, good schools or safe homes, so they <b>fall behind<\/b> even further. <u>In this way<\/u>, poverty makes every social problem worse.", "jp": "どんな問題であれ、いちばん苦しむのは、いつも最も貧しい人々です。彼らは健康的な食べ物も、よい学校も、安全な家も手に入れられず、さらに取り残されていきます。こうして、貧困はあらゆる社会問題を悪化させるのです。", "sk": "<u>Whatever the problem is<\/u> → <u>it is always<\/u> the poorest <u>who<\/u> suffer → <u>cannot afford<\/u> food / schools / homes → <b>fall behind<\/b> → poverty makes every problem worse", "skj": "どんな問題でも → いちばん苦しむのは貧しい人 → 食べ物・学校・家が手に入らない → さらに取り残される → 貧困があらゆる問題を悪化させる"}, {"id": "pv2", "label": "追加A　日本の例", "en": "This is not only a problem in poor countries. In Japan, <u>about one in nine<\/u> children lives in poverty. <u>For some of them<\/u>, school lunch is the only healthy meal of the day, and many <b>give up on<\/b> going to university because of money.", "jp": "これは貧しい国だけの問題ではありません。日本でも、子どものおよそ9人に1人が貧困の中で暮らしています。その中には、給食が1日で唯一の健康的な食事だという子もいて、お金がないために大学進学をあきらめる子も多いのです。", "sk": "not only poor countries → Japan: <u>about one in nine<\/u> children → school lunch = only healthy meal → <b>give up on<\/b> university", "skj": "貧しい国だけではない → 日本でも子どもの約9人に1人 → 給食が唯一の健康的な食事 → お金のせいで大学をあきらめる"}, {"id": "pv3", "label": "追加B　社会全体が損をする", "en": "<u>What is more<\/u>, poverty is not only a problem for poor people. When many people cannot stay healthy or find good jobs, the whole society <b>pays the price<\/b>, through higher medical costs and a weaker economy.", "jp": "さらに、貧困は貧しい人だけの問題ではありません。多くの人が健康でいられず、よい仕事にもつけなければ、医療費の増加や経済の弱体化という形で、社会全体がそのつけを払うことになるのです。", "sk": "<u>What is more<\/u> → not only for poor people → can't stay healthy / find jobs → whole society <b>pays the price<\/b> → medical costs & weaker economy", "skj": "さらに → 貧しい人だけの問題ではない → 健康も仕事も失う → 社会全体がつけを払う → 医療費・経済"}, {"id": "pv4", "label": "論④の結び", "en": "That is why we must never <b>leave<\/b> poor people <b>behind<\/b>. <u>Unless<\/u> we tackle poverty first, no problem can be truly solved.", "jp": "だからこそ、貧しい人々を決して置き去りにしてはなりません。まず貧困に取り組まない限り、どんな問題も本当には解決できないのです。", "sk": "never <b>leave<\/b> poor people <b>behind<\/b> → <u>Unless<\/u> we tackle poverty first → no problem solved", "skj": "貧しい人を置き去りにしない → まず貧困に取り組まない限り → どんな問題も解決しない"}]}, {"k": "ct", "name": "費用の型（Part 3）", "sub": "1文目で答える → 費用 → 例 → 影響 → どうすべきか", "col": "#B8860B", "blocks": [{"id": "ct0", "label": "費用の型（全体）", "en": "<u>I think<\/u> ___. <u>One reason is the cost.<\/u> ___ <u>simply can't afford to<\/u> ___. <u>For example,<\/u> ___. <u>In the long run, that can<\/u> ___. <u>That's why I think<\/u> ___.", "jp": "［答え］だと思います。理由の一つは費用です。［一部の家庭］は、どうしても［〜すること］ができないのです。たとえば、［具体例］。長い目で見ると、それは［影響］につながりかねません。だから私は、［どうすべきか］と思います。", "sk": "<u>I think<\/u> ___ → <u>One reason is the cost.<\/u> → ___ <u>simply can't afford to<\/u> ___ → <u>For example,<\/u> ___ → <u>In the long run, that can<\/u> ___ → <u>That's why I think<\/u> ___", "skj": "答え → 理由は費用 → 〜できない → たとえば → 長い目で見ると → だから"}, {"id": "ct1", "label": "例：教育（なぜ）", "en": "Why do some children fall behind at school? — <u>I think<\/u> it often comes down to money at home. <u>One reason is the cost.<\/u> Some families <u>simply can't afford to<\/u> buy a computer or pay for extra lessons. <u>For example,<\/u> a student without a laptop may not be able to finish online homework. <u>In the long run, that can<\/u> limit their job opportunities. <u>That's why I think<\/u> schools should lend laptops to students who need them.", "jp": "なぜ授業についていけなくなる子がいる？ — 家庭のお金の事情によることが多いと思います。理由の一つは費用です。一部の家庭は、どうしてもパソコンを買ったり、塾代を払ったりできないのです。たとえば、ノートパソコンがない生徒は、オンラインの宿題を終えられないかもしれません。長い目で見ると、それは仕事の選択肢を狭めかねません。だから私は、学校が必要な生徒にノートパソコンを貸し出すべきだと思います。"}, {"id": "ct2", "label": "例：交通（影響）", "en": "How does the cost of public transport affect people's lives? — <u>I think<\/u> it can make daily life much harder for some people. <u>One reason is the cost.<\/u> Some families <u>simply can't afford to<\/u> pay for a train pass for every child. <u>For example,<\/u> a student might choose a nearby school, even if a better one is further away. <u>In the long run, that can<\/u> narrow their choices in life. <u>That's why I think<\/u> students should get cheaper fares.", "jp": "公共交通の費用は生活にどう影響する？ — 一部の人にとっては、毎日の生活がずっと大変になりうると思います。理由の一つは費用です。一部の家庭は、どうしても子ども全員分の定期券を払えないのです。たとえば、もっと良い学校が遠くにあっても、近くの学校を選ぶ生徒がいるかもしれません。長い目で見ると、それは人生の選択肢を狭めかねません。だから私は、学生の運賃をもっと安くするべきだと思います。"}, {"id": "ct3", "label": "例：文化（どうすべきか）", "en": "What should be done to keep traditional arts alive? — <u>I think<\/u> we should make them easier for young people to try. <u>One reason is the cost.<\/u> Some families <u>simply can't afford to<\/u> pay for lessons in traditional arts like calligraphy or the koto. <u>For example,<\/u> a child who is interested in the koto may give up because the lessons and the instrument are too expensive. <u>In the long run, that can<\/u> mean fewer young people keep these traditions going. <u>That's why I think<\/u> local governments should offer free classes for children.", "jp": "伝統芸能を守るには何をすべき？ — 若い人がもっと気軽に体験できるようにするべきだと思います。理由の一つは費用です。一部の家庭は、どうしても書道や琴の習い事の費用を払えないのです。たとえば、琴に興味がある子でも、月謝や楽器が高すぎてあきらめてしまうかもしれません。長い目で見ると、それは伝統を受け継ぐ若い人が減ることにつながりかねません。だから私は、自治体が子ども向けの無料教室を開くべきだと思います。"}, {"id": "ct4", "label": "例：個人の好み（自分の経験）", "en": "Do you prefer eating at home or eating out? — <u>I think<\/u> I prefer eating at home. <u>One reason is the cost.<\/u> I <u>simply can't afford to<\/u> eat out every day. <u>For example,<\/u> when I started living on my own, I learned to cook simple dishes like sukiyaki, just like my mother used to make. <u>In the long run, that can<\/u> help me save money and eat more healthily. <u>That's why I think<\/u> cooking at home is the better choice for me.", "jp": "家で食べるのと外食、どちらが好き？ — 家で食べる方が好きだと思います。理由の一つは費用です。私は、どうしても毎日外食はできません。たとえば、一人暮らしを始めたとき、母がよく作ってくれたように、すき焼きのような簡単な料理を自分で作れるようになりました。長い目で見ると、それはお金の節約になり、健康的に食べることにもつながります。だから私は、自分には家で料理する方が合っていると思います。"}, {"id": "ct5", "label": "例：博物館は無料にすべき？", "en": "Should museums be free? — <u>I think<\/u> museums should be free, at least for children. <u>One reason is the cost.<\/u> Some families <u>simply can't afford to<\/u> pay for several tickets. <u>For example,<\/u> a family with three children might skip a museum visit because the tickets cost too much altogether. <u>That's why I think<\/u> children should be able to get in for free.", "jp": "博物館は無料にすべき？ — 少なくとも子どもは無料にするべきだと思います。理由の一つは費用です。一部の家庭は、どうしても何枚ものチケット代を払えないのです。たとえば、子どもが3人いる家庭は、チケット代が全部で高くなりすぎるので、博物館に行くのをやめてしまうかもしれません。だから私は、子どもは無料で入れるようにするべきだと思います。"}]}, {"k": "t2", "name": "Task 2 序論と結論の型", "sub": "設問の形5つ", "col": "#8E5BC9", "blocks": [{"id": "t20", "label": "賛成・反対（Do you agree or disagree?）", "jp": "序論：［主張］とよく言われる。［理由1］だけでなく［理由2］から、私は強く賛成する。<br>結論：［理由1］と［理由2］から、私は［主張］だと確信している。", "en": "It is often argued that [paraphrase]. I strongly agree, <u>not only because<\/u> [reason 1] <u>but also because<\/u> [reason 2].<br/>In conclusion, I firmly believe that [view], since [reason 1] and [reason 2]."}, {"id": "t21", "label": "両論＋意見（Discuss both views）", "jp": "序論：［A］と考える人も［B］と主張する人もいる。両論を論じ、私が後者を支持する理由を述べる。<br>結論：［A］にも一理あるが、私は［B］だと確信している。", "en": "While some people believe that [A], others argue that [B]. This essay will discuss both views before explaining why I side with the latter.<br/>In conclusion, <u>although [A] has some merit<\/u>, I am convinced that [B]."}, {"id": "t22", "label": "利点と欠点（Advantages / disadvantages）", "jp": "序論：［X］は近年広がっている。利点と欠点を検討し、利点が上回ると論じる。<br>結論：［欠点］はあるが、［X］の利点の方がはるかに大きい。", "en": "[X] has become increasingly common in recent years. This essay will examine both its advantages and disadvantages, and argue that the benefits far outweigh the drawbacks.<br/>In conclusion, <u>despite<\/u> [drawback], the advantages of [X] are far greater."}, {"id": "t23", "label": "原因・問題と解決策（Causes / problems and solutions）", "jp": "序論：［問題］は多くの国で深刻だ。まず主な原因を探り、次に解決策を提案する。<br>結論：［問題］は主に［原因］から生じ、［解決策］によってのみ効果的に解決できる。", "en": "[Problem] is now a serious issue in many countries. This essay will <b>look into<\/b> its main causes and then <b>put forward<\/b> some solutions.<br/>In conclusion, [problem] mainly <b>stems from<\/b> [cause], and <u>only through<\/u> [solution] <u>can it be<\/u> tackled."}, {"id": "t24", "label": "2つの質問（Two-part question）", "jp": "序論：［言い換え］。その理由を説明し、［良い／悪い］変化だと論じる。<br>結論：［答え1］。全体として、［答え2］ので［良い／悪い］傾向だと考える。", "en": "[Paraphrase]. This essay will explain why this is happening and argue that it is a [positive / negative] development.<br/>In conclusion, [answer 1]. <u>On the whole<\/u>, this is a [positive / negative] trend, as [answer 2]."}]}, {"k": "ex", "name": "Task 2 具体例", "sub": "論に足す6文", "col": "#8E5BC9", "blocks": [{"id": "ex0", "label": "文化に足す（孤食）", "jp": "例えば日本では、両親が遅くまで働くために一人で食事をとる子どもが増えており、この傾向は「孤食」と呼ばれています。", "en": "In Japan, for example, a growing number of children eat alone because both parents work late, a trend <u>often referred to as<\/u> <i>koshoku<\/i>."}, {"id": "ex1", "label": "責任論に足す（政府：給食）", "jp": "例えばフィンランドでは、1940年代から、すべての児童・生徒に学校給食が無料で提供されています。", "en": "In Finland, for instance, free school meals <u>have been provided<\/u> to all pupils since the 1940s."}, {"id": "ex2", "label": "責任論に足す（個人：ペットボトル）", "jp": "例えば、日本人一人ひとりがペットボトルを週に1本減らせば、毎年何十億本ものボトルが海に流れ込むのを防げるでしょう。", "en": "<u>If everyone in Japan used<\/u> one fewer plastic bottle a week, for example, billions of bottles <u>could be kept<\/u> out of the sea every year."}, {"id": "ex3", "label": "責任論に足す（政府：EUの規制）", "jp": "例えばEUでは、2021年からストローやカトラリーなど、いくつかの使い捨てプラスチック製品が禁止されています。", "en": "The European Union, for instance, <u>has banned<\/u> several single-use plastic items, such as straws and cutlery, since 2021."}, {"id": "ex4", "label": "教育に足す（コロナ禍）", "jp": "例えばコロナ禍では、ユニセフによると、世界で少なくとも4億6300万人の子どもが遠隔授業を受けられませんでした。", "en": "During the COVID-19 pandemic, for example, at least 463 million children worldwide <u>were unable to<\/u> access remote learning, according to UNICEF."}, {"id": "ex5", "label": "教育に足す（GIGAスクール）", "jp": "例えば日本では、GIGAスクール構想により、2021年ごろまでに小中学生に一人一台の端末が配られました。", "en": "<u>By around 2021<\/u>, the GIGA School programme <u>had provided<\/u> every primary and junior high school student in Japan with a tablet or computer."}]}, {"k": "ur", "name": "万能の理由", "sub": "切り口4つ×メリット・デメリット＋段落の型", "col": "#8E6CCB", "blocks": [{"id": "ur1", "label": "コスト｜メリット", "en": "It <b>saves<\/b> money for both people and the government.", "jp": "個人にとっても政府にとっても、お金の節約になる。"}, {"id": "ur2", "label": "コスト｜デメリット", "en": "It <b>costs<\/b> a lot of money <u>that could be spent on<\/u> more important things.", "jp": "もっと大切なことに使えるはずのお金が、たくさんかかる。"}, {"id": "ur3", "label": "時間・便利さ｜メリット", "en": "It <b>saves<\/b> people a lot of time and effort.", "jp": "時間と手間を大きく減らせる。"}, {"id": "ur4", "label": "時間・便利さ｜デメリット", "en": "It <b>takes<\/b> too much time and effort.", "jp": "時間と手間がかかりすぎる。"}, {"id": "ur5", "label": "安全・リスク｜メリット", "en": "It <b>makes<\/b> people's lives <b>safer<\/b>.", "jp": "人々の生活をより安全にする。"}, {"id": "ur6", "label": "安全・リスク｜デメリット", "en": "It <b>puts<\/b> people's health and safety <b>at risk<\/b>.", "jp": "人々の健康と安全を危険にさらす。"}, {"id": "ur7", "label": "成長｜メリット", "en": "It <b>helps<\/b> people <b>learn<\/b> new skills and grow.", "jp": "新しい力を身につけ、成長する助けになる。"}, {"id": "ur8", "label": "成長｜デメリット", "en": "It <b>stops<\/b> people <b>from<\/b> learning important skills.", "jp": "大切な力を身につける妨げになる。"}, {"id": "ur9", "label": "段落の型", "en": "<u>One major reason is that<\/u> ___. <u>For example<\/u>, ___. <u>As a result<\/u>, ___. <u>Another reason is that<\/u> ___.", "jp": "大きな理由の一つは〜。たとえば〜。その結果〜。もう一つの理由は〜。"}]}, {"k": "p1", "name": "Part 1 短い答え", "sub": "頻出10テーマ", "col": "#D98E04", "blocks": [{"id": "p100", "label": "仕事・勉強［③］", "jp": "東京の女子中高で国語を教えています。一番好きなのは、生徒が「分かりやすい」と言ってくれた時です。授業用のアプリも作っています。", "en": "I teach Japanese at a girls' junior and senior high school in Tokyo. <u>What I love most is<\/u> when my students tell me my lessons are easy to understand. I also make apps for my classes.", "v": 3}, {"id": "p101", "label": "住んでいる場所［②］", "jp": "横浜に住んでいます。都会で、少し歩けば海があるところが気に入っています。一番好きな場所は、海沿いの新しい街、みなとみらいです。", "en": "I live in Yokohama. It's a big city, and I love that the sea is never far away. My favourite place is Minato Mirai, a new area by the sea.", "v": 3}, {"id": "p102", "label": "家族［①］", "jp": "高校時代、母は毎日料理をしてくれました。一人暮らしをして初めて、その大変さに気づきました。今は母に感謝しています。", "en": "When I was in high school, my mother cooked for me every day. <u>It was not until<\/u> I lived on my own <u>that<\/u> I realised how hard it is. Now I am thankful to her.", "v": 3}, {"id": "p103", "label": "趣味・休日［③／②］", "jp": "休日は、友達のなさくんとよく勉強したりアプリを作ったりします。疲れたら海沿いを歩いて、将来の話をします。", "en": "On my days off, I often study and make apps with my friend Nasa. When we get tired, we walk by the sea and talk about the future.", "v": 3}, {"id": "p104", "label": "スマホ・アプリ・AI［③］", "jp": "スマホは主に勉強と仕事に使っています。AIも使います。生徒がAIの演じる老婆と議論するアプリも作りました。", "en": "I mainly use my phone for study and work. I also use AI. I made an app where students debate with an old woman <u>played by AI<\/u>.", "v": 3}, {"id": "p110", "label": "旅行［②］", "jp": "遠くへ旅行することはあまりありません。みなとみらいのような好きな場所に、何度も行くのが好きです。夜は街の明かりが水面に映ります。", "en": "I don't travel far very often. I like going back to my favourite places, like Minato Mirai. At night, the city lights <u>are reflected<\/u> in the water.", "v": 3}, {"id": "p111", "label": "健康・運動・ストレス［②／①］", "jp": "激しい運動はしませんが、よく歩きます。海沿いをゆっくり歩くと、いつも気持ちが落ち着きます。自分で料理するようにもしています。", "en": "I don't do hard exercise, but I walk a lot. A slow walk by the sea always helps me <b>calm down<\/b>. I also try to cook for myself.", "v": 3}, {"id": "p112", "label": "食べ物・料理［①］", "jp": "好きな料理はすき焼きです。日本の伝統的な鍋料理で、家族が集まるときによく食べられます。いつも母の思い出をよみがえらせてくれます。", "en": "My favourite dish is sukiyaki. It is a traditional Japanese hot pot dish, and it <u>is often eaten<\/u> when the whole family gets together. It always <b>brings back<\/b> memories of my mother.", "v": 3}, {"id": "p113", "label": "読書・映画・芸術［③］", "jp": "仕事柄、物語をたくさん読みます。好きな作品の一つは『羅生門』です。授業用のアプリまで作りました。", "en": "Because of my job, I read a lot of stories. One of my favourites is Rashomon. I even made an app for teaching it.", "v": 3}, {"id": "p114", "label": "ニュース・社会問題［③の続き］", "jp": "ニュースはたいていスマホで読みます。一番気になる問題は貧困です。貧しい子どもの多くは、教科書もインターネットも買えません。", "en": "I usually read the news on my phone. The issue I care about most is poverty. Many poor children <u>can afford neither<\/u> textbooks <u>nor<\/u> the internet.", "v": 3}]}, {"k": "t1", "name": "Task 1 図表の型", "sub": "共通の型＋7種類", "col": "#3C9D5D", "blocks": [{"id": "t100", "label": "共通の型｜導入", "jp": "<b>この［図の種類］は、［年］から［年］までの［場所］における［何］を比較している。<\/b>", "en": "<b>The [chart type] compares [what is measured] in<\/b> <b>[place] over the period between [year] and [year].<\/b>"}, {"id": "t101", "label": "共通の型｜全体像", "jp": "<b>全体として、［主な傾向］であることが明確に分かる。一方で、［もう一つの特徴］。最も目立つのは、［最大の変化・差］という点である。<\/b>", "en": "<b>Overall, it is clear that [main trend], while [second<\/b> <b>feature]. The most striking feature is [the biggest<\/b> <b>change or difference].<\/b>"}, {"id": "t102", "label": "共通の型｜本文 1", "jp": "<b>まず［A］を見ると、［年］には［数値］だったことが分かる。その後、数値は［数値］まで着実に上昇し、［年］に［数値］でピークに達した。<\/b>", "en": "<b>Looking first at [A], we can see that it stood at<\/b> <b>[figure] in [year]. After that, the figure rose steadily<\/b> <b>to [figure], before reaching a peak of [figure] in<\/b> <b>[year].<\/b>"}, {"id": "t103", "label": "共通の型｜本文 2", "jp": "<b>［B］と［C］に目を向けると、数値はそれぞれ［X］と［Y］だった。対照的に、［B］は［数値］まで急激に減少したため、最高値と最低値の差は［X］から［Y］に縮まった。<\/b>", "en": "<b>Turning to [B] and [C], the figures were [X] and [Y]<\/b> <b>respectively. By contrast, [B] fell sharply to [figure],<\/b> <b>so the gap between the highest and lowest figures<\/b> <b>narrowed from [X] to [Y].<\/b>"}, {"id": "t110", "label": "折れ線グラフ｜導入", "jp": "この折れ線グラフは、2005年から2025年までの、月に1回以上ネットで買い物をした人の割合を、3つの年齢層について<b>比較している<\/b>。", "en": "The line graph <b>compares<\/b> the percentage of people in three age groups who shopped online at least once a month <b>over the period between<\/b> 2005 <b>and<\/b> 2025."}, {"id": "t111", "label": "折れ線グラフ｜全体像", "jp": "<b>全体として、<\/b>3つの年齢層すべてでネット通販の利用が広がり、<b>期間を通じて<\/b>18～34歳が<b>首位を保ったことが明確に分かる<\/b>。<b>最も目立つのは、<\/b>2015年以降の55歳以上の急激な伸びである。", "en": "<b>It can clearly be seen that<\/b> online shopping became more popular among all three groups, <b>while<\/b> 18- to 34-year-olds <b>kept the top position throughout the<\/b> <b>whole period<\/b>. <b>The most striking feature is<\/b> the rapid rise among people aged 55 and over after 2015."}, {"id": "t120", "label": "折れ線グラフ｜本文 1", "jp": "<b>まず<\/b>18～34歳<b>を見ると、<\/b>2005年<b>には<\/b>30%<b>だったことが分かる<\/b>。<b>その後、数値は<\/b>2015年に55%<b>まで着実に上昇し、<\/b>2025年<b>には<\/b>80%<b>に達した<\/b>。35～54歳も<b>同様の動きを示し、<\/b>15%<b>から<\/b>35%、<b>さらに<\/b>60%<b>へと伸びた<\/b>。", "en": "<b>Looking first at<\/b> 18- to 34-year-olds, <b>we can see<\/b> <b>that<\/b> 30% of them shopped online in 2005. <b>After<\/b> <b>that, the figure rose steadily to<\/b> 55% in 2015, <b>before reaching<\/b> 80% in 2025. The 35–54 age group <b>followed a similar pattern<\/b>, <b>climbing from<\/b> 15% <b>to<\/b> 35% <b>and then<\/b> 60%."}, {"id": "t121", "label": "折れ線グラフ｜本文 2", "jp": "55歳以上<b>に目を向けると、<\/b>2005年<b>の数値は<\/b>わずか5%で、<b>その後の10年間で<\/b>10%<b>へとわずかに増えただけだった<\/b>。<b>しかし、その後<\/b>2025年<b>までに<\/b>45%<b>へと急増した<\/b>。<b>その結果、最高値と最低値の差は<\/b>2015年の45ポイント<b>から<\/b>2025年の35ポイント<b>に縮まった<\/b>。", "en": "<b>Turning to<\/b> people aged 55 and over, <b>the figure<\/b> <b>stood at<\/b> just 5% in 2005 <b>and increased only<\/b> <b>slightly to<\/b> 10% <b>over the following decade<\/b>. <b>However, it then surged to<\/b> 45% by 2025. <b>As a<\/b> <b>result, the gap between the highest and lowest<\/b> <b>figures narrowed from<\/b> 45 percentage points in 2015 <b>to<\/b> 35 in 2025."}, {"id": "t130", "label": "棒グラフ｜導入", "jp": "この棒グラフは、2024年にある国の男性と女性が、4つの余暇活動に1週間あたり平均何時間を費やしたかを<b>比較している<\/b>。", "en": "The bar chart <b>compares<\/b> the average number of hours per week that men and women in one country spent on four leisure activities in 2024."}, {"id": "t131", "label": "棒グラフ｜全体像", "jp": "<b>全体として、<\/b>テレビ視聴が男女ともに最も人気のある活動で、<b>一方<\/b>読書は最も少なかった<b>ことが明確に分かる<\/b>。男性はテレビとスポーツに、女性は読書とSNSにより多くの時間を使っていた。", "en": "<b>Overall, it is clear that<\/b> watching TV was the most popular activity for both sexes, <b>while<\/b> reading was the least popular. Men spent more time on TV and sport, <b>whereas<\/b> women spent more on reading and social media."}, {"id": "t140", "label": "棒グラフ｜本文 1", "jp": "<b>まず<\/b>男性<b>を見ると、<\/b>テレビ視聴は週12時間で、<b>群を抜いて最も高い数値だった<\/b>。SNSが7時間で<b>2位、<\/b>スポーツが6時間で<b>それに続いた<\/b>。読書は<b>わずか<\/b>2時間で、<b>グラフ中で最も低い数値だった<\/b>。", "en": "<b>Looking first at<\/b> men, <b>we can see that<\/b> they spent 12 hours a week watching TV, <b>which was by far the<\/b> <b>highest figure<\/b>. Social media <b>came second at<\/b> 7 hours, <b>followed by<\/b> sport <b>at<\/b> 6 hours. Reading <b>accounted for just<\/b> 2 hours, <b>the lowest figure in the<\/b> <b>chart<\/b>."}, {"id": "t141", "label": "棒グラフ｜本文 2", "jp": "女性<b>に目を向けると、<\/b>テレビ<b>も最も人気のある活動で、<\/b>10時間<b>だった<\/b>。<b>しかし<\/b>女性はSNSに9時間を使い、男性<b>より2時間多く、<\/b>読書は5時間で男性<b>の2倍以上だった<\/b>。<b>対照的に、<\/b>スポーツは3時間で、男性<b>の半分にとどまった<\/b>。", "en": "<b>Turning to<\/b> women, TV <b>was also the most popular<\/b> <b>activity, at<\/b> 10 hours. <b>However,<\/b> women spent 9 hours on social media, <b>two hours more than<\/b> men, and 5 hours reading, <b>more than twice as much as<\/b> men. <b>By contrast, they did only half as much<\/b> sport <b>as<\/b> men, <b>at<\/b> 3 hours."}, {"id": "t150", "label": "円グラフ｜導入", "jp": "この2つの円グラフは、ある国で5つの電源から作られた電力の<b>割合を<\/b>、2000年<b>と<\/b>2020年<b>で比較している<\/b>。", "en": "The two pie charts <b>compare the proportions of<\/b> electricity generated from five sources in one country <b>in<\/b> 2000 <b>and<\/b> 2020."}, {"id": "t151", "label": "円グラフ｜全体像", "jp": "<b>全体として、<\/b>主な電源は石炭からガスと再生可能エネルギーに<b>置き換わり、<\/b>水力の割合は<b>変わらなかった<\/b>。<b>最も目立つ変化は、<\/b>再生可能エネルギーの急速な伸びである。", "en": "<b>Overall,<\/b> coal <b>was replaced by<\/b> gas and renewables <b>as the main sources<\/b>, <b>while<\/b> the share of hydropower <b>remained unchanged<\/b>. <b>The most<\/b> <b>striking change was<\/b> the rapid growth of renewable energy."}, {"id": "t160", "label": "円グラフ｜本文 1", "jp": "2000年<b>には、<\/b>石炭が全電力のほぼ半分<b>を占め、<\/b>45%<b>だった<\/b>。ガスは4分の1<b>を占め、<\/b>原子力は15%<b>だった<\/b>。<b>しかし<\/b>2020年<b>までに、<\/b>石炭の割合は20%<b>に低下し、<\/b>原子力も10%<b>へとわずかに減少していた<\/b>。石炭は<b>合計<\/b>25ポイント<b>の減少だった<\/b>。", "en": "<b>In<\/b> 2000, coal <b>accounted for<\/b> almost half of all electricity, <b>at<\/b> 45%. Gas <b>made up<\/b> a quarter, <b>while<\/b> nuclear power <b>represented<\/b> 15%. <b>By<\/b> 2020, <b>however,<\/b> coal&#x27;s share <b>had fallen to<\/b> 20%, <b>and<\/b> nuclear power <b>had also declined slightly to<\/b> 10%. <b>This represented a total fall of<\/b> 25 percentage points <b>for<\/b> coal."}, {"id": "t161", "label": "円グラフ｜本文 2", "jp": "<b>ほかの電源に目を向けると、<\/b>再生可能エネルギーはわずか5%<b>から<\/b>30%<b>へと大幅に伸び、元の6倍になった<\/b>。ガスも25%<b>から<\/b>30%<b>に上昇した<\/b>。<b>その結果、<\/b>この2つで2020年の電力の60%<b>を占めた<\/b>。水力は<b>両年とも<\/b>10%<b>のままだった<\/b>。<b>つまり、<\/b>再生可能エネルギーは2000年<b>に首位だった<\/b>石炭<b>を追い抜いたことになる<\/b>。", "en": "<b>Turning to the other sources,<\/b> renewables <b>grew<\/b> <b>dramatically from<\/b> just 5% <b>to<\/b> 30%, <b>six times the<\/b> <b>original figure<\/b>, <b>and<\/b> gas <b>rose from<\/b> 25% <b>to<\/b> 30%. <b>As<\/b> <b>a result, these two sources together accounted for<\/b> 60% of electricity in 2020. Hydropower <b>stayed at<\/b> 10% <b>in both years<\/b>. <b>In other words,<\/b> renewables <b>overtook<\/b> coal, <b>which had been the leading source<\/b> <b>in<\/b> 2000."}, {"id": "t170", "label": "表｜導入", "jp": "この表は、2023年の4つの大学を、学生数、留学生の割合、卒業生の就職率<b>という点で比較している<\/b>。", "en": "The table <b>compares<\/b> four universities <b>in terms of<\/b> their student numbers, the proportion of international students and graduate employment rates in 2023."}, {"id": "t171", "label": "表｜全体像", "jp": "<b>全体として、<\/b>A大学が最も規模が大きかった<b>が、<\/b>留学生の割合と就職率は<b>どちらも<\/b>B大学が最も高かった。C大学は<b>この2つの項目でいずれも最低だった<\/b>。", "en": "<b>Overall,<\/b> University A <b>was the largest<\/b>, <b>but<\/b> University B <b>had the highest figures for both<\/b> international students and graduate employment. University C <b>recorded the lowest figures in both of<\/b> <b>these categories<\/b>."}, {"id": "t180", "label": "表｜本文 1", "jp": "<b>まず<\/b>学生数<b>を見ると、<\/b>A大学は3万人で、1万6千人のB大学<b>のほぼ2倍だった<\/b>。C大学とD大学は<b>はるかに小さく、それぞれ<\/b>1万2千人<b>と<\/b>8千人<b>だった<\/b>。A大学とB大学<b>を合わせると、<\/b>4大学の学生全体<b>の3分の2以上を占めていた<\/b>。", "en": "<b>Looking first at<\/b> student numbers, University A <b>had<\/b> 30,000 students, <b>almost twice as many as<\/b> University B, <b>at<\/b> 16,000. Universities C and D <b>were<\/b> <b>much smaller, with<\/b> 12,000 <b>and<\/b> 8,000 students <b>respectively<\/b>. <b>Together,<\/b> Universities A and B <b>accounted for more than two thirds of<\/b> all the students at the four institutions."}, {"id": "t181", "label": "表｜本文 2", "jp": "留学生<b>に目を向けると、最も割合が高かったのは<\/b>B大学で、学生の40%<b>が海外出身だった<\/b>。<b>これに対し、<\/b>A大学は25%、C大学は<b>わずか<\/b>10%<b>だった<\/b>。就職率<b>では、<\/b>B大学が92%で<b>再び首位となり、<\/b>C大学は78%で<b>最も低かった<\/b>。A大学とD大学<b>の数値は近く、それぞれ<\/b>85%<b>と<\/b>88%<b>だった<\/b>。", "en": "<b>Turning to<\/b> international students, <b>the highest<\/b> <b>proportion was at<\/b> University B, <b>where<\/b> 40% <b>of<\/b> <b>students came from abroad, compared with<\/b> 25% <b>at<\/b> University A <b>and only<\/b> 10% <b>at<\/b> University C. <b>In<\/b> <b>terms of<\/b> employment, University B <b>again came<\/b> <b>first, with<\/b> 92%, <b>while<\/b> University C <b>had the lowest<\/b> <b>rate, at<\/b> 78%. <b>The figures for<\/b> A <b>and<\/b> D <b>were similar,<\/b> <b>at<\/b> 85% <b>and<\/b> 88% <b>respectively<\/b>."}, {"id": "t190", "label": "複合グラフ｜導入", "jp": "この棒グラフは2016年から2024年にある都市を訪れた観光客数を示し、<b>折れ線グラフは<\/b>観光客1人あたりの平均支出額<b>を示している<\/b>。", "en": "The bar chart <b>shows<\/b> the number of tourists who visited a city <b>between<\/b> 2016 <b>and<\/b> 2024, <b>while the<\/b> <b>line graph shows<\/b> the average amount each tourist spent."}, {"id": "t191", "label": "複合グラフ｜全体像", "jp": "<b>全体として、<\/b>観光客数は2020年に急減した<b>後、<\/b>2024年に<b>期間中の最高水準まで回復した<\/b>。<b>対照的に、<\/b>平均支出額は<b>逆の動きを示し、<\/b>2020年に<b>ピークに達した後、減少した<\/b>。", "en": "<b>Overall,<\/b> tourist numbers fell sharply in 2020 <b>before<\/b> <b>recovering to their highest level<\/b> in 2024. <b>By<\/b> <b>contrast,<\/b> average spending <b>moved in the opposite<\/b> <b>direction, peaking<\/b> in 2020 <b>and then declining<\/b>."}, {"id": "t1100", "label": "複合グラフ｜本文 1", "jp": "<b>まず<\/b>観光客数<b>を見ると、<\/b>2016年は400万人で、<b>この数値は2年後に<\/b>500万人<b>に増えた<\/b>。<b>しかしその後、<\/b>2020年に150万人<b>へと激減した<\/b>。<b>その後は着実に回復し、<\/b>2022年に350万人、2024年に<b>は<\/b>600万人<b>でピークに達した<\/b>。", "en": "<b>Looking first at<\/b> visitor numbers, the city <b>received<\/b> 4 million tourists in 2016, <b>and this figure rose to<\/b> 5 million <b>two years later<\/b>. <b>However, it then dropped<\/b> <b>dramatically to<\/b> 1.5 million in 2020. <b>After that,<\/b> <b>numbers recovered steadily, reaching<\/b> 3.5 million in 2022 <b>and a peak of<\/b> 6 million in 2024."}, {"id": "t1101", "label": "複合グラフ｜本文 2", "jp": "支出額<b>に目を向けると、<\/b>観光客1人あたりの平均は2016年に300ポンドで、2018年に<b>は<\/b>320ポンド<b>へとわずかに増えた<\/b>。<b>その後<\/b>2020年に450ポンド<b>へと跳ね上がり、期間中の最高値となった<\/b>。<b>それ以降は<\/b>2022年に400ポンド、2024年に350ポンド<b>へと徐々に減少した<\/b>。", "en": "<b>Turning to<\/b> spending, <b>the average figure per tourist<\/b> <b>was<\/b> £300 in 2016 <b>and increased slightly to<\/b> £320 in 2018. <b>It then jumped to<\/b> £450 in 2020, <b>the highest<\/b> <b>point in the period<\/b>. <b>Since then, it has gradually<\/b> <b>fallen, to<\/b> £400 in 2022 <b>and<\/b> £350 in 2024."}, {"id": "t1110", "label": "地図｜導入", "jp": "この2枚の地図は、1995年から現在までに、ある海辺の村<b>で起きた変化を示している<\/b>。北は地図の上側である。", "en": "The two maps <b>illustrate the changes that have<\/b> <b>taken place in<\/b> a small coastal village <b>between<\/b> 1995 <b>and the present day<\/b>. North is at the top of both maps."}, {"id": "t1111", "label": "地図｜全体像", "jp": "<b>全体として、<\/b>村は漁村から観光地<b>へと大きく変わった<\/b>。幹線道路と森は<b>ほぼそのままだが、<\/b>海沿いにはいくつもの新しい施設<b>が建てられた<\/b>。", "en": "<b>Overall,<\/b> the village <b>has been transformed from<\/b> a fishing community <b>into<\/b> a tourist destination. <b>While<\/b> the main road and the forest <b>remain largely<\/b> <b>unchanged,<\/b> several new facilities <b>have been built<\/b> along the coast."}, {"id": "t1120", "label": "地図｜本文 1", "jp": "1995年<b>には、<\/b>村の<b>南部に<\/b>小さな漁港があり、幹線道路<b>沿いに<\/b>家が並んでいた。道路<b>の東側の土地は<\/b>農地<b>として使われていた<\/b>。<b>それ以来、<\/b>漁港はマリーナ<b>に置き換えられ、<\/b>農地は駐車場付きのホテル<b>に転用された<\/b>。", "en": "<b>In<\/b> 1995, <b>there was<\/b> a small fishing harbour <b>in the<\/b> <b>south of<\/b> the village, <b>with<\/b> a row of houses <b>along<\/b> the main road. <b>The area to the east of<\/b> the road <b>was<\/b> <b>used as<\/b> farmland. <b>Since then,<\/b> the harbour <b>has<\/b> <b>been replaced by<\/b> a marina, <b>and<\/b> the farmland <b>has<\/b> <b>been converted into<\/b> a hotel <b>with<\/b> a car park."}, {"id": "t1121", "label": "地図｜本文 2", "jp": "<b>さらに、<\/b>マリーナ<b>の西側の<\/b>砂浜が整備され、<b>その隣に<\/b>カフェと商店<b>が建てられた<\/b>。幹線道路は<b>北へ延長され、<\/b>新しい鉄道駅<b>とつながった<\/b>。<b>一方、<\/b>北西の森は<b>変わらず残り、<\/b>村で唯一の自然林<b>となっている<\/b>。", "en": "<b>In addition,<\/b> the beach <b>to the west of<\/b> the marina <b>has been developed, with<\/b> a café and a row of shops <b>built next to it<\/b>. The main road <b>has been<\/b> <b>extended northwards to<\/b> a new railway station. <b>However,<\/b> the forest <b>in the north-west<\/b> <b>has<\/b> <b>remained unchanged, providing<\/b> the only natural woodland <b>in the village<\/b>."}, {"id": "t1130", "label": "工程図｜導入", "jp": "この図は、カカオの実の収穫から完成品までの、チョコレート<b>が作られる工程を示している<\/b>。", "en": "The diagram <b>illustrates the process by which<\/b> chocolate <b>is produced<\/b>, <b>from<\/b> the harvesting of cocoa pods <b>to<\/b> the finished product."}, {"id": "t1131", "label": "工程図｜全体像", "jp": "<b>全体として、この工程は<\/b>8つの<b>主要な段階から成る<\/b>。<b>最初の3段階は<\/b>農園<b>で行われ、<\/b>輸送<b>を経て、残りの4段階は<\/b>工場<b>で行われる<\/b>。", "en": "<b>Overall, the process consists of<\/b> eight <b>main stages<\/b>. <b>The first three take place on<\/b> the farm, <b>followed by<\/b> transport, <b>while the last four are carried out in<\/b> a factory."}, {"id": "t1140", "label": "工程図｜本文 1", "jp": "<b>最初の段階では、<\/b>熟したカカオの実<b>が収穫され、<\/b>豆<b>が取り出される<\/b>。<b>次に、<\/b>豆は数日間<b>発酵させられ、その後<\/b>広げて天日で<b>乾燥される<\/b>。豆が<b>乾燥すると、<\/b>袋に詰められ、チョコレート工場<b>へ運ばれる<\/b>。", "en": "<b>At the first stage,<\/b> ripe cocoa pods <b>are harvested<\/b> <b>and<\/b> the beans <b>are removed<\/b>. <b>These are then left to<\/b> ferment <b>for several days, after which they are<\/b> spread out and dried in the sun. <b>Once<\/b> the beans <b>have dried, they are<\/b> packed into sacks <b>and<\/b> <b>transported to<\/b> a chocolate factory."}, {"id": "t1141", "label": "工程図｜本文 2", "jp": "工場<b>では、<\/b>豆<b>はまず<\/b>焙煎<b>され、<\/b>風味が引き出される。<b>次に、<\/b>カカオマス<b>と呼ばれる<\/b>濃い液体<b>にすりつぶされる<\/b>。<b>これに<\/b>砂糖と牛乳<b>が加えられる<\/b>。<b>最後に、<\/b>混ぜたものが型<b>に流し込まれて<\/b>冷やされ、包装されて店<b>へ送られる<\/b>。", "en": "<b>At<\/b> the factory, the beans <b>are first<\/b> roasted, <b>which<\/b> <b>helps to<\/b> develop their flavour. <b>Next, they are<\/b> <b>ground into<\/b> a thick liquid <b>known as<\/b> cocoa mass. <b>This is then mixed with<\/b> sugar and milk. <b>Finally,<\/b> the mixture <b>is poured into<\/b> moulds <b>and<\/b> cooled, <b>before<\/b> the bars <b>are wrapped and sent to<\/b> shops."}]}], "E": {"P1": [{"k": "work", "name": "仕事", "intro": "Let's talk about what you do.", "hint": "p100", "first": true, "qs": ["Do you work or are you a student?", "What do you do in your job?", "Why did you choose this job?", "What do you like most about your job?", "Would you like to change your job in the future?"], "ia": "x_2e0055e0", "qa": ["x_3299ed52", "x_3aacef33", "x_5d3537b8", "x_559fda65", "x_32957532"], "m": [["I work.", "#p100:0,1"], ["#p100:0", "I mainly teach modern and classical Japanese literature.", "#p100:2"], ["I chose it because I love stories and I enjoy explaining things.", "#p100:1"], ["#p100:1", "It makes all the hard work worth it."], ["Not completely. My dream is to teach at a university one day.", "#p100:2", "I hope this experience will help me in the future."]]}, {"k": "home", "name": "住まい", "intro": "Let's talk about where you live.", "hint": "p101", "first": true, "qs": ["Where do you live?", "What do you like most about the area where you live?", "Is there anything you would like to change about your area?", "Do you think you will live there for a long time?"], "ia": "x_b45ef03d", "qa": ["x_b035a709", "x_e49b1ae7", "x_550e3260", "x_1e871c63"], "m": [["#p101:0,1"], ["#p101:1,2"], ["Maybe the trains, because they are very crowded in the morning.", "But I would never change the sea.", "#p101:2"], ["Yes, I think so.", "#p101:1", "It is hard to imagine living far from the sea."]]}, {"k": "family", "name": "家族", "intro": "Let's talk about your family.", "hint": "p102", "qs": ["Do you spend a lot of time with your family?", "Who are you closest to in your family?", "Did your family often eat together when you were a child?"], "ia": "x_9feffe65", "qa": ["x_d8a7ed8e", "x_f4422abb", "x_69294a61"], "m": [["Not as much as I would like, because I live on my own now.", "But I often think about my mother.", "#p102"], ["I am closest to my mother.", "#p102"], ["Yes, we did.", "#p102:0", "Sukiyaki was a family favourite, especially on special days."]]}, {"k": "free", "name": "休日・趣味", "intro": "Let's talk about your free time.", "hint": "p103", "qs": ["What do you usually do in your free time?", "What did you do last weekend?", "Do you prefer spending your free time alone or with other people?"], "ia": "x_7c300aac", "qa": ["x_b2e7601d", "x_51aecaa2", "x_800db76b"], "m": [["#p103"], ["Last weekend was quite typical for me.", "#p103"], ["I prefer spending it with other people.", "#p103"]]}, {"k": "friends", "name": "友達", "intro": "Let's talk about friends.", "hint": "p103", "qs": ["Do you have a lot of friends?", "What do you usually do with your friends?", "Is it easy to make new friends as an adult?"], "ia": "x_a247d99f", "qa": ["x_172c1e4a", "x_2418bf7b", "x_f9604b9e"], "m": [["Not a lot, but I have a few close friends.", "My best friend is Nasa.", "#3a1:0,1"], ["#p103"], ["Not really, because adults are so busy.", "But it is easier if you share a goal. I met my friend Nasa at my old job.", "#3a1:2"]]}, {"k": "phone", "name": "スマホ・アプリ", "intro": "Let's talk about technology.", "hint": "p104", "qs": ["How often do you use your phone?", "Which apps do you use the most?", "Do you use AI in your daily life?", "Has technology changed the way you study?"], "ia": "x_1cb2394d", "qa": ["x_92e76ad0", "x_5fb00e55", "x_b7e2c5f9", "x_f3623db9"], "m": [["Every day, probably too much!", "#p104:0"], ["Probably AI apps, for both study and work.", "#p104:2"], ["Yes, I use it almost every day, mainly for study and work.", "#p104:2"], ["Yes, a lot.", "#p104:0", "For example, I use AI to check my English writing."]]}, {"k": "travel", "name": "旅行", "intro": "Let's talk about travelling.", "hint": "p110", "qs": ["Do you like travelling?", "Where did you go on your last trip?", "Do you prefer travelling alone or with other people?"], "ia": "x_35dc86db", "qa": ["x_b5bfc375", "x_f3dd7f2d", "x_a026c9af"], "m": [["I like it, but to be honest, I don't travel far very often.", "#p110:1,2"], ["My last trip was a short one to Minato Mirai in Yokohama.", "#p110:2", "It is my favourite place."], ["I prefer travelling with a friend, because we can talk about what we see.", "#p110:1"]]}, {"k": "health", "name": "運動・リラックス", "intro": "Let's talk about exercise and relaxing.", "hint": "p111", "qs": ["Do you do any exercise?", "How do you relax when you feel stressed?", "Do you like walking?"], "ia": "x_866f78eb", "qa": ["x_1edf6070", "x_0cb2c8da", "x_3b48e9d7"], "m": [["#p111:0,1"], ["#p111:1", "I also talk to my family or friends about my worries."], ["Yes, I love it.", "#p111:1"]]}, {"k": "food", "name": "食べ物・料理", "intro": "Let's talk about food.", "hint": "p112", "qs": ["What is your favourite food?", "Do you like cooking?", "Do you prefer eating at home or eating out?"], "ia": "x_2d72180e", "qa": ["x_2842e01d", "x_a686596e", "x_aa5f0442"], "m": [["#p112"], ["Yes, I try to cook for myself.", "#1a3:0"], ["I prefer eating at home, because home cooking is healthier.", "#p112:0,2"]]}, {"k": "read", "name": "読書・映画", "intro": "Let's talk about reading.", "hint": "p113", "qs": ["Do you like reading?", "What kind of books do you enjoy?", "Do you prefer reading books or watching films?"], "ia": "x_98b266fe", "qa": ["x_2ed803a5", "x_ec8d820e", "x_eed619b6"], "m": [["Yes, very much.", "#p113"], ["I enjoy short stories, especially Japanese classics.", "#p113:1,2"], ["I prefer books, because I can imagine the scenes myself.", "#p113:0"]]}, {"k": "news", "name": "ニュース", "intro": "Let's talk about the news.", "hint": "p114", "qs": ["How do you usually get the news?", "Are you interested in the news?", "What kind of news do you pay attention to?"], "ia": "x_b3ceb1a6", "qa": ["x_e3fe0ff8", "x_f99b0be3", "x_b51bc2e4"], "m": [["#p114:0", "I like it because I can read it anywhere."], ["Yes, especially news about education.", "#p114:1,2"], ["I mostly follow news about education and society.", "#p114:1,2"]]}, {"k": "sea", "name": "海・川", "intro": "Let's talk about the sea.", "hint": "p101", "near": "住まい（海が近い）＋運動（海沿いを歩く）でつなぐ", "qs": ["Do you live near the sea or a river?", "Do you like going to the sea?", "What do people in your country do by the sea?"], "ia": "x_8dc5c13c", "qa": ["x_ae6eb7df", "x_17849f99", "x_a1418028"], "m": [["Yes, I do.", "#p101:0,1"], ["Yes, I love it.", "#p111:1"], ["In summer, many people swim or have barbecues.", "In cities like Yokohama, people just walk along the sea and enjoy the view.", "#p110:2"]]}, {"k": "weather", "name": "天気", "intro": "Let's talk about the weather.", "hint": "p111", "near": "カードにない話題。「天気がいい日は海沿いを歩く」（運動）につなぐ", "qs": ["What is the weather like where you live?", "What kind of weather do you like best?", "Does the weather change your mood?"], "ia": "x_e8c09fda", "qa": ["x_c2f9e753", "x_9b7cf16e", "x_ee26176a"], "m": [["Yokohama has four seasons. Summer is hot and humid, and winter is cold but sunny.", "Because it is by the sea, there is often a nice breeze."], ["I like sunny autumn days, when it is not too hot.", "On days like that, I love being outside.", "#p111:1"], ["Yes, a little. Rainy days make me feel tired.", "But when it is sunny, I go out for a walk.", "#p111:1"]]}, {"k": "music", "name": "音楽", "intro": "Let's talk about music.", "hint": "p111", "near": "カードにない話題。「歩きながら聞く・落ち着く」（運動・リラックス）につなぐ", "qs": ["Do you listen to music often?", "What kind of music do you like?", "Did you learn to play an instrument as a child?"], "ia": "x_144ee0ef", "qa": ["x_6c39229a", "x_37153f35", "x_55e7aa3d"], "m": [["Yes, mostly when I am walking or studying.", "Music helps me focus and relax."], ["I like calm music, such as piano music.", "I often listen to it when I study with my friend Nasa."], ["No, I didn't. I was more interested in reading stories.", "#p113:1"]]}, {"k": "shop", "name": "買い物", "intro": "Let's talk about shopping.", "hint": "p101", "near": "カードにない話題。「みなとみらいのお店」（住まい・旅行）につなぐ", "qs": ["Do you like shopping?", "Do you prefer shopping online or in shops?", "Where do you usually go shopping?"], "ia": "x_bcd2c088", "qa": ["x_530f998d", "x_2d63b8dd", "x_7cf18268"], "m": [["Not really, but I enjoy looking around the shops at Minato Mirai.", "#2a1:1"], ["I usually shop online because I am busy.", "But I like going to real shops when I visit Minato Mirai with friends."], ["I usually go to Minato Mirai.", "#2a1:1"]]}], "P2": [{"t": 1, "tag": "①A・B", "q": "Describe a person who taught you something important.", "say": ["who this person is", "how you know this person", "what this person taught you"], "ex": "and explain why it was important to you.", "en": "The person who taught me the most is actually my mother, although I only realised it after I started living on my own.", "jp": "一番多くを教えてくれたのは母。気づいたのは一人暮らしを始めてから。", "p3": [{"q": "Is it important for families to spend time together?", "t": 1, "tag": "①続き 核", "en": "", "jp": "家族で食卓を囲む時間が減っている → 心にも体にも大切（①続きの核）", "a": "x_0cdabfac", "m": ["Yes, very important, because family meals are a chance to share our worries.", "#1c1:2", "#1a4"]}, {"q": "What makes a good teacher?", "t": 3, "tag": "③B", "en": "", "jp": "なさくんのように、分かるまで付き合ってくれる人（③B）", "a": "x_6989335c", "m": ["I think a good teacher is someone who never gives up on students.", "My friend Nasa, who is also a teacher, is a good example.", "#3a3", "A good teacher does the same for students."]}, {"q": "Will AI replace teachers?", "t": 3, "tag": "③A（本体）＋ 教育", "en": "I doubt it. Someone still has to teach children to think things through.", "jp": "ないと思う。考え抜く力を教える人は必要。", "a": "x_423dbf99", "m": ["I doubt it. If students rely on AI for answers, someone still has to teach them to think things through.", "Also, AI only helps students who can use it.", "#3c1:1", "#3c2"]}, {"q": "Should governments encourage healthy lifestyles?", "t": 2, "tag": "責任論 ＋ 貧困", "en": "Yes. People alone cannot change long working hours, so it is the government that must act.", "jp": "はい。長時間労働は個人では変えられないので、動くべきは政府。", "a": "x_f5366d93", "m": ["~I think", "they should, especially for children.", "~One reason is the cost.", "Some families", "~simply can't afford to", "join a gym or buy healthy food.", "~For example,", "a free school lunch can make a real difference to a family on a tight budget.", "~In the long run, that can", "reduce medical costs for everyone.", "~That's why I think", "the government should help, especially with children's meals."]}], "a": "x_80887bce", "top": "a person who taught me something important", "m": ["The person who taught me the most is actually my mother.", "She taught me through her cooking, especially a dish called sukiyaki.", "#1a1", "#1a2", "#1a3", "#1a4", "What she taught me is that cooking for someone is a way of saying, 'I care about you.'"]}, {"t": 1, "tag": "①A・B", "q": "Describe a family member
